# ═══════════ MỘT BỘ CỔNG, HAI NƠI GỌI ═══════════
#
# Bốn cổng chất lượng của kho này (toàn vẹn · typecheck · lint · test · build) sống ĐÚNG MỘT chỗ,
# và được gọi lại từ:
#
#   · `ci.yml`         — mỗi pull request, để `main` có cái gì đó để bắt buộc;
#   · `deploy-vps.yml` — trước khi đụng máy chủ (trừ khi chính SHA ấy đã có một lượt cổng XANH
#                        trên `main` — xem job `bang_chung` của deploy-vps.yml).
#
# VÌ SAO KHÔNG CHÉP SANG HAI TỆP: hai bộ cổng cùng tên sẽ trôi xa nhau, và cái trôi chậm hơn là
# cái người ta tin. Ngày `npm test` thêm một bài mới, chỉ một bên chạy nó — mà không ai thấy.
#
# ═══════════ BỐN NHÁNH SONG SONG, MỘT CHECK BẮT BUỘC ═══════════
#
# TRƯỚC (đo 06/10/2026 trên 30 lượt CI xanh gần nhất — `docs/ai-tech-room/delivery-v2.md`): MỘT job
# chạy NỐI ĐUÔI typecheck 1,6′ + lint 0,8′ + bộ kiểm thử 14,9′ + bộ kiểm thử lần hai 15,0′ + build
# 4,3′ ⇒ job median 37,3′, p95 39,5′ — và deploy chạy lại y nguyên 37′ đó trước khi chạm máy chủ.
# Không bước nào cần đầu ra của bước nào: chúng chỉ xếp hàng vì nằm chung một job.
#
# SAU: bốn job chạy CÙNG LÚC trên bốn máy riêng, đường găng = một lượt kiểm thử (~15′ + cài đặt).
# Không bài kiểm nào bị bỏ, không bước nào bị nới: cùng bốn lệnh, cùng hai chế độ xác thực.
#
# MATRIX CHỈ Ở HAI NHÁNH KIỂM THỬ, KHÔNG BAO GIỜ Ở JOB GOM: ruleset của `main` bắt buộc ĐÚNG một check
# tên `gates / gates`. Matrix trên job gom biến tên thành `gates / gates (x)` và check bắt buộc không bao
# giờ xuất hiện. Tên `gates` thuộc về job GOM đứng đầu tệp; các job làm việc mang tên riêng và KHÔNG bắt
# buộc từng cái — job gom bắt buộc thay cho cả bốn nhánh (kể cả mọi shard của chúng).
#
# ═══════════ BỘ KIỂM THỬ CHIA SHARD (20/10/2026) ═══════════
#
# Một lượt `npm test` đã chạm 43–45′ và hai lượt cổng hôm nay bị HUỶ ở trần 45′ khi đang chạy (#919,
# #923). Không nâng trần, không bỏ bài: mỗi nhánh kiểm thử chạy `matrix.shard` 1..4, mỗi shard một phần
# các KHỐI của `tests/sync-fixtures.test.ts` (sổ khối + bảng phân ở `tests/test-shards.ts`, phần dựng
# fixture chung chạy ở mọi shard). Mỗi shard tải lên một tệp BẰNG CHỨNG (khối đã chạy · SHA · cây), và job
# gom đòi: đủ 4 shard ở MỖI chế độ, cùng SHA + cùng cây với nhánh tĩnh, hợp các khối đã chạy = sổ khối,
# không khối nào chạy hai lần. `npm test` không tham số vẫn chạy ĐỦ (máy dev, deploy cục bộ).
# `fail-fast: false`: một shard đỏ không huỷ shard khác — huỷ là mất thông tin ba shard kia có xanh không.
#
# VÌ SAO JOB GOM LUÔN CHẠY (`if: always()`): job phụ thuộc bị BỎ QUA khi một job cần nó đỏ, và GitHub
# coi một check bắt buộc ở trạng thái "skipped" là ĐẠT. Thiếu `always()` thì đúng lúc một nhánh đỏ,
# check bắt buộc lại xanh. Job gom vì thế luôn chạy và tự đỏ nếu BẤT KỲ nhánh nào không phải
# `success` (kể cả `cancelled` / `skipped`). `tests/delivery-v2.test.ts` khoá điều đó.
name: Cổng chất lượng

on:
  workflow_call:
    inputs:
      ref:
        description: "SHA cần kiểm. Bỏ trống thì dùng ref mặc định của lượt gọi."
        type: string
        required: false
    outputs:
      sha:
        # BẢN ĐƯỢC KIỂM PHẢI LÀ BẢN ĐƯỢC TRIỂN KHAI — và câu đó chỉ đáng tin khi ĐO ĐƯỢC.
        # Đây là SHA mà bản checkout của cổng THẬT SỰ đứng trên, đọc bằng `git rev-parse` sau khi
        # checkout xong, chứ không phải tham số đầu vào chép lại. Bốn nhánh checkout RIÊNG, nên job
        # gom đòi cả bốn SHA trùng nhau rồi mới đưa ra một SHA. `release` so nó với SHA của ảnh
        # Docker và dừng nếu lệch: một lời khẳng định trong chú thích không chặn được gì.
        description: "SHA mà cổng thật sự đã kiểm (đọc từ bản checkout, không chép lại đầu vào)."
        value: ${{ jobs.gates.outputs.sha }}

permissions:
  contents: read

# ═══ JOB GOM ĐỨNG ĐẦU — TÊN `gates` LÀ KHOÁ CỦA `main`, ĐỪNG ĐỔI ═══
jobs:
  gates:
    needs: [tinh, kiem_thu, kiem_thu_token, dung_ban]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gom.outputs.sha }}
      tree: ${{ steps.gom.outputs.tree }}
    steps:
      - name: Gom bốn nhánh cổng — đỏ nếu BẤT KỲ nhánh nào không xanh, và bốn SHA phải trùng
        id: gom
        env:
          KQ_TINH: ${{ needs.tinh.result }}
          KQ_KIEM_THU: ${{ needs.kiem_thu.result }}
          KQ_KIEM_THU_TOKEN: ${{ needs.kiem_thu_token.result }}
          KQ_DUNG_BAN: ${{ needs.dung_ban.result }}
          SHA_TINH: ${{ needs.tinh.outputs.sha }}
          SHA_KIEM_THU: ${{ needs.kiem_thu.outputs.sha }}
          SHA_KIEM_THU_TOKEN: ${{ needs.kiem_thu_token.outputs.sha }}
          SHA_DUNG_BAN: ${{ needs.dung_ban.outputs.sha }}
          TREE_TINH: ${{ needs.tinh.outputs.tree }}
          TREE_KIEM_THU: ${{ needs.kiem_thu.outputs.tree }}
          TREE_KIEM_THU_TOKEN: ${{ needs.kiem_thu_token.outputs.tree }}
          TREE_DUNG_BAN: ${{ needs.dung_ban.outputs.tree }}
        run: |
          set -euo pipefail
          hong=0
          for cap in "toàn vẹn · kiểu · chuẩn mã=$KQ_TINH" "kiểm thử=$KQ_KIEM_THU" "kiểm thử có token=$KQ_KIEM_THU_TOKEN" "dựng bản=$KQ_DUNG_BAN"; do
            echo "  ${cap%%=*}: ${cap#*=}"
            if [ "${cap#*=}" != "success" ]; then hong=1; fi
          done
          if [ "$hong" != "0" ]; then
            echo "::error::Cổng ĐỎ — ít nhất một nhánh không xanh (cancelled / skipped cũng là đỏ: một nhánh không chạy không chứng minh được gì)."
            exit 1
          fi
          if [ -z "$SHA_TINH" ] || [ "$SHA_TINH" != "$SHA_KIEM_THU" ] || [ "$SHA_TINH" != "$SHA_KIEM_THU_TOKEN" ] || [ "$SHA_TINH" != "$SHA_DUNG_BAN" ]; then
            echo "::error::Bốn nhánh cổng đứng trên các SHA khác nhau ($SHA_TINH · $SHA_KIEM_THU · $SHA_KIEM_THU_TOKEN · $SHA_DUNG_BAN) — DỪNG."
            exit 1
          fi
          echo "sha=$SHA_TINH" >> "$GITHUB_OUTPUT"
          echo "✓ Cả bốn nhánh xanh trên $SHA_TINH"
          if [ -z "$TREE_TINH" ] || [ "$TREE_TINH" != "$TREE_KIEM_THU" ] || [ "$TREE_TINH" != "$TREE_KIEM_THU_TOKEN" ] || [ "$TREE_TINH" != "$TREE_DUNG_BAN" ]; then
            echo "::error::Bốn nhánh cổng đứng trên các CÂY mã khác nhau — DỪNG."
            exit 1
          fi
          echo "tree=$TREE_TINH" >> "$GITHUB_OUTPUT"
          # Ghi lại CÂY mã mà cổng THẬT SỰ đã kiểm (chỉ tới được dòng này khi cả bốn nhánh xanh).
          # `deploy-vps.yml::bang_chung` đọc tệp này để dùng lại bằng chứng khi squash đổi SHA mà
          # không đổi cây. Tệp chỉ GHI NHẬN, không đổi kết quả của nhánh nào.
          mkdir -p "$RUNNER_TEMP/tested-tree"
          printf 'tree=%s\ncommit=%s\nrun_id=%s\nrun_attempt=%s\n' "$TREE_TINH" "$SHA_TINH" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/tested-tree/tested-tree.txt"
      - name: Tải bằng chứng của mọi shard kiểm thử
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Mỗi khối kiểm thử chạy ĐÚNG MỘT lần ở mỗi chế độ — đủ shard, cùng SHA, cùng cây
        id: shard
        env:
          SHARDS_DIR: ${{ runner.temp }}/shards
          SHARD_COUNT: "4"
          SHA_TINH: ${{ needs.tinh.outputs.sha }}
          TREE_TINH: ${{ needs.tinh.outputs.tree }}
        # Node chứ không jq: cùng một kịch bản chạy THẬT trong `tests/test-shards-plan.test.ts` trên máy dev.
        run: |
          node - <<'KIEM_SHARD'
          const fs = require("fs");
          const path = require("path");
          const dir = process.env.SHARDS_DIR;
          const n = Number(process.env.SHARD_COUNT);
          const hong = (m) => { console.log(`::error::${m}`); process.exit(1); };
          const tep = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => /^shard-.+\.json$/.test(f)) : [];
          for (const mode of ["an-danh", "token"]) {
            const ds = tep.filter((f) => f.startsWith(`shard-${mode}-`)).map((f) => JSON.parse(fs.readFileSync(path.join(dir, f), "utf8")));
            if (ds.length !== n) hong(`${mode}: có ${ds.length}/${n} bằng chứng shard — thiếu shard là thiếu khối kiểm thử`);
            const can = Array.from({ length: n }, (_, i) => `${i + 1}/${n}`);
            const co = ds.map((d) => d.shard).sort();
            if (JSON.stringify(co) !== JSON.stringify(can)) hong(`${mode}: các shard ${JSON.stringify(co)} không phải đúng ${JSON.stringify(can)}`);
            const all = JSON.stringify(ds[0].all);
            for (const d of ds) {
              if (d.mode !== mode) hong(`${mode}: bằng chứng shard ${d.shard} khai chế độ ${d.mode}`);
              if (JSON.stringify(d.all) !== all) hong(`${mode}: shard ${d.shard} đọc một sổ khối khác`);
              if (!d.sha || d.sha !== process.env.SHA_TINH) hong(`${mode}: shard ${d.shard} đứng trên SHA ${d.sha}, nhánh tĩnh ${process.env.SHA_TINH}`);
              if (!d.tree || d.tree !== process.env.TREE_TINH) hong(`${mode}: shard ${d.shard} đứng trên một CÂY mã khác`);
            }
            const ran = ds.flatMap((d) => d.ran);
            const lap = [...new Set(ran.filter((x, i) => ran.indexOf(x) !== i))];
            if (lap.length) hong(`${mode}: khối chạy HAI lần: ${lap.join(", ")}`);
            const roi = ds[0].all.filter((x) => !ran.includes(x));
            if (roi.length) hong(`${mode}: khối KHÔNG shard nào chạy: ${roi.join(", ")}`);
            const la = ran.filter((x) => !ds[0].all.includes(x));
            if (la.length) hong(`${mode}: khối ngoài sổ: ${la.join(", ")}`);
            console.log(`✓ ${mode}: ${ran.length}/${ds[0].all.length} khối, mỗi khối đúng một lần, ${n} shard trên ${process.env.SHA_TINH}`);
          }
          KIEM_SHARD
      - name: Lưu cây mã đã qua cổng (bằng chứng cho deploy)
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-tree/tested-tree.txt
          retention-days: 30
          if-no-files-found: error

  # ═══ NHÁNH 1 · TOÀN VẸN KHO + KIỂU DỮ LIỆU + CHUẨN MÃ NGUỒN (~3′) ═══
  tinh:
    name: Toàn vẹn · kiểu · chuẩn mã
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.ghim.outputs.sha }}
      tree: ${{ steps.ghim.outputs.tree }}
    steps:
      # BẢN ĐƯỢC KIỂM PHẢI LÀ BẢN ĐƯỢC DÙNG: ghim thẳng vào SHA thay vì tên nhánh. Nhánh có thể
      # được đẩy tiếp trong lúc workflow đang chạy (hai phiên làm việc song song), và khi đó "main"
      # ở bước kiểm với "main" ở bước dùng là hai bản mã khác nhau.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Cần commit cha để kiểm "sổ migration chỉ nối vào cuối" (tests/repo-integrity.test.ts).
          fetch-depth: 2
      - name: Đọc SHA thật của bản đang kiểm
        id: ghim
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "Cổng đang kiểm $SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài phụ thuộc
        run: npm ci
      # Chạy TRƯỚC tsc: khi có tệp trỏ ra ngoài kho, bài này nói thẳng tên tệp và tên import,
      # còn tsc chỉ nói "Cannot find module" ở một toạ độ dòng/cột.
      - name: Toàn vẹn kho mã (không import tệp chưa vào kho)
        run: npx tsx --tsconfig tsconfig.json tests/repo-integrity.test.ts
      - name: Kiểm tra kiểu dữ liệu
        # Cùng lý do với bước «Dựng bản production» bên dưới: 18/10/2026 bước này đỏ «JavaScript heap out of memory» ở #903 và
        # #904 (hai lượt liên tiếp, cả lượt chạy lại) trong khi hai nhánh kiểm thử XANH — đỏ vì heap mặc định của Node không còn
        # đủ cho `tsc` của cả kho, không vì mã. Runner ubuntu-latest của kho công khai có 16 GB; 6 GB như bước dựng.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx tsc --noEmit
      - name: Kiểm tra chuẩn mã nguồn
        run: npx eslint --max-warnings=0

  # ═══ NHÁNH 2 · BỘ KIỂM THỬ, CHẾ ĐỘ ẨN DANH — 4 SHARD SONG SONG (~11′ mỗi shard, đường găng) ═══
  kiem_thu:
    name: Kiểm thử (ẩn danh) · shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Trần 45′ GIỮ NGUYÊN (không nâng). Mỗi shard đo ~11′ trên máy dev — trần còn để bắt treo, không để chứa.
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.ghim.outputs.sha }}
      tree: ${{ steps.ghim.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Đọc SHA thật của bản đang kiểm
        id: ghim
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài phụ thuộc
        run: npm ci
      # GUARDRAIL NGHIỆP VỤ: contract test khoá luật "đơn giao thành công / đơn hoàn"
      # (docs/business-rules/ORDER_OUTCOME.md). Đây là điều kiện CHẶN, không phải cảnh báo.
      - name: Kiểm thử (gồm contract test luật nghiệp vụ)
        env:
          TEST_SHARD: ${{ matrix.shard }}/4
          TEST_SHARD_MANIFEST: ${{ runner.temp }}/shard/manifest.json
        run: npm test
      - name: Ghi bằng chứng shard (khối đã chạy · SHA · cây)
        env:
          IN: ${{ runner.temp }}/shard/manifest.json
          OUT: ${{ runner.temp }}/bang-chung/shard-an-danh-${{ matrix.shard }}.json
          MODE: an-danh
          SHA: ${{ steps.ghim.outputs.sha }}
          TREE: ${{ steps.ghim.outputs.tree }}
        run: |
          mkdir -p "$(dirname "$OUT")"
          node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync(process.env.IN, "utf8")); fs.writeFileSync(process.env.OUT, JSON.stringify({ ...m, mode: process.env.MODE, sha: process.env.SHA, tree: process.env.TREE }));'
      - uses: actions/upload-artifact@v4
        with:
          name: shard-an-danh-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bang-chung/shard-an-danh-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  # ═══ NHÁNH 3 · BỘ KIỂM THỬ, NHÁNH CÓ TOKEN — 4 SHARD (chạy CÙNG LÚC với nhánh 2) ═══
  #
  # ─── VÌ SAO CẦN LƯỢT NÀY ───
  #
  # `githubConfig()` đọc `ERP_GITHUB_TOKEN | GITHUB_TOKEN | GH_TOKEN` rồi chọn `auth` =
  # `TOKEN` hay `PUBLIC`, và NHÁNH ẤY ĐỔI HÀNH VI THẬT: trần request mỗi lượt đồng bộ là 12
  # khi có token, 3 khi ẩn danh (`prDetailBudget`). Lượt ẩn danh ở nhánh 2 KHÔNG có token nào
  # trong `env:`, nên nhánh TOKEN phải được chạy riêng ở đây.
  #
  # ĐÃ TRẢ GIÁ CHO ĐIỀU NÀY (20/09/2026): một khẳng định so với hằng số 12 trong khi fixture
  # được dựng từ `prDetailBudget(...)` — xanh trên máy có token, ĐỎ ở CI. Bài kiểm đo CÁI MÁY
  # chứ không đo mã nguồn (AGENTS.md mục 65).
  #
  # ─── TOKEN PHẢI GIẢ, VÀ PHẢI NHÌN LÀ BIẾT GIẢ ───
  #
  # Kho này PUBLIC. Bộ kiểm thử không gọi mạng thật (adapter GitHub bị tiêm `fetch` giả), nên
  # thứ duy nhất cần là một chuỗi KHÁC RỖNG để `auth` rẽ sang nhánh TOKEN. Đưa token thật vào
  # đây là đổi một lớp kiểm lấy một lượt rò rỉ.
  kiem_thu_token:
    name: Kiểm thử (có token giả) · shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Trần 45′ GIỮ NGUYÊN (không nâng). Mỗi shard đo ~11′ trên máy dev — trần còn để bắt treo, không để chứa.
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.ghim.outputs.sha }}
      tree: ${{ steps.ghim.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Đọc SHA thật của bản đang kiểm
        id: ghim
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài phụ thuộc
        run: npm ci
      - name: Kiểm thử lần hai — nhánh CÓ TOKEN (token GIẢ, kho public không cần token thật)
        env:
          GITHUB_TOKEN: "ghp_TOKEN_GIA_KHONG_CO_THAT_chi_de_re_nhanh_auth_000"
          TEST_SHARD: ${{ matrix.shard }}/4
          TEST_SHARD_MANIFEST: ${{ runner.temp }}/shard/manifest.json
        run: npm test
      - name: Ghi bằng chứng shard (khối đã chạy · SHA · cây)
        env:
          IN: ${{ runner.temp }}/shard/manifest.json
          OUT: ${{ runner.temp }}/bang-chung/shard-token-${{ matrix.shard }}.json
          MODE: token
          SHA: ${{ steps.ghim.outputs.sha }}
          TREE: ${{ steps.ghim.outputs.tree }}
        run: |
          mkdir -p "$(dirname "$OUT")"
          node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync(process.env.IN, "utf8")); fs.writeFileSync(process.env.OUT, JSON.stringify({ ...m, mode: process.env.MODE, sha: process.env.SHA, tree: process.env.TREE }));'
      - uses: actions/upload-artifact@v4
        with:
          name: shard-token-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bang-chung/shard-token-${{ matrix.shard }}.json
          retention-days: 7
          if-no-files-found: error

  # ═══ NHÁNH 4 · BẢN DỰNG PRODUCTION (~4′) ═══
  # Bắt lỗi ranh giới client/server mà `tsc` không thấy.
  dung_ban:
    name: Dựng bản production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      sha: ${{ steps.ghim.outputs.sha }}
      tree: ${{ steps.ghim.outputs.tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2
      - name: Đọc SHA thật của bản đang kiểm
        id: ghim
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài phụ thuộc
        run: npm ci
      - name: Dựng bản production
        # Heap mặc định của Node không còn đủ cho `next build`: 12/10/2026 ba lượt gates đỏ «JavaScript heap out of memory»
        # (#812, #815 và chính ngọn main) dù mã không lỗi — đỏ vì máy chạy, không vì mã. Runner ubuntu-latest của kho
        # công khai có 16 GB; 6 GB cho heap để chỗ cho phần còn lại của lượt dựng.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
