# ═══════════ CỔNG CỦA PULL REQUEST ═══════════
#
# Đây là thứ `main` sẽ BẮT BUỘC phải xanh trước khi merge (xem docs/main-protection.md).
#
# Trước bản này kho KHÔNG có workflow nào chạy trên `pull_request`: cả ba workflow đều là
# `workflow_dispatch`. Tức là một PR không có cổng nào cả, và bật "required status checks" lúc đó
# sẽ khoá chết mọi PR vì cái check bắt buộc không bao giờ chạy. Dựng cổng trước, khoá sau.
#
# Tên job (`gates`) là thứ đi vào danh sách required checks — đổi tên job là gỡ khoá `main` mà
# không ai nhận ra, nên đừng đổi nếu chưa cập nhật ruleset. Tên check hiện ra là `gates / gates`.
name: CI

on:
  pull_request:
  # Chạy cả trên `main` để lịch sử của nhánh chính luôn có một lượt kiểm ứng với từng commit,
  # kể cả những commit vào thẳng trước khi khoá được bật.
  push:
    branches: [main]

# ═══ MỖI NHÁNH MỘT LÀN, KHÔNG NHÁNH NÀO CHỜ NHÁNH NÀO ═══
#
# Khoá tính theo `github.ref`, nên PR #12 và PR #13 chạy SONG SONG; chỉ lượt cũ CỦA CHÍNH nhánh
# đó bị huỷ khi có commit mới. Đây KHÔNG bao giờ được dùng chung nhóm với thao tác production
# (`vps-mutating`): ở đó cắt ngang một lệnh đang ghi dữ liệu là nguy hiểm, còn ở đây lượt chạy
# chỉ đọc mã nguồn trên máy của GitHub và không chạm tới VPS một byte nào.
#
# `cancel-in-progress` CHỈ bật cho pull request. Trên `main` mỗi commit phải giữ được lượt kiểm
# của chính nó: hai commit vào `main` cách nhau một phút thì huỷ lượt đầu là xoá bằng chứng của
# commit đó — mà commit đó vẫn nằm trong lịch sử và vẫn deploy được.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  # ═══ VA SỐ MIGRATION GIỮA CÁC PR ĐANG MỞ — PHÁT HIỆN SỚM, KHÔNG PHẢI CHECK BẮT BUỘC ═══
  #
  # Ca #598/#599 (05/10/2026): hai PR cùng lấy 0219, mỗi PR xanh khi đứng một mình — trùng số chỉ lộ
  # ra lúc PR thứ hai gộp và phải làm lại. Bài kiểm trong `gates` (tests/migration-journal…) chỉ thấy
  # MỘT cây; job này nhìn sang PR khác + sổ giữ chỗ (`npm run ai -- migration reserve`).
  #
  # Bên ĐẾN SAU (PR mở sau / giữ chỗ sau) đỏ, bên kia chỉ nhận cảnh báo — nên đây KHÔNG là check
  # bắt buộc: nếu bắt buộc thì PR của người làm đúng bị khoá bởi lỗi của người khác. Chỉ chạy trên
  # pull_request, nên lượt `push` lên main (thứ `deploy-vps.yml` dùng làm bằng chứng cổng) không có
  # job này và không bao giờ đỏ vì nó.
  migration:
    name: Va số migration giữa các PR
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Không `npm ci`: công cụ chỉ dùng thư viện chuẩn và chạy bằng `node` trần (Node 22 bỏ kiểu TS).
      - name: Lấy main + sổ giữ chỗ
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags --depth=1 origin "+refs/heads/ai-control/registry:refs/remotes/origin/ai-control/registry" || echo "chưa có sổ giữ chỗ — chỉ so với main và PR"
      - name: So số migration của PR này với main · PR mở trước · giữ chỗ
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ai-tech.ts migration check --pr=${{ github.event.pull_request.number }} --github --offline
