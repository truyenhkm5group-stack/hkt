# Triển khai ERP lên VPS qua SSH (máy chạy của GitHub sẽ SSH vào VPS và chạy scripts/bootstrap.sh).
# Cần các Secrets trong repo: VPS_HOST, VPS_PASSWORD (hoặc VPS_SSH_KEY), PANCAKE_API_KEY,
# VIETTELPOST_API_KEY, VIETTELPOST_USERNAME, VIETTELPOST_PASSWORD, ADMIN_PASSWORD.
# Tuỳ chọn: OPENAI_API_KEY / ANTHROPIC_API_KEY (AI Copilot) — đặt Secret rồi chạy lại deploy, hoặc
# ops "apply-ai-env" để ghi vào .env và khởi động lại mà không cần dựng lại image.
# Tuỳ chọn Variables: ERP_DOMAIN (mặc định erp.vnxcommerce.com), ADMIN_EMAIL, VPS_USER.
name: Deploy ERP to VPS

on:
  workflow_dispatch:
    inputs:
      reset_env:
        description: "Tạo lại file .env trên VPS từ Secrets (xoá .env cũ)"
        type: boolean
        default: false

# ═══════════ KHOÁ ĐẶT Ở JOB `release`, KHÔNG Ở MỨC WORKFLOW ═══════════
#
# TRƯỚC: cả tệp này khoá ở MỨC WORKFLOW, dùng chung một nhóm với `ops-vps.yml`. Khoá được giữ từ
# GIÂY ĐẦU TIÊN, chứ không phải từ lúc có gì đó chạm máy chủ. Đo thật trên deploy #352
# (`31dceb0`, 19/09/2026), tổng 17m08s: cổng 5m05s + dựng ảnh 2m56s + chờ máy và `npm ci` thừa
# 47s = **8m48s (51%) KHÔNG chạm tới VPS một byte nào**; chỉ 8m13s của bước SSH là thật sự đụng
# máy chủ. Trong 8m48s đó, một lượt `db-query` mười giây vẫn phải đứng chờ.
#
# Cái giá đã trả, cũng đo được: deploy #346 tạo lúc 08:00:17 nhưng job ĐẦU TIÊN của nó mới khởi
# động lúc 08:13:30 — đúng 2 giây sau khi #345 kết thúc. **13m13s chờ suông.**
#
# SAU: khoá đi theo THỨ THẬT SỰ ĐỤNG MÁY CHỦ.
#
#   gates       — máy của GitHub, đọc mã nguồn.      KHÔNG khoá.
#   build_image — máy của GitHub, đẩy ảnh lên GHCR.  KHÔNG khoá.
#   release     — SSH vào VPS, khởi động lại dịch vụ. `vps-mutating`, cancel-in-progress: false.
#
# `vps-mutating` là nhóm DÙNG CHUNG với các thao tác ghi của `ops-vps.yml`: một lệnh nhập bảng kê
# và một lượt deploy vẫn KHÔNG BAO GIỜ chạy đè lên nhau. Đổi lại, một lượt `status` hay `db-query`
# không còn phải chờ hết một lượt deploy.
#
# `cancel-in-progress: false` là bắt buộc: cắt ngang một lượt deploy đang chạy migration nguy hiểm
# hơn nhiều so với việc phải chờ.

# `packages: write` để đẩy image lên GHCR bằng GITHUB_TOKEN — không cần secret mới.
permissions:
  contents: read
  packages: write

jobs:
  # ═══ CỔNG CHẤT LƯỢNG DÙNG CHUNG VỚI PR ═══
  #
  # Trước đây năm bước cổng được CHÉP thẳng vào đây. Nay chúng sống ở `gates.yml` và cả CI của PR
  # lẫn deploy đều gọi cùng một tệp — hai bản chép sẽ trôi xa nhau, và bản trôi chậm hơn là bản
  # người ta tin. Deploy vẫn KHÔNG chạy nếu cổng đỏ: job `release` khai `needs: [gates, …]`.
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      ref: ${{ github.sha }}

  # ═══ DỰNG IMAGE Ở CI, KHÔNG DỰNG TRÊN VPS — VÀ KHÔNG GIỮ KHOÁ PRODUCTION ═══
  #
  # Deploy #208, #227 và #228 đều chết vì `next build` bị SIGKILL trên VPS ~1,9 GB đang chạy
  # Postgres + ứng dụng + bộ lập lịch + Caddy (#228 đã chỉ còn MỘT lần dựng mà vẫn chết; `npm ci`
  # trong Docker mất 11 phút vì máy đang tráo bộ nhớ). Máy chạy của GitHub có 7 GB: dựng ở đây,
  # đẩy lên GHCR theo đúng SHA, VPS chỉ `docker pull` rồi khởi động lại — vài chục giây, không
  # đụng RAM của dịch vụ đang phục vụ người dùng.
  #
  # VÌ SAO KHÔNG `needs: gates`: job này chạy trên máy của GitHub và KHÔNG chạm VPS, nên nó chạy
  # SONG SONG với cổng thay vì nối đuôi — cắt được trọn thời gian dựng ảnh khỏi đường tới
  # production. Nó KHÔNG làm yếu cổng: `release` mới là thứ chạm máy chủ, và `release` cần CẢ HAI
  # job. Ảnh của một commit đỏ cổng vẫn nằm ở GHCR nhưng không bao giờ được triển khai.
  build_image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.build.outputs.image }}
      sha: ${{ steps.build.outputs.sha }}
    steps:
      # BẢN ĐƯỢC KIỂM PHẢI LÀ BẢN ĐƯỢC TRIỂN KHAI: ghim thẳng vào SHA thay vì tên nhánh.
      # Nhánh có thể được đẩy tiếp trong lúc workflow đang chạy (hai phiên làm việc song song),
      # và khi đó "main" ở bước này với "main" ở bước SSH là hai bản mã khác nhau.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Dựng image và đẩy lên GHCR theo SHA
        id: build
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          # Heap cho `next build` TRONG image. Mặc định trong Dockerfile là 1024 để bảo vệ đường
          # dựng-trên-VPS (máy ~1,9 GB, sự cố #208/#227/#228); ở đây máy có 7 GB và chỉ dựng một
          # image, nên nới ra. Deploy #239 chết vì 1024 vừa đủ cho bản trước và hết đủ khi lược đồ
          # drizzle có thêm một bảng — đo lại thì 2048 đã qua, lấy 4096 cho có biên.
          docker build --build-arg BUILD_HEAP_MB=4096 -t "$IMAGE_LC" .
          docker push "$IMAGE_LC"
          echo "image=$IMAGE_LC" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Đã đẩy $IMAGE_LC"

  # ═══ JOB DUY NHẤT ĐỤNG TỚI MÁY CHỦ — VÀ JOB DUY NHẤT GIỮ KHOÁ ═══
  #
  # Khoá bắt đầu ở ĐÂY, tức là ở đúng thời điểm đầu tiên có thể tác động tới VPS. Trước bản này
  # khoá bắt đầu từ giây đầu tiên của cả workflow, nên ~20 phút cổng + dựng ảnh trên máy GitHub
  # cũng chặn mọi lượt `status` / `logs` / `db-query` của các phiên khác.
  release:
    needs: [gates, build_image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # KHÔNG có `concurrency` ở đây nữa. PR #15 dùng nhóm `vps-mutating` của GitHub làm hàng đợi,
    # và production đã chứng minh nhóm ấy KHÔNG phải hàng đợi: nó giữ tối đa một lượt đang chạy +
    # MỘT lượt đang chờ, lượt thứ ba tới sẽ HUỶ lượt đang chờ (đo thật: lượt ops 1395 và 1416).
    # Một lượt deploy bị huỷ trong lúc xếp hàng là một bản sửa im lặng không bao giờ tới máy chủ.
    #
    # Nay hàng đợi là `flock` trên chính VPS (xem đầu `ops-vps.yml`): job LUÔN được khởi động, và
    # bước SSH dưới đây cầm khoá ĐỘC QUYỀN `/var/lock/erp-lifecycle.lock` suốt thời gian chạm máy
    # chủ. Cùng ổ khoá mà mọi thao tác GHI của `ops-vps.yml` dùng, nên deploy và một lệnh nhập
    # bảng kê vẫn KHÔNG BAO GIỜ chạy đè lên nhau — chỉ khác là bên thua giờ XẾP HÀNG thật thay vì
    # bị huỷ.
    steps:
      # ═══ RELEASE PHẢI TRIỂN KHAI ĐÚNG BẢN ĐÃ QUA CỔNG — ĐO, KHÔNG HỨA ═══
      #
      # Ba SHA phải trùng nhau: bản cổng thật sự đã kiểm, bản đã được dựng thành ảnh, và bản
      # workflow đang triển khai. Chúng có thể lệch thật: `gates` và `build_image` là hai lượt
      # checkout RIÊNG, và cả hai đều lấy theo `github.sha`, nên một lỗi cấu hình sau này (ai đó
      # đổi thành tên nhánh cho "tiện") sẽ làm chúng trỏ vào hai commit khác nhau mà không có
      # thông báo nào. So ở đây thì lỗi ấy dừng TRƯỚC khi SSH chạy.
      - name: Ba SHA phải trùng (cổng · ảnh · bản triển khai)
        env:
          GATES_SHA: ${{ needs.gates.outputs.sha }}
          BUILD_SHA: ${{ needs.build_image.outputs.sha }}
          ERP_IMAGE: ${{ needs.build_image.outputs.image }}
          ERP_DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "cổng đã kiểm  : $GATES_SHA"
          echo "ảnh đã dựng   : $BUILD_SHA  ($ERP_IMAGE)"
          echo "sắp triển khai: $ERP_DEPLOY_SHA"
          if [ "$GATES_SHA" != "$ERP_DEPLOY_SHA" ]; then
            echo "::error::Cổng kiểm $GATES_SHA nhưng workflow đang triển khai $ERP_DEPLOY_SHA — DỪNG."; exit 1
          fi
          if [ "$BUILD_SHA" != "$ERP_DEPLOY_SHA" ]; then
            echo "::error::Ảnh dựng từ $BUILD_SHA nhưng workflow đang triển khai $ERP_DEPLOY_SHA — DỪNG."; exit 1
          fi
          # Nhãn của ảnh CHÍNH LÀ SHA (xem job build_image). Kiểm cả nhãn: ảnh là thứ VPS kéo về,
          # nên nó mới là thứ quyết định mã nào thật sự chạy.
          if [ "${ERP_IMAGE##*:}" != "$ERP_DEPLOY_SHA" ]; then
            echo "::error::Nhãn ảnh (${ERP_IMAGE##*:}) không phải SHA đang triển khai ($ERP_DEPLOY_SHA) — DỪNG."; exit 1
          fi
          echo "✓ Ba SHA trùng nhau."

      - name: Kiểm tra Secrets bắt buộc
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PANCAKE_API_KEY: ${{ secrets.PANCAKE_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          echo "FACEBOOK_ACCESS_TOKEN: $([ -n "$FACEBOOK_ACCESS_TOKEN" ] && echo 'có' || echo 'chưa có')"
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_PASSWORD$VPS_SSH_KEY" ] || missing="$missing VPS_PASSWORD(hoặc VPS_SSH_KEY)"
          [ -n "$PANCAKE_API_KEY" ] || missing="$missing PANCAKE_API_KEY"
          if [ -n "$missing" ]; then echo "::error::Thiếu Secrets:$missing — vào Settings → Secrets and variables → Actions để thêm."; exit 1; fi

      - name: SSH vào VPS và chạy bootstrap
        uses: appleboy/ssh-action@v1
        env:
          ERP_BRANCH: ${{ github.ref_name }}
          # Danh tính lượt chạy + trần chờ khoá vòng đời, đi vào nhật ký khoá trên máy chủ.
          # 1200s (20 phút): cộng với ~9 phút bootstrap vẫn nằm gọn trong `timeout-minutes: 40`
          # của job và `command_timeout: 35m` của bước SSH — hết giờ thì deploy ĐỎ, không treo.
          RUN_ID: ${{ github.run_id }}
          LOCK_WAIT_WRITE: "1200"
          # SHA đã qua typecheck/lint/test/build ở trên. VPS phải triển khai ĐÚNG commit này.
          ERP_DEPLOY_SHA: ${{ github.sha }}
          ERP_DOMAIN: ${{ vars.ERP_DOMAIN || 'erp.vnxcommerce.com' }}
          ERP_NONINTERACTIVE: "1"
          ERP_RESET_ENV: ${{ inputs.reset_env && '1' || '0' }}
          PANCAKE_API_KEY: ${{ secrets.PANCAKE_API_KEY }}
          PANCAKE_SHOP_ID: ${{ vars.PANCAKE_SHOP_ID || '408063069' }}
          VIETTELPOST_API_KEY: ${{ secrets.VIETTELPOST_API_KEY }}
          VIETTELPOST_USERNAME: ${{ secrets.VIETTELPOST_USERNAME }}
          VIETTELPOST_PASSWORD: ${{ secrets.VIETTELPOST_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || 'admin@vnxcommerce.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_BUSINESS_ID: ${{ vars.FACEBOOK_BUSINESS_ID || '336423739082347' }}
          PANCAKE_ACCESS_TOKEN: ${{ secrets.PANCAKE_ACCESS_TOKEN }}
          # Webhook SePay (biến động số dư ngân hàng realtime) — TUỲ CHỌN.
          # Secret trống thì .env giữ nguyên giá trị cũ; endpoint tự báo "chưa cấu hình" chứ không sập.
          SEPAY_WEBHOOK_SECRET: ${{ secrets.SEPAY_WEBHOOK_SECRET }}
          SEPAY_WEBHOOK_API_KEY: ${{ secrets.SEPAY_WEBHOOK_API_KEY }}
          SEPAY_API_TOKEN: ${{ secrets.SEPAY_API_TOKEN }}
          # ───────── PHÒNG MARKETING: BA CÔNG TẮC, ĐI BẰNG `vars` CHỨ KHÔNG PHẢI `secrets` ─────────
          #
          # Không cái nào là bí mật: một con số phút, một chuỗi "true", một tên nấc quyền. Để chúng
          # ở `secrets` thì không ai ĐỌC LẠI được giá trị đang chạy — mà với công tắc thì "đang bật
          # hay tắt" chính là thứ cần tra nhất. `vars` đọc lại được, sửa được, và có lịch sử.
          #
          # HAI LUẬT NGƯỢC NHAU, CÓ CHỦ Ý (scripts/install-vps.sh):
          #   · MARKETING_LEDGER_EVERY_MINUTES (job chỉ đọc) — Variable TRỐNG thì KHÔNG ghi gì.
          #   · ADS_WRITE_ENABLED · ADS_WRITE_MODE · CREATIVE_LOOP_EVERY_MINUTES (mở đường ghi / chi
          #     tiền thật) — FAIL-CLOSED: Variable bị XOÁ hay TRỐNG ⇒ deploy ghi false / OFF / 0.
          #     Xoá Variable là cách TẮT; giá trị gõ tay vào .env trên máy bị đè ở lần deploy sau.
          MARKETING_LEDGER_EVERY_MINUTES: ${{ vars.MARKETING_LEDGER_EVERY_MINUTES }}
          # Chốt NGOÀI CÙNG của đường ghi quảng cáo. Chỉ đúng chuỗi "true" mở được.
          ADS_WRITE_ENABLED: ${{ vars.ADS_WRITE_ENABLED }}
          # OFF (mặc định) · COPILOT. Khai AUTO ở đây cũng bị mã nguồn kẹp xuống COPILOT.
          ADS_WRITE_MODE: ${{ vars.ADS_WRITE_MODE }}
          # Vòng mẫu quảng cáo (docs/creative-loop.md) CHI TIỀN THẬT — job chỉ có trong lịch khi biến này có giá trị.
          CREATIVE_LOOP_EVERY_MINUTES: ${{ vars.CREATIVE_LOOP_EVERY_MINUTES }}
          # Image đã dựng ở CI + thông tin đăng nhập GHCR (GITHUB_TOKEN chỉ sống trong lần chạy này).
          ERP_IMAGE: ${{ needs.build_image.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AI Copilot — tuỳ chọn. Secret trống thì .env giữ nguyên giá trị cũ (không xoá khoá đang dùng).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          # Phòng Tech AI đọc lượt deploy từ GitHub Actions — CHỈ ĐỌC, và token là một secret RIÊNG
          # chứ không phải `secrets.GITHUB_TOKEN` ở trên: token của lần chạy chết ngay khi workflow
          # kết thúc, nên ghi nó vào .env là ghi một khoá đã hết hiệu lực. Secret trống thì .env giữ
          # nguyên giá trị cũ (xem scripts/install-vps.sh) — không xoá khoá đang dùng trên máy.
          # Khoá RIÊNG của cửa chép sổ lượt chạy agent. Secret trống thì .env giữ nguyên giá trị cũ.
          AGENT_INGEST_SECRET: ${{ secrets.AGENT_INGEST_SECRET }}
          ERP_GITHUB_TOKEN: ${{ secrets.ERP_GITHUB_TOKEN }}
          ERP_GITHUB_REPO: ${{ vars.ERP_GITHUB_REPO || github.repository }}
          ERP_GITHUB_DEPLOY_WORKFLOW: ${{ vars.ERP_GITHUB_DEPLOY_WORKFLOW || 'deploy-vps.yml' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          command_timeout: 35m
          envs: ERP_BRANCH,RUN_ID,LOCK_WAIT_WRITE,ERP_DEPLOY_SHA,ERP_DOMAIN,ERP_NONINTERACTIVE,ERP_RESET_ENV,PANCAKE_API_KEY,PANCAKE_SHOP_ID,VIETTELPOST_API_KEY,VIETTELPOST_USERNAME,VIETTELPOST_PASSWORD,ADMIN_EMAIL,ADMIN_PASSWORD,FACEBOOK_ACCESS_TOKEN,FACEBOOK_BUSINESS_ID,PANCAKE_ACCESS_TOKEN,OPENAI_API_KEY,ANTHROPIC_API_KEY,AI_PROVIDER,SEPAY_WEBHOOK_SECRET,SEPAY_WEBHOOK_API_KEY,SEPAY_API_TOKEN,AGENT_INGEST_SECRET,ERP_GITHUB_TOKEN,ERP_GITHUB_REPO,ERP_GITHUB_DEPLOY_WORKFLOW,MARKETING_LEDGER_EVERY_MINUTES,ADS_WRITE_ENABLED,ADS_WRITE_MODE,CREATIVE_LOOP_EVERY_MINUTES,ERP_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            export ERP_BRANCH ERP_DEPLOY_SHA ERP_DOMAIN ERP_NONINTERACTIVE ERP_RESET_ENV PANCAKE_API_KEY PANCAKE_SHOP_ID VIETTELPOST_API_KEY VIETTELPOST_USERNAME VIETTELPOST_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD FACEBOOK_ACCESS_TOKEN FACEBOOK_BUSINESS_ID PANCAKE_ACCESS_TOKEN OPENAI_API_KEY ANTHROPIC_API_KEY AI_PROVIDER SEPAY_WEBHOOK_SECRET SEPAY_WEBHOOK_API_KEY SEPAY_API_TOKEN AGENT_INGEST_SECRET ERP_GITHUB_TOKEN ERP_GITHUB_REPO ERP_GITHUB_DEPLOY_WORKFLOW MARKETING_LEDGER_EVERY_MINUTES ADS_WRITE_ENABLED ADS_WRITE_MODE CREATIVE_LOOP_EVERY_MINUTES ERP_IMAGE GHCR_USER GHCR_TOKEN
            # ═══ KHOÁ VÒNG ĐỜI — ĐỘC QUYỀN, TRƯỚC KHI CHẠM BẤT CỨ THỨ GÌ ═══
            #
            # Cùng ổ khoá với mọi thao tác GHI của `ops-vps.yml`. Nó giải quyết hai việc:
            #
            #   · deploy không bao giờ chạy đè một lệnh ghi (như nhóm concurrency cũ đã làm), VÀ
            #   · deploy CHỜ các lượt ĐỌC đang chạy kết thúc rồi mới dựng lại container — đúng lỗi
            #     đã giết lượt `explain-stock` 1406 trên production ngày 19/09/2026.
            #
            # Khoá gắn vào FD 9 của shell này ⇒ SSH đứt là nhân tự nhả. Hết giờ chờ thì deploy ĐỎ
            # và KHÔNG chạy: một bản deploy chạy song song với lệnh ghi khác là thứ phải chặn.
            mkdir -p /var/lock
            KHOA_VONG_DOI=/var/lock/erp-lifecycle.lock
            _t0=$(date +%s)
            echo "[khoá] xin ĐỘC QUYỀN $KHOA_VONG_DOI — run=$RUN_ID deploy=$ERP_DEPLOY_SHA lúc $(date -u +%FT%TZ), trần ${LOCK_WAIT_WRITE}s"
            exec 9>"$KHOA_VONG_DOI"
            if flock -x -w "$LOCK_WAIT_WRITE" 9; then
              echo "[khoá] ĐÃ LẤY ĐƯỢC lúc $(date -u +%FT%TZ) — chờ $(( $(date +%s) - _t0 ))s"
            else
              echo "::error::[khoá] HẾT GIỜ CHỜ sau $(( $(date +%s) - _t0 ))s (trần ${LOCK_WAIT_WRITE}s) — DEPLOY DỪNG, chưa chạm máy chủ."
              echo "Có thao tác ghi hoặc một lượt deploy khác đang giữ khoá. Xem: Actions → Vận hành ERP trên VPS → action = status"
              exit 75
            fi

            if [ "$ERP_RESET_ENV" = "1" ] && [ -f /root/erp/.env ]; then mv /root/erp/.env "/root/erp/.env.bak-$(date +%s)"; fi
            # Lấy chính bản bootstrap của commit đang triển khai. Lấy theo tên nhánh thì kịch bản
            # cài đặt có thể đến từ một commit khác với mã nguồn — đúng lỗi mà bước này phải chặn.
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${ERP_DEPLOY_SHA}/scripts/bootstrap.sh" | bash

      - name: Kiểm tra HTTPS từ bên ngoài
        env:
          ERP_DOMAIN: ${{ vars.ERP_DOMAIN || 'erp.vnxcommerce.com' }}
          ERP_DEPLOY_SHA: ${{ github.sha }}
        run: |
          # `/api/health` trả ERP_COMMIT dạng 12 ký tự (scripts/install-vps.sh ghi vào .env).
          #
          # SỐNG LÀ CHƯA ĐỦ — phải sống ĐÚNG BẢN VỪA KIỂM. Trước đây bước này chỉ hỏi "có thở
          # không", nên một máy chủ chạy mã của commit khác vẫn được coi là deploy đạt.
          #
          # Vẫn thử lại khi commit chưa khớp: ngay sau lệnh khởi động lại, container cũ có thể
          # còn trả lời thêm vài giây. Chỉ kết luận sai commit sau khi đã chờ hết vòng lặp.
          EXPECTED="$(echo "$ERP_DEPLOY_SHA" | cut -c1-12)"
          LAST=""
          for i in $(seq 1 18); do
            BODY="$(curl -fsS -m 15 "https://$ERP_DOMAIN/api/health" || true)"
            [ -n "$BODY" ] && LAST="$BODY"
            if echo "$BODY" | grep -q '"ok":true' && echo "$BODY" | grep -q "\"commit\":\"$EXPECTED\""; then
              echo "✓ https://$ERP_DOMAIN đang chạy đúng commit $EXPECTED"; exit 0
            fi
            sleep 10
          done
          if echo "$LAST" | grep -q '"ok":true'; then
            echo "::error::Production sống nhưng chạy SAI commit. Mong đợi $EXPECTED — thực tế: $LAST"
            echo "Nguyên nhân thường gặp: nhánh được đẩy tiếp trong lúc deploy, hoặc bước ghim commit trên VPS không chạy."
            exit 1
          fi
          # Deploy KHÔNG được báo thành công khi ERP không phản hồi: lần trước container app
          # restart vô hạn vì migration lỗi, workflow chỉ cảnh báo nên coi như deploy đã xong
          # và không ai biết production đang sập. Fail ở đây để lỗi hiện ra ngay.
          echo "::error::https://$ERP_DOMAIN không phản hồi /api/health sau 3 phút — ERP đang lỗi."
          echo "Xem log để biết nguyên nhân: Actions → Vận hành ERP trên VPS → action = logs"
          exit 1
