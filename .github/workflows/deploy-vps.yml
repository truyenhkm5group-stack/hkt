# Triển khai ERP lên VPS qua SSH (máy chạy của GitHub sẽ SSH vào VPS và chạy scripts/bootstrap.sh).
# Cần các Secrets trong repo: VPS_HOST, VPS_PASSWORD (hoặc VPS_SSH_KEY), PANCAKE_API_KEY,
# VIETTELPOST_API_KEY, VIETTELPOST_USERNAME, VIETTELPOST_PASSWORD, ADMIN_PASSWORD.
# Tuỳ chọn: OPENAI_API_KEY / ANTHROPIC_API_KEY (AI Copilot) — đặt Secret rồi chạy lại deploy, hoặc
# ops "apply-ai-env" để ghi vào .env và khởi động lại mà không cần dựng lại image.
# Tuỳ chọn Variables: ERP_DOMAIN (mặc định erp.vnxcommerce.com), ADMIN_EMAIL, VPS_USER.
name: Deploy ERP to VPS

on:
  workflow_dispatch:
    inputs:
      reset_env:
        description: "Tạo lại file .env trên VPS từ Secrets (xoá .env cũ)"
        type: boolean
        default: false

# MỘT THAO TÁC CHẠM VPS TẠI MỘT THỜI ĐIỂM.
#
# Trước đây deploy và vận hành dùng hai nhóm riêng, nên một lệnh vận hành có thể chạy ĐÈ lên giữa
# lúc deploy đang dựng ảnh và khởi động lại container — đúng lúc máy chủ yếu nhất. Nay dùng CHUNG
# một nhóm: việc thứ hai xếp hàng chờ.
#
# `cancel-in-progress: false` là bắt buộc: cắt ngang một lệnh đang ghi dữ liệu (nhập bảng kê, dựng
# lại trạng thái) nguy hiểm hơn nhiều so với việc phải chờ.
concurrency:
  group: vps-operations
  cancel-in-progress: false

# `packages: write` để đẩy image lên GHCR bằng GITHUB_TOKEN — không cần secret mới.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # GUARDRAIL NGHIỆP VỤ: contract test khoá luật "đơn giao thành công / đơn hoàn"
      # (docs/business-rules/ORDER_OUTCOME.md) phải xanh thì mới được deploy.
      # Đây là điều kiện CHẶN, không phải cảnh báo — đỏ là dừng, không deploy.
      # BẢN ĐƯỢC KIỂM PHẢI LÀ BẢN ĐƯỢC TRIỂN KHAI: ghim thẳng vào SHA thay vì tên nhánh.
      # Nhánh có thể được đẩy tiếp trong lúc workflow đang chạy (hai phiên làm việc song song),
      # và khi đó "main" ở bước này với "main" ở bước SSH là hai bản mã khác nhau.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Cần commit cha để kiểm "sổ migration chỉ nối vào cuối" (tests/repo-integrity.test.ts).
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài phụ thuộc
        run: npm ci
      # Chạy TRƯỚC tsc: khi có tệp trỏ ra ngoài kho, bài này nói thẳng tên tệp và tên import,
      # còn tsc chỉ nói "Cannot find module" ở một toạ độ dòng/cột.
      - name: Toàn vẹn kho mã (không import tệp chưa vào kho)
        run: npx tsx --tsconfig tsconfig.json tests/repo-integrity.test.ts
      - name: Kiểm tra kiểu dữ liệu
        run: npx tsc --noEmit
      - name: Kiểm tra chuẩn mã nguồn
        run: npx eslint --max-warnings=0
      - name: Kiểm thử (gồm contract test luật nghiệp vụ)
        run: npm test
      # Bản dựng production bắt lỗi ranh giới client/server mà `tsc` không thấy. Chạy TRƯỚC khi
      # đụng tới máy chủ: thà đỏ ở đây còn hơn container khởi động lại vô hạn trên VPS.
      - name: Dựng bản production
        run: npm run build

      # ═══ DỰNG IMAGE Ở CI, KHÔNG DỰNG TRÊN VPS ═══
      #
      # Deploy #208, #227 và #228 đều chết vì `next build` bị SIGKILL trên VPS ~1,9 GB đang chạy
      # Postgres + ứng dụng + bộ lập lịch + Caddy (#228 đã chỉ còn MỘT lần dựng mà vẫn chết; `npm ci`
      # trong Docker mất 11 phút vì máy đang tráo bộ nhớ). Máy chạy của GitHub có 7 GB: dựng ở đây,
      # đẩy lên GHCR theo đúng SHA, VPS chỉ `docker pull` rồi khởi động lại — vài chục giây, không
      # đụng RAM của dịch vụ đang phục vụ người dùng.
      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Dựng image và đẩy lên GHCR theo SHA
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          # Heap cho `next build` TRONG image. Mặc định trong Dockerfile là 1024 để bảo vệ đường
          # dựng-trên-VPS (máy ~1,9 GB, sự cố #208/#227/#228); ở đây máy có 7 GB và chỉ dựng một
          # image, nên nới ra. Deploy #239 chết vì 1024 vừa đủ cho bản trước và hết đủ khi lược đồ
          # drizzle có thêm một bảng — đo lại thì 2048 đã qua, lấy 4096 cho có biên.
          docker build --build-arg BUILD_HEAP_MB=4096 -t "$IMAGE_LC" .
          docker push "$IMAGE_LC"
          echo "ERP_IMAGE=$IMAGE_LC" >> "$GITHUB_ENV"
          echo "Đã đẩy $IMAGE_LC"

      - name: Kiểm tra Secrets bắt buộc
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          PANCAKE_API_KEY: ${{ secrets.PANCAKE_API_KEY }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          echo "FACEBOOK_ACCESS_TOKEN: $([ -n "$FACEBOOK_ACCESS_TOKEN" ] && echo 'có' || echo 'chưa có')"
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_PASSWORD$VPS_SSH_KEY" ] || missing="$missing VPS_PASSWORD(hoặc VPS_SSH_KEY)"
          [ -n "$PANCAKE_API_KEY" ] || missing="$missing PANCAKE_API_KEY"
          if [ -n "$missing" ]; then echo "::error::Thiếu Secrets:$missing — vào Settings → Secrets and variables → Actions để thêm."; exit 1; fi

      - name: SSH vào VPS và chạy bootstrap
        uses: appleboy/ssh-action@v1
        env:
          ERP_BRANCH: ${{ github.ref_name }}
          # SHA đã qua typecheck/lint/test/build ở trên. VPS phải triển khai ĐÚNG commit này.
          ERP_DEPLOY_SHA: ${{ github.sha }}
          ERP_DOMAIN: ${{ vars.ERP_DOMAIN || 'erp.vnxcommerce.com' }}
          ERP_NONINTERACTIVE: "1"
          ERP_RESET_ENV: ${{ inputs.reset_env && '1' || '0' }}
          PANCAKE_API_KEY: ${{ secrets.PANCAKE_API_KEY }}
          PANCAKE_SHOP_ID: ${{ vars.PANCAKE_SHOP_ID || '408063069' }}
          VIETTELPOST_API_KEY: ${{ secrets.VIETTELPOST_API_KEY }}
          VIETTELPOST_USERNAME: ${{ secrets.VIETTELPOST_USERNAME }}
          VIETTELPOST_PASSWORD: ${{ secrets.VIETTELPOST_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL || 'admin@vnxcommerce.com' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_BUSINESS_ID: ${{ vars.FACEBOOK_BUSINESS_ID || '336423739082347' }}
          PANCAKE_ACCESS_TOKEN: ${{ secrets.PANCAKE_ACCESS_TOKEN }}
          # Webhook SePay (biến động số dư ngân hàng realtime) — TUỲ CHỌN.
          # Secret trống thì .env giữ nguyên giá trị cũ; endpoint tự báo "chưa cấu hình" chứ không sập.
          SEPAY_WEBHOOK_SECRET: ${{ secrets.SEPAY_WEBHOOK_SECRET }}
          SEPAY_WEBHOOK_API_KEY: ${{ secrets.SEPAY_WEBHOOK_API_KEY }}
          SEPAY_API_TOKEN: ${{ secrets.SEPAY_API_TOKEN }}
          # Image đã dựng ở CI + thông tin đăng nhập GHCR (GITHUB_TOKEN chỉ sống trong lần chạy này).
          ERP_IMAGE: ${{ env.ERP_IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # AI Copilot — tuỳ chọn. Secret trống thì .env giữ nguyên giá trị cũ (không xoá khoá đang dùng).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          command_timeout: 35m
          envs: ERP_BRANCH,ERP_DEPLOY_SHA,ERP_DOMAIN,ERP_NONINTERACTIVE,ERP_RESET_ENV,PANCAKE_API_KEY,PANCAKE_SHOP_ID,VIETTELPOST_API_KEY,VIETTELPOST_USERNAME,VIETTELPOST_PASSWORD,ADMIN_EMAIL,ADMIN_PASSWORD,FACEBOOK_ACCESS_TOKEN,FACEBOOK_BUSINESS_ID,PANCAKE_ACCESS_TOKEN,OPENAI_API_KEY,ANTHROPIC_API_KEY,AI_PROVIDER,SEPAY_WEBHOOK_SECRET,SEPAY_WEBHOOK_API_KEY,SEPAY_API_TOKEN,ERP_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            export ERP_BRANCH ERP_DEPLOY_SHA ERP_DOMAIN ERP_NONINTERACTIVE ERP_RESET_ENV PANCAKE_API_KEY PANCAKE_SHOP_ID VIETTELPOST_API_KEY VIETTELPOST_USERNAME VIETTELPOST_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD FACEBOOK_ACCESS_TOKEN FACEBOOK_BUSINESS_ID PANCAKE_ACCESS_TOKEN OPENAI_API_KEY ANTHROPIC_API_KEY AI_PROVIDER SEPAY_WEBHOOK_SECRET SEPAY_WEBHOOK_API_KEY SEPAY_API_TOKEN ERP_IMAGE GHCR_USER GHCR_TOKEN
            if [ "$ERP_RESET_ENV" = "1" ] && [ -f /root/erp/.env ]; then mv /root/erp/.env "/root/erp/.env.bak-$(date +%s)"; fi
            # Lấy chính bản bootstrap của commit đang triển khai. Lấy theo tên nhánh thì kịch bản
            # cài đặt có thể đến từ một commit khác với mã nguồn — đúng lỗi mà bước này phải chặn.
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${ERP_DEPLOY_SHA}/scripts/bootstrap.sh" | bash

      - name: Kiểm tra HTTPS từ bên ngoài
        env:
          ERP_DOMAIN: ${{ vars.ERP_DOMAIN || 'erp.vnxcommerce.com' }}
          ERP_DEPLOY_SHA: ${{ github.sha }}
        run: |
          # `/api/health` trả ERP_COMMIT dạng 12 ký tự (scripts/install-vps.sh ghi vào .env).
          #
          # SỐNG LÀ CHƯA ĐỦ — phải sống ĐÚNG BẢN VỪA KIỂM. Trước đây bước này chỉ hỏi "có thở
          # không", nên một máy chủ chạy mã của commit khác vẫn được coi là deploy đạt.
          #
          # Vẫn thử lại khi commit chưa khớp: ngay sau lệnh khởi động lại, container cũ có thể
          # còn trả lời thêm vài giây. Chỉ kết luận sai commit sau khi đã chờ hết vòng lặp.
          EXPECTED="$(echo "$ERP_DEPLOY_SHA" | cut -c1-12)"
          LAST=""
          for i in $(seq 1 18); do
            BODY="$(curl -fsS -m 15 "https://$ERP_DOMAIN/api/health" || true)"
            [ -n "$BODY" ] && LAST="$BODY"
            if echo "$BODY" | grep -q '"ok":true' && echo "$BODY" | grep -q "\"commit\":\"$EXPECTED\""; then
              echo "✓ https://$ERP_DOMAIN đang chạy đúng commit $EXPECTED"; exit 0
            fi
            sleep 10
          done
          if echo "$LAST" | grep -q '"ok":true'; then
            echo "::error::Production sống nhưng chạy SAI commit. Mong đợi $EXPECTED — thực tế: $LAST"
            echo "Nguyên nhân thường gặp: nhánh được đẩy tiếp trong lúc deploy, hoặc bước ghim commit trên VPS không chạy."
            exit 1
          fi
          # Deploy KHÔNG được báo thành công khi ERP không phản hồi: lần trước container app
          # restart vô hạn vì migration lỗi, workflow chỉ cảnh báo nên coi như deploy đã xong
          # và không ai biết production đang sập. Fail ở đây để lỗi hiện ra ngay.
          echo "::error::https://$ERP_DOMAIN không phản hồi /api/health sau 3 phút — ERP đang lỗi."
          echo "Xem log để biết nguyên nhân: Actions → Vận hành ERP trên VPS → action = logs"
          exit 1
