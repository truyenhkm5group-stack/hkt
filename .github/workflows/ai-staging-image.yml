# ───────── DỰNG ẢNH CHO BẢN CHẠY THỬ NHÂN SỰ AI — DỰNG Ở ĐÂY, KHÔNG DỰNG TRÊN VPS ─────────
#
# VÌ SAO CÓ TỆP NÀY. Đo VPS ngày 14/09/2026: 1.963 MB RAM tổng, 949 MB khả dụng, SWAP = 0, 2 lõi,
# load 1,05. `next build` của kho mã này cần hơn thế nhiều — lịch sử chính kho mã đã ghi hai lượt
# deploy chết vì SIGKILL khi có hai `next build` chạy cùng lúc trên máy này (#208, #227). Dựng ảnh
# của bản chạy thử NGAY TRÊN VPS trong lúc production đang phục vụ khách là đặt cược cửa hàng vào
# một lượt build.
#
# Máy chạy của GitHub có 7 GB RAM và không phục vụ khách hàng nào. Dựng ở đây, đẩy ảnh lên GHCR,
# rồi VPS chỉ việc `docker pull` — thao tác cần vài trăm MB thay vì vài GB.
#
# Workflow này KHÔNG chạm tới VPS. Nó chỉ dựng và đẩy một ảnh.
name: Dựng ảnh bản chạy thử nhân sự AI

on:
  workflow_dispatch:

concurrency:
  group: ai-staging-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}-ai-staging

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # CÙNG BỘ CỔNG mà lượt deploy production phải qua. Một ảnh chạy thử dựng từ mã chưa qua kiểm
      # thử thì mọi con số đo được trên nó đều không nói lên điều gì.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài phụ thuộc
        run: npm ci
      - name: Kiểm tra kiểu dữ liệu
        run: npx tsc --noEmit
      - name: Kiểm thử (gồm contract test luật nghiệp vụ)
        run: npm test

      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dựng và đẩy ảnh
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Gắn HAI thẻ: `latest` để lệnh trên VPS ngắn gọn, và thẻ theo commit để lúc cần biết
          # "bản chạy thử đang chạy mã nào" thì có câu trả lời chính xác, không phải phỏng đoán.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lệnh tiếp theo trên VPS
        run: |
          echo "Ảnh đã đẩy: ${{ env.IMAGE }}:latest (và :${{ github.sha }})"
          echo ""
          echo "Trên VPS, chạy ĐÚNG một lệnh:"
          echo "  STAGING_IMAGE=${{ env.IMAGE }}:latest bash /opt/vnx-ai-staging/scripts/staging-up.sh"
          echo ""
          echo "Nếu gói GHCR đang để riêng tư thì VPS phải đăng nhập một lần:"
          echo "  echo <GITHUB_TOKEN có quyền read:packages> | docker login ghcr.io -u <tài khoản> --password-stdin"
