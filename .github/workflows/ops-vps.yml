# Thao tác vận hành ERP trên VPS từ GitHub (không cần mở console).
# Actions → "Vận hành ERP trên VPS" → Run workflow → chọn thao tác.
name: Vận hành ERP trên VPS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Thao tác"
        type: choice
        required: true
        default: status
        options:
          - status              # trạng thái container + health
          - perf                # tài nguyên VPS (CPU/RAM từng container) và thời gian phản hồi vài trang
          - disk                # ổ đĩa còn bao nhiêu và ai đang chiếm chỗ (Docker, backup, log)
          - docker-prune        # giải phóng ổ đĩa: gỡ ảnh Docker cũ (KHÔNG đụng dữ liệu, KHÔNG dừng dịch vụ)
          - logs                # 200 dòng log gần nhất của app/scheduler/caddy
          - sync-pancake-all    # kho → sản phẩm → đơn (lịch sử) → khách → đổi trả → nhật ký kho
          - sync-pancake-orders # đơn thay đổi gần đây
          - sync-vtp-tracking   # tra cứu trạng thái vận đơn Viettel Post
          - sync-vtp-import     # nhập vận đơn từ tài khoản Viettel Post (30 ngày)
          - sync-facebook-ads   # kéo chi tiêu quảng cáo Facebook N ngày (days)
          - check-integrations  # kiểm tra API key
          - vtp-debug           # in phản hồi thô API Viettel Post cho mã vận đơn (nhập ở ô "arg")
          - db-query            # chạy một câu SQL CHỈ ĐỌC trên CSDL ERP (nhập SQL ở ô "arg")
          - seed-employees      # khai báo nhân sự & cơ chế lương từ JSON (ô "arg")
          - import-bank-ledger  # nhập sao kê MB Bank (JSON/CSV ở ô "arg") thành chi phí vận hành
          - bank-ledger-prune   # xoá các dòng sao kê đã nhập thuộc nhóm Quảng cáo / Nhập hàng
          - import-vtp-statements # nhập bảng kê tiền COD Viettel Post (dán bảng hoặc JSON ở ô "arg")
          - vtp-statements-autolink # tự ghép vận đơn vào bảng kê theo ngày giao (arg: "--dry-run --lag=1")
          - vtp-rebuild-state    # dựng lại trạng thái vận đơn từ lịch sử sự kiện (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - cod-rebuild          # dựng lại tiền COD từ sổ chi tiết bảng kê (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - cod-status-repair    # sửa vận đơn bị gắn sai "không thu hộ" (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - vtp-return-status-repair # vá chặng đã lưu của dòng tệp mang cờ "Trả hàng" — vận đơn đang hoàn bị ghi "Chờ xử lý" (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - agent-run-reattach   # gắn lại lượt chạy agent về đúng việc theo BẢN KHAI ở ô arg (mặc định CHẠY THỬ; "--apply" mới ghi)
          - vtp-replay-files     # nhập lại các tệp Viettel Post đã lưu (mặc định CHỈ LIỆT KÊ; arg "--apply")
          - vtp-statement-peek   # xem bố cục thật của tệp bảng kê đã lưu (arg: phần tên tệp)
          - vtp-retry-webhooks   # xử lý lại gói tin Viettel Post chưa ghép/chưa xử lý được
          - vtp-manual-verify    # chứng từ ĐVVC chủ shop chép tay cho lịch sử (mặc định CHẠY THỬ; arg "--apply")
          - explain-stock       # EXPLAIN ANALYZE truy vấn sổ kho — kế hoạch thực thi của câu chậm nhất
          - outcome-explain     # giải thích ERP kết luận kết quả vận đơn thế nào (arg: các mã vận đơn)
          - kpi-snapshot        # ảnh chụp KPI (kết quả đơn + ba con số tiền) để đối chiếu trước/sau deploy
          - smoke               # mở thật các màn hình chính bằng phiên đăng nhập hợp lệ, đo thời gian từng trang
          - verify              # MỘT LƯỢT: dịch vụ + health + tài nguyên + ổ đĩa + lỗi log gần nhất + smoke (CHỈ ĐỌC)
          - session-verify      # kiểm phiên trượt trên máy chủ thật: gia hạn, trần sống, hết hạn, SSE, cờ cookie (CHỈ ĐỌC)
          - session-revoke-e2e  # nghiệm thu THU HỒI phiên — GHI, và CHỈ trên tài khoản QA (QA_SESSION_EMAIL)
          - perf-probe          # đo THỜI GIAN TỪNG TRUY VẤN của các trang chậm, trên dữ liệu thật (chỉ đọc)
          - perf-audit          # đo THỜI GIAN TỪNG MÀN HÌNH qua ĐÚNG hàm ứng dụng gọi (có chayKhongJit, xoá memo trước mỗi phép đo) — chỉ đọc
          - outcome-parity      # đối chiếu TOÀN BỘ đơn: bảng kết quả đã tính sẵn vs luật chuẩn (chỉ đo; arg "--apply" mới dựng lại bảng DẪN XUẤT)
          - fanpage-evidence-backfill # gán fanpage lịch sử cho marketer TỪ BẰNG CHỨNG quảng cáo (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - returns-parity      # báo cáo hoàn: MÀN HÌNH THẬT = máy tính kết quả = SQL viết độc lập từ đặc tả (chỉ đọc; arg: "Q001,Q002" mã hàng)
          - reason-backfill     # rút quan sát lý do hoàn từ dữ liệu đã có (MẶC ĐỊNH CHẠY THỬ; arg "--apply" mới ghi)
          - reason-coverage     # độ phủ lý do hoàn: máy tính báo cáo = MÀN HÌNH THẬT (chỉ đọc)
          - cogs-drift          # giá vốn lịch sử có tự đổi không: so giá vốn hôm nay với giá vốn TẠI THỜI ĐIỂM giao (chỉ đo)
          - profit-verify       # kiểm chứng Báo cáo lợi nhuận ở 3 khoảng kỳ (phân bổ chi phí, hai tỷ lệ QC)
          - marketing-calibrate # đối chiếu Hiệu quả quảng cáo theo NGÀY với báo cáo lợi nhuận chuẩn + nguồn QC (chỉ đọc; arg: "--from=2026-09-01 --to=2026-09-14 [--marketer=..] [--product=..]" · hoặc "--explain=2026-09-08" để liệt kê TỪNG ĐƠN tạo ra con số của một ngày)
          - set-setting         # ghi cấu hình JSON vào settings (arg: "<khoá> <json> [--test-lark]")
          - run-job             # chạy một job đồng bộ / cảnh báo (arg: "alerts" | "cs-chat --hours=48" | "vtp-tracking" …)
          - meta-id-probe       # dò mã Meta trong tracking landing là ad / adset / campaign (CHỈ ĐỌC; arg: các mã, bỏ trống = lấy từ đơn còn treo)
          - pages-debug         # dò endpoint Pancake Pages API với PANCAKE_ACCESS_TOKEN
          - phone-probe         # dò API Pancake có trả lịch sử SĐT toàn hệ thống không (nhập SĐT ở ô "arg")
          - vtp-probe           # dò API liệt kê vận đơn Viettel Post (đối tác + cổng web) với token hiện có (arg: mã vận đơn)
          - vtp-capability      # tài khoản API đọc được vận đơn nào: dò một mẫu rồi xếp loại (MẶC ĐỊNH CHẠY THỬ; arg "--limit=30 --all --apply")
          - vtp-import-preview  # CHẠY THỬ đọc một tệp Viettel Post đã lưu trên dữ liệu thật — chỉ đọc, không ghi vận đơn (arg: phần tên tệp)
          - vtp-web-probe       # đọc bundle JS của viettelpost.vn để tìm endpoint API trang Quản lý vận đơn
          - care-false-reopen   # dọn ca care bị dựng lại vô cớ sau khi người đã xử lý xong (MẶC ĐỊNH CHẠY THỬ; arg "--apply")
          - returns-hmt         # đối soát sổ hàng hoàn viết tay (HMT) với ERP — đọc bản TẢI LÊN QUA ERP (MẶC ĐỊNH CHẠY THỬ; arg "--apply" mới ghi)
          - cs-cleanup          # xoá case CSKH tạo nhầm từ ghi chú bot Pancake rồi quét lại
          - cs-rule-update      # đóng MỀM case sinh bởi luật cũ rồi quét lại (mặc định chỉ đếm; arg "--apply" mới ghi)
          - care-waiting-reconcile # đối chiếu ca chăm sóc ĐANG CHỜ mà không có mốc xem lại (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - payroll-reconcile   # ĐỐI CHIẾU LƯƠNG cũ/mới trên dữ liệu production — CHỈ ĐỌC, Postgres tự chặn ghi (arg: "--from 2026-08-01 --to 2026-08-31")
          - backup              # pg_dump vào /root/backups
          - restart             # khởi động lại app + scheduler
          - rotate-webhook-secrets # tạo lại secret webhook Pancake/Viettel Post trong .env rồi khởi động lại
          - apply-ai-env        # ghi OPENAI_API_KEY / ANTHROPIC_API_KEY / AI_PROVIDER từ Secrets vào .env, khởi động lại, rồi kiểm tra AI
          - apply-sepay-env     # ghi SEPAY_WEBHOOK_SECRET từ Secrets vào .env, khởi động lại, rồi thử chữ ký đúng/sai (KHÔNG ghi tiền vào sổ)
          - apply-tech-github-env # ghi Secret GitHub vào .env — ERP_GITHUB_TOKEN (TUỲ CHỌN, kho public không cần) và/hoặc ERP_GITHUB_DISPATCH_TOKEN (để ERP khởi động lượt chạy agent)
          - apply-agent-env      # đặt credential GitHub App `erp-agent` vào .env (danh tính riêng của coding agent)
          - sepay-verify        # kiểm chứng đường realtime SePay trên máy chủ thật: số đo + phát lại gói tin thật để chứng minh idempotency
          - sepay-reconcile     # đối chiếu sổ với API SePay và vá gói tin webhook đã mất (MẶC ĐỊNH CHẠY THỬ; arg "--apply --days=7")
          - cs-stale            # đối chiếu hàng đợi CSKH với thực tế hiện tại (MẶC ĐỊNH CHẠY THỬ; arg "--apply")
          - sepay-schedule      # bật / tắt lịch đối chiếu SePay định kỳ (arg: số phút, ví dụ "60"; "off" để tắt)
          - ai-check            # kiểm AI production đầy đủ: routing 3 bậc, chat, read tool, case care, write tool có xác nhận (arg "--write" mới ghi note kiểm thử), lỗi mạng/hạn mức, audit — chỉ in meta
      days:
        description: "Số ngày (cho sync-pancake-all / sync-vtp-import)"
        type: string
        default: "365"
      arg:
        description: "Tham số thêm (vtp-debug: mã vận đơn)"
        type: string
        default: ""

# ═══════════ HÀNG ĐỢI NẰM TRÊN MÁY CHỦ, KHÔNG NẰM Ở GITHUB ═══════════
#
# BẢN TRƯỚC (PR #15) chia thao tác thành bốn nhóm `concurrency` của GitHub. Nó gỡ được nút thắt
# — đo thật: lượt chỉ đọc chờ 1–7 giây thay vì tới 17 phút — nhưng chạy trên production nửa tiếng
# thì lộ ra HAI lỗi mà chỉ máy chủ thật mới nói được:
#
#   A. LƯỢT ĐỌC BỊ DEPLOY GIẾT GIỮA CHỪNG. `explain-stock` (lượt 1406) khởi động 13:41:25, job
#      `release` của deploy #354 bắt đầu 13:41:29, và 13:44:11 lượt đọc chết với
#      `container ... is not running`. Nhóm concurrency của GitHub cho hai bên chạy song song,
#      nhưng không ai nói cho lượt đọc biết rằng container dưới chân nó sắp bị dựng lại.
#
#   B. `concurrency` CỦA GITHUB KHÔNG PHẢI HÀNG ĐỢI. Một nhóm chỉ giữ ĐÚNG một lượt đang chạy và
#      MỘT lượt đang chờ; lượt thứ ba tới sẽ HUỶ lượt đang chờ (đo thật: lượt 1395 và 1416 bị huỷ
#      đúng như vậy). Với một nhóm ghi, điều đó nghĩa là **một lệnh ghi đã gửi đi có thể biến mất
#      thay vì chờ tới lượt** — im lặng, và người gửi chỉ thấy chữ "cancelled".
#
# NÊN HÀNG ĐỢI CHUYỂN XUỐNG MÁY CHỦ. GitHub chỉ còn làm một việc: cho job KHỞI ĐỘNG. Việc chờ tài
# nguyên do `flock` trên VPS quyết, và `flock` là hàng đợi thật của nhân Linux: không ai bị đá ra
# vì có người tới sau.
#
# BA Ổ KHOÁ:
#
#   /var/lock/erp-lifecycle.lock     VÒNG ĐỜI CỦA CONTAINER.
#                                    · ĐỘC QUYỀN (-x): deploy `release`, và mọi thao tác GHI.
#                                    · CHIA SẺ  (-s): mọi thao tác đọc cần container đứng yên.
#                                    Nhiều lượt đọc chia sẻ được với nhau; một lượt ghi thì không.
#                                    Đây là thứ chữa lỗi A: deploy phải CHỜ lượt đọc xong, hoặc
#                                    lượt đọc phải chờ deploy xong — không còn dựng lại container
#                                    dưới chân một phép đọc đang chạy.
#
#   /var/lock/erp-readonly-db.lock   MỘT lượt đọc nặng tại một thời điểm (báo cáo · EXPLAIN ·
#   /var/lock/erp-readonly-probe.lock MỘT lượt dò API ngoài tại một thời điểm.
#                                    VPS chỉ ~1,9 GB và ĐANG phục vụ người dùng thật; mỗi
#                                    `docker exec erp-app npx tsx` là một tiến trình Node vài trăm
#                                    MB. "Chỉ đọc" nói về DỮ LIỆU, không nói về BỘ NHỚ.
#
# THỨ TỰ LẤY KHOÁ LÀ CỐ ĐỊNH, VÀ ĐÓ LÀ CẢ PHẦN CHỨNG MINH KHÔNG BẾ TẮC:
#
#       (1) khoá tài nguyên (db / probe, ĐỘC QUYỀN)  →  (2) khoá vòng đời (CHIA SẺ)
#
# Thao tác GHI chỉ lấy (2) ĐỘC QUYỀN. Không đường nào lấy (2) rồi mới xin (1), nên không có chu
# trình chờ — không thể bế tắc. Thứ tự này còn quan trọng vì lý do thứ hai: một lượt đọc nặng đang
# xếp hàng ở (1) KHÔNG cầm (2), nên nó không vô tình chặn deploy trong lúc chính nó đang chờ.
#
# BA LUẬT PHÂN LOẠI GIỮ NGUYÊN TỪ PR #15 (nay áp ở shell thay vì ở biểu thức YAML):
#
#   1. MẶC ĐỊNH LÀ GHI. Thao tác mới quên phân loại rơi vào làn AN TOÀN NHẤT (AGENTS.md mục 31).
#   2. `--apply` / `--write` / `--fix` ĐÈ LÊN phân loại theo tên — hơn một nửa thao tác "chỉ đọc"
#      ở đây là CHẠY THỬ theo mặc định và GHI THẬT khi có cờ.
#   3. Thao tác GHI MỘT DÒNG VẪN LÀ GHI (`vtp-import-preview`, `sepay-verify`).
#
# HẾT GIỜ CHỜ THÌ DỪNG HẲN VÀ NÓI RA. Không có nhánh nào "thôi bỏ qua khoá rồi chạy": chạy một
# lệnh ghi song song với deploy đúng là thứ cả bản này sinh ra để chặn.
#
# ĐIỀU BẢN NÀY *KHÔNG* PHỦ: bộ lập lịch chạy TRONG container tự nó ghi CSDL và không đi qua ổ
# khoá nào. Ổ khoá này điều phối các thao tác đi TỪ GITHUB xuống, không phải mọi thứ chạm CSDL.
#
# `tests/ops-concurrency.test.ts` chạy thật khối khoá này dưới `bash` với `flock` thật.

jobs:
  ops:
    # `apply-agent-env` đi ở job RIÊNG bên dưới. Nếu gắn `environment: agent-identity` cho job này
    # thì MỌI thao tác VPS — status, logs, db-query, deploy-adjacent — đều phải đi qua Environment
    # và chịu chính sách nhánh của nó. Một hàng rào dựng cho ba secret không được phép trở thành
    # điều kiện của sáu mươi thao tác không liên quan.
    if: inputs.action != 'apply-agent-env'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # KHÔNG có `concurrency` ở đây — xem khối "HÀNG ĐỢI NẰM TRÊN MÁY CHỦ" ở đầu tệp.
    # Mọi lượt chạy ĐƯỢC PHÉP KHỞI ĐỘNG; việc chờ tài nguyên xảy ra bằng `flock` trên VPS.
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          ACTION: ${{ inputs.action }}
          DAYS: ${{ inputs.days }}
          ARG: ${{ inputs.arg }}
          # Danh tính lượt chạy — đi vào mọi dòng nhật ký khoá, để đọc log trên máy chủ là
          # truy được ngược về đúng lượt chạy trên GitHub.
          RUN_ID: ${{ github.run_id }}
          # Trần chờ khoá. HỮU HẠN và KHÁC NHAU theo loại: một lượt đọc chờ quá 15 phút thì
          # gần như chắc chắn có deploy dài đang chạy và người gửi nên biết; một lượt GHI đáng
          # được chờ lâu hơn vì gửi lại nó tốn hơn nhiều. Cả hai đều DỪNG HẲN khi hết giờ.
          LOCK_WAIT_READ: "900"
          LOCK_WAIT_WRITE: "1800"
          # Chỉ dùng cho apply-ai-env. Secret được GitHub che trong log; KHÔNG bao giờ truyền khoá qua ô "arg".
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          # Chỉ dùng cho apply-sepay-env. Cùng nguyên tắc: GitHub che secret trong log, và tuyệt
          # đối KHÔNG truyền qua ô "arg" — ô đó được in nguyên văn vào log của mọi lần chạy.
          SEPAY_WEBHOOK_SECRET: ${{ secrets.SEPAY_WEBHOOK_SECRET }}
          SEPAY_WEBHOOK_API_KEY: ${{ secrets.SEPAY_WEBHOOK_API_KEY }}
          # Token API v2 — dùng cho đường ĐỐI CHIẾU. Khác secret webhook: secret để xác minh gói tin
          # SePay đẩy sang, token này để ERP chủ động hỏi lại SePay.
          SEPAY_API_TOKEN: ${{ secrets.SEPAY_API_TOKEN }}
          # Chỉ dùng cho returns-hmt. ĐƯỜNG DẪN TẢI BẢNG TÍNH HÀNG HOÀN, khai ở Settings →
          # Secrets and variables → Actions → Variables.
          #
          # VÌ SAO LÀ BIẾN CHỨ KHÔNG PHẢI Ô "arg": kho mã này PUBLIC, nên log của Actions và ô
          # nhập của mỗi lần chạy ai cũng đọc được. Một đường dẫn dạng "ai có link cũng xem được"
          # in vào đó là công bố nó vĩnh viễn — không rút lại được kể cả khi xoá lần chạy. Biến
          # thì chỉ đi vào môi trường của tiến trình và không bao giờ được in ra.
          # Chỉ dùng cho apply-tech-github-env. Token CHỈ ĐỌC của Phòng Tech AI (Actions: read).
          # KHÔNG phải `secrets.GITHUB_TOKEN` — token của lần chạy hết hiệu lực ngay khi workflow
          # kết thúc, ghi nó vào .env là ghi một khoá đã chết. Cùng luật với hai khối trên: không
          # bao giờ truyền qua ô "arg", vì ô đó in nguyên văn vào log của mọi lần chạy.
          ERP_GITHUB_TOKEN: ${{ secrets.ERP_GITHUB_TOKEN }}
          # Khoá RIÊNG cho quyền KHỞI ĐỘNG workflow — tách hẳn khỏi khoá ĐỌC ở trên.
          ERP_GITHUB_DISPATCH_TOKEN: ${{ secrets.ERP_GITHUB_DISPATCH_TOKEN }}
          ERP_GITHUB_REPO: ${{ vars.ERP_GITHUB_REPO || github.repository }}
          ERP_GITHUB_DEPLOY_WORKFLOW: ${{ vars.ERP_GITHUB_DEPLOY_WORKFLOW || 'deploy-vps.yml' }}
          HMT_WORKBOOK_URL: ${{ vars.HMT_WORKBOOK_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          command_timeout: 110m
          # ═══════════ DANH SÁCH NÀY LÀ MỘT CÁI CỬA, KHÔNG PHẢI MỘT LỜI MÔ TẢ ═══════════
          #
          # `appleboy/ssh-action` CHỈ chuyển xuống shell từ xa những biến có tên ở đây. Một biến
          # khai ở `env:` mà quên thêm vào `envs:` thì trên máy chủ nó RỖNG — và triệu chứng là
          # "thiếu Secret", tức nó chỉ thẳng người đọc đi kiểm lại Secrets, đúng chỗ KHÔNG hỏng.
          #
          # ĐÃ TỐN MỘT LƯỢT (ops #1465, 19/09/2026): ba biến `ERP_AGENT_GITHUB_*` có đủ ở `env:`
          # nhưng thiếu ở đây, nên `apply-agent-env` báo "Thiếu Secret: …" trong khi Secret có đủ.
          #
          # `tests/ops-concurrency.test.ts::testEnvsChuyenDuXuong` khoá bất biến: MỌI khoá khai ở
          # `env:` của bước này phải có mặt ở `envs:`. Bất biến đó bắt cả LỚP lỗi, không riêng ba
          # biến đã hỏng một lần.
          envs: ACTION,DAYS,ARG,RUN_ID,LOCK_WAIT_READ,LOCK_WAIT_WRITE,OPENAI_API_KEY,ANTHROPIC_API_KEY,AI_PROVIDER,SEPAY_WEBHOOK_SECRET,SEPAY_WEBHOOK_API_KEY,SEPAY_API_TOKEN,ERP_GITHUB_TOKEN,ERP_GITHUB_DISPATCH_TOKEN,ERP_GITHUB_REPO,ERP_GITHUB_DEPLOY_WORKFLOW,HMT_WORKBOOK_URL
          script: |
            set -e
            cd /root/erp
            C="docker compose -f docker-compose.prod.yml"
            # lấy script mới nhất trên main qua GitHub API (không bị CDN raw.githubusercontent cache 5 phút)
            fetch_script() { curl -fsSL -H "Accept: application/vnd.github.raw" -H "Cache-Control: no-cache" "https://api.github.com/repos/truyenhkm5group-stack/hkt/contents/scripts/$1?ref=main"; }

            # ═════════════════ KHOÁ TRÊN MÁY CHỦ (xem đầu tệp) ═════════════════
            # ĐÂY LÀ HÀNG ĐỢI THẬT. `flock` của nhân Linux: ai tới trước nằm trong hàng, và không
            # ai bị đá ra vì có người tới sau — khác hẳn `concurrency` của GitHub (mục B đầu tệp).
            # Khoá gắn vào MỘT FILE DESCRIPTOR của chính shell này, nên SSH đứt / tiến trình chết
            # là nhân TỰ nhả khoá. Không tự chế khoá bằng "tạo file rồi xoá file": kiểu đó để lại
            # khoá ma vĩnh viễn mỗi lần một lượt chạy bị huỷ giữa chừng.
            KHOA_VONG_DOI=/var/lock/erp-lifecycle.lock
            KHOA_DOC_DB=/var/lock/erp-readonly-db.lock
            KHOA_DOC_PROBE=/var/lock/erp-readonly-probe.lock
            mkdir -p /var/lock

            # FD 8 = khoá tài nguyên (đọc nặng / dò API) · FD 9 = khoá vòng đời. Số hiệu CỐ ĐỊNH
            # và LẤY THEO ĐÚNG THỨ TỰ 8 → 9 ở mọi nhánh; đó là phần chứng minh không bế tắc.
            xin_khoa() { # $1=fd  $2=tệp  $3=-x|-s  $4=trần giây  $5=nhãn
              _t0=$(date +%s)
              _kieu=$([ "$3" = "-x" ] && echo "ĐỘC QUYỀN" || echo "CHIA SẺ")
              echo "[khoá] xin $_kieu $2 — run=$RUN_ID action=$ACTION ($5) lúc $(date -u +%FT%TZ), trần ${4}s"
              eval "exec $1>\"$2\""
              if flock "$3" -w "$4" "$1"; then
                _t1=$(date +%s)
                echo "[khoá] ĐÃ LẤY ĐƯỢC $2 lúc $(date -u +%FT%TZ) — chờ $((_t1-_t0))s"
              else
                _t1=$(date +%s)
                echo "::error::[khoá] HẾT GIỜ CHỜ $2 sau $((_t1-_t0))s (trần ${4}s) — run=$RUN_ID action=$ACTION."
                echo "Thao tác DỪNG và KHÔNG chạy: lúc này gần như chắc chắn có deploy hoặc một lệnh ghi dài đang giữ khoá."
                echo "Xem ai đang giữ:  Actions → Vận hành ERP trên VPS → action = status   (hoặc trên máy chủ: fuser -v $2)"
                exit 75
              fi
            }

            # ─── PHÂN LOẠI: mặc định là GHI, và cờ ghi đè lên tên ───
            DOC_NHE="status perf disk logs db-query"
            DOC_PROBE="check-integrations vtp-debug vtp-probe vtp-web-probe phone-probe pages-debug meta-id-probe vtp-capability"
            DOC_NANG="verify smoke session-verify perf-probe perf-audit kpi-snapshot explain-stock outcome-explain outcome-parity returns-parity reason-coverage reason-backfill cogs-drift profit-verify marketing-calibrate payroll-reconcile fanpage-evidence-backfill care-false-reopen care-waiting-reconcile cs-rule-update cs-stale sepay-reconcile cod-rebuild cod-status-repair vtp-return-status-repair agent-run-reattach vtp-rebuild-state vtp-replay-files vtp-manual-verify vtp-statement-peek returns-hmt ai-check"

            LOP=GHI
            case "$ARG" in
              # So CHUỖI CON, y như `contains()` của biểu thức cũ: nó chỉ sai về phía GHI —
              # đúng chiều an toàn.
              *--apply*|*--write*|*--fix*) LOP=GHI ;;
              *)
                case " $DOC_NHE "   in *" $ACTION "*) LOP=DOC_NHE   ;; esac
                case " $DOC_PROBE " in *" $ACTION "*) LOP=DOC_PROBE ;; esac
                case " $DOC_NANG "  in *" $ACTION "*) LOP=DOC_NANG  ;; esac ;;
            esac
            echo "[khoá] phân loại: action=$ACTION arg=\"$ARG\" ⇒ $LOP"

            case "$LOP" in
              GHI)
                # Thao tác GHI chỉ cầm khoá vòng đời, ĐỘC QUYỀN. Nó KHÔNG đụng FD 8, nên không
                # đường nào cầm (2) rồi xin (1) — không có chu trình chờ.
                xin_khoa 9 "$KHOA_VONG_DOI" -x "$LOCK_WAIT_WRITE" "ghi / khởi động lại" ;;
              DOC_NANG)
                xin_khoa 8 "$KHOA_DOC_DB" -x "$LOCK_WAIT_READ" "đọc nặng: một lượt tại một thời điểm"
                xin_khoa 9 "$KHOA_VONG_DOI" -s "$LOCK_WAIT_READ" "đọc nặng: container phải đứng yên" ;;
              DOC_PROBE)
                xin_khoa 8 "$KHOA_DOC_PROBE" -x "$LOCK_WAIT_READ" "dò API ngoài: một lượt tại một thời điểm"
                xin_khoa 9 "$KHOA_VONG_DOI" -s "$LOCK_WAIT_READ" "dò API ngoài: container phải đứng yên" ;;
              DOC_NHE)
                # Đọc nhẹ KHÔNG có trần số lượng (khoá chia sẻ cho nhiều lượt cùng lúc) nhưng VẪN
                # cầm khoá vòng đời: đó chính là thứ chặn lỗi A — `docker exec erp-app` giữa lúc
                # deploy dựng lại container.
                xin_khoa 9 "$KHOA_VONG_DOI" -s "$LOCK_WAIT_READ" "đọc nhẹ: container phải đứng yên" ;;
            esac

            case "$ACTION" in
              status)
                $C ps
                docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo ;;
              perf)
                nproc; free -m; uptime
                docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"
                for path in /api/health /login /api/notifications; do
                  docker exec erp-app sh -c "wget -qO /dev/null -S http://127.0.0.1:3000$path 2>&1 | head -1; echo" >/dev/null 2>&1
                  t=$(docker exec erp-app sh -c "start=\$(date +%s%N); wget -qO /dev/null http://127.0.0.1:3000$path 2>/dev/null; end=\$(date +%s%N); echo \$(( (end-start)/1000000 ))")
                  echo "$path: ${t} ms"
                done
                $C exec -T db psql -U erp -d erp -P pager=off -c "select count(*) as active, count(*) filter (where state='active') running from pg_stat_activity where datname='erp';" -c "select relname, n_live_tup from pg_stat_user_tables order by n_live_tup desc limit 8;" ;;
              disk)
                # SỰ CỐ #242 (12/09/2026): deploy chết vì hết đĩa, và KHÔNG thao tác vận hành nào
                # nhìn thấy được ổ đĩa — người trực chỉ có một thông báo containerd khó đọc trong
                # log deploy. Ổ đĩa là tài nguyên duy nhất trong bốn thứ (CPU / RAM / đĩa / mạng)
                # chưa có chỗ xem, nên nó là thứ duy nhất hỏng mà không ai thấy trước.
                df -h /; echo
                echo "── Docker chiếm chỗ ──"; docker system df; echo
                echo "── Ảnh đang có (mới nhất trước) ──"
                docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}' | head -20; echo
                echo "── Thư mục lớn ──"
                du -sh /var/lib/docker /var/lib/containerd /root/backups /root/erp 2>/dev/null | sort -h ;;
              docker-prune)
                # ═══ GIẢI PHÓNG Ổ ĐĨA — CHỈ ẢNH DOCKER, KHÔNG ĐỤNG MỘT BYTE DỮ LIỆU NÀO ═══
                #
                # SỰ CỐ #242/#243 (12/09/2026): ổ đĩa đầy 100% (39G/39G, 0 byte trống). Deploy #242
                # chết lúc giải nén image; #243 chết SỚM HƠN — `git pull` trên VPS không ghi nổi
                # loose object. Tức là bản sửa nằm trong `install-vps.sh` KHÔNG THỂ tới được máy
                # chủ, vì máy chủ quá đầy để tải nó về. Thao tác này là lối ra khỏi vòng luẩn quẩn
                # đó: workflow vận hành nhúng thẳng script qua SSH, không cần `git pull`.
                #
                # NGUYÊN NHÂN: `docker image prune -f` chỉ xoá ảnh KHÔNG TAG, trong khi mỗi lần
                # deploy để lại một ảnh `ghcr.io/<kho>:<sha>` CÓ TAG (~2,6 GB). Đo được ngày
                # 12/09: 12 ảnh như vậy, 26,33 GB có thể thu hồi trên tổng 31,74 GB.
                #
                # VÌ SAO AN TOÀN: không có dữ liệu nào ở đây. CSDL nằm trong volume Docker (không
                # đụng), sao lưu ở /root/backups (không đụng), mã nguồn ở /root/erp (không đụng).
                # Ảnh Docker là hiện vật KÉO LẠI ĐƯỢC từ GHCR. Và Docker TỪ CHỐI xoá ảnh của
                # container đang chạy, nên thao tác này không thể làm sập bản đang chạy.
                echo "── TRƯỚC ──"; df -h /; docker system df; echo
                # 1. Mọi tag theo SHA của kho này. Ảnh đang chạy sống tiếp nhờ tag `erp-app:local`.
                { docker images --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr\.io/truyenhkm5group-stack/hkt:' || true; } | while read -r tag_cu; do
                  echo "  gỡ tag $tag_cu"; docker rmi "$tag_cu" >/dev/null 2>&1 || echo "    (đang dùng, giữ lại)"
                done
                # 2. Ảnh của đường DỰNG-TRÊN-VPS cũ. Từ khi CI dựng image (deploy #228 trở đi) không
                #    ai dùng chúng nữa; `docker rmi` sẽ từ chối nếu có container nào còn chạy từ đó.
                for tag_cu in erp-app:latest erp-scheduler:latest; do
                  docker rmi "$tag_cu" >/dev/null 2>&1 && echo "  gỡ $tag_cu" || true
                done
                # 3. Ảnh không tag + bộ nhớ đệm dựng. VPS KHÔNG còn dựng image nữa nên đệm là rác thuần.
                docker image prune -f >/dev/null 2>&1 || true
                docker builder prune -af >/dev/null 2>&1 || true
                echo; echo "── SAU ──"; df -h /; docker system df; echo
                echo "── Dịch vụ vẫn chạy? ──"; $C ps
                docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null; echo ;;
              logs)
                $C logs --tail=200 app scheduler caddy 2>&1 | sed -E 's/(pk|vtp)_[0-9a-f]{32}/\1_••••••••/g' ;;
              sync-pancake-all)
                docker exec erp-app npm run --silent sync -- pancake-all --backfill --days="$DAYS" ;;
              sync-pancake-orders)
                docker exec erp-app npm run --silent sync -- pancake-orders ;;
              sync-vtp-tracking)
                docker exec erp-app npm run --silent sync -- vtp-tracking --all --limit=2000 ;;
              sync-vtp-import)
                docker exec erp-app npm run --silent sync -- vtp-import --days="$DAYS" ;;
              sync-facebook-ads)
                docker exec erp-app npm run --silent sync -- facebook-ads --days="$DAYS" ;;
              sync-facebook-ads)
                docker exec erp-app npm run --silent sync -- facebook-ads --days="$DAYS" ;;
              check-integrations)
                docker exec erp-app npm run --silent check:integrations ;;
              seed-employees)
                docker exec erp-app npm run --silent seed:employees -- "$ARG" ;;
              import-bank-ledger)
                # luôn dùng bản script mới nhất trên GitHub; dữ liệu đi qua stdin, không in ra log
                fetch_script import-bank-ledger.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/import-bank-ledger.ts'
                printf '%s' "$ARG" | docker exec -i erp-app npx tsx --tsconfig tsconfig.json scripts/import-bank-ledger.ts --stdin ;;
              import-vtp-statements)
                fetch_script import-vtp-statements.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/import-vtp-statements.ts'
                printf '%s' "$ARG" | docker exec -i erp-app npx tsx --tsconfig tsconfig.json scripts/import-vtp-statements.ts --stdin ;;
              vtp-statements-autolink)
                fetch_script vtp-statement-autolink.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-statement-autolink.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-statement-autolink.ts $ARG ;;
              profit-verify)
                fetch_script profit-verify.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/profit-verify.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/profit-verify.ts ;;
              marketing-calibrate)
                # CHỈ ĐỌC. In bảng theo ngày rồi tự đối chiếu với báo cáo lợi nhuận chuẩn, nguồn chi
                # quảng cáo và kết quả vận đơn; thoát khác 0 khi có phát hiện xếp loại BUG.
                fetch_script marketing-calibrate.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/marketing-calibrate.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/marketing-calibrate.ts $ARG ;;
              perf-audit)
                # ═══ ĐO ĐÚNG THỨ NGƯỜI DÙNG CHỜ, KHÔNG PHẢI THỨ CÔNG CỤ ĐO CHẠY ═══
                #
                # `perf-probe` chạy `explain (analyze…)` THẲNG trên `pool.query`, ngoài giao dịch —
                # nên nó đo một đường mà ứng dụng KHÔNG dùng: báo cáo thật đi qua `chayKhongJit()`
                # (`set local jit = off`). Đêm 22/09/2026 khoảng cách đó làm một lượt phân tích kết
                # luận "JIT ăn 90% thời gian" trong khi đường thật đã tắt JIT từ lâu.
                #
                # `perf-audit` gọi CHÍNH các hàm mà trang gọi (`getReturnRateByVariant`, …) và
                # `clearMemo()` trước mỗi phép đo, nên con số nó in ra là thứ người dùng thật sự
                # chờ khi bộ đệm hết hạn. Chỉ đọc.
                fetch_script perf-audit.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/perf-audit.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/perf-audit.ts ;;
              cogs-drift)
                fetch_script cogs-drift.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cogs-drift.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/cogs-drift.ts ;;
              fanpage-evidence-backfill)
                # Mặc định CHẠY THỬ. "--apply" tạo dòng `fanpage_marketer_assignments` cho những page
                # có bằng chứng quảng cáo trỏ về ĐÚNG MỘT marketer — KHÔNG đụng đơn, vận đơn hay tiền.
                # Idempotent: chỉ tạo cho page chưa có phân công còn hiệu lực.
                fetch_script fanpage-evidence-backfill.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/fanpage-evidence-backfill.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/fanpage-evidence-backfill.ts $ARG ;;
              outcome-parity)
                # Mặc định CHỈ ĐO. "--apply" dựng lại bảng dẫn xuất — KHÔNG đụng đơn, vận đơn, sự
                # kiện hay tiền; đây không phải backfill dữ liệu nghiệp vụ.
                fetch_script outcome-parity.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/outcome-parity.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/outcome-parity.ts $ARG ;;
              care-false-reopen)
                # MẶC ĐỊNH CHẠY THỬ: liệt kê từng đợt bị dựng lại vô cớ kèm hai mốc chứng minh.
                # "--apply" đóng các đợt thừa mà CHƯA AI làm gì trên đó, mỗi đợt kèm một mốc
                # SYSTEM_CORRECTION. KHÔNG xoá dòng nào, KHÔNG đụng đợt đã có người làm việc.
                fetch_script care-false-reopen-repair.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/care-false-reopen-repair.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/care-false-reopen-repair.ts $ARG ;;
              reason-backfill)
                # MẶC ĐỊNH CHẠY THỬ: in ra đúng những gì sẽ ghi, theo từng nguồn. "--apply" mới ghi,
                # và ghi được chạy lại nhiều lần vì khoá chống trùng là NỘI DUNG chứ không phải số
                # thứ tự. KHÔNG đụng một dòng đơn / vận đơn / tiền nào — chỉ thêm dòng quan sát.
                fetch_script return-reason-backfill.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/return-reason-backfill.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/return-reason-backfill.ts $ARG ;;
              reason-coverage)
                # CHỈ ĐỌC. In ba phần độ phủ (đã xác định · có chứng từ chưa xếp · chưa có chứng từ),
                # top lý do thật và lý do lớn nhất của từng mã hàng — rồi mở MÀN HÌNH THẬT để chứng
                # minh khối ấy có render, chứ không chỉ có trong máy tính.
                fetch_script reason-coverage.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/reason-coverage.ts'
                docker exec erp-app sh -c "COVERAGE_PERIOD='${ARG:-all}' npx tsx --tsconfig tsconfig.json scripts/reason-coverage.ts" ;;
              returns-parity)
                # CHỈ ĐỌC. Tải thật /reports/returns bằng phiên hợp lệ rồi BÓC SỐ TỪ HTML, so với
                # máy tính kết quả và với một câu SQL viết độc lập từ đặc tả. Đây là phép kiểm duy
                # nhất đứng TRÊN tầng render: một khối biến mất sau lớp bắt lỗi vẫn trả HTTP 200,
                # và chỉ HTML mới nói ra điều đó (đã xảy ra thật 14/09/2026).
                fetch_script returns-parity.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/returns-parity.ts'
