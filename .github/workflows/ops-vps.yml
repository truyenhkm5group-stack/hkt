                  echo "Nguồn: tải từ biến HMT_WORKBOOK_URL"
                  if ! curl -fsSL --max-time 180 -o "$TMP/hmt.xlsx" "$HMT_WORKBOOK_URL"; then
                    echo "::error::Không tải được bảng tính từ HMT_WORKBOOK_URL. Kiểm tra biến có đúng đường dẫn TẢI (không phải đường dẫn /edit) và bảng tính đã ở chế độ ai-có-link-cũng-xem-được chưa."
                    exit 1
                  fi
                fi
                # Google trả về TRANG ĐĂNG NHẬP kèm HTTP 200 khi bảng tính chưa chia sẻ — `curl -f`
                # không bắt được. Chữ ký ZIP thì bắt được, và nói đúng nguyên nhân.
                if [ "$(head -c 2 "$TMP/hmt.xlsx")" != "PK" ]; then
                  echo "::error::Tệp KHÔNG phải .xlsx (thiếu chữ ký ZIP 'PK'). Nếu tải từ URL: thường là bảng tính chưa được chia sẻ nên Google trả về trang đăng nhập thay vì tệp."
                  exit 1
                fi
                # `sha256` in ra để đối chiếu ĐÚNG BẢN NÀO đã được đối soát — lượt chạy thử và lượt
                # `--apply` phải cùng một con số, nếu không là đã đổi tệp giữa chừng.
                echo "Bảng tính: $(wc -c < "$TMP/hmt.xlsx") byte · sha256 $(sha256sum "$TMP/hmt.xlsx" | cut -c1-16)…"
                docker cp "$TMP/hmt.xlsx" erp-app:/tmp/hmt-reconcile.xlsx
