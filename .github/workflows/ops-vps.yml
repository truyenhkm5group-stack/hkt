# Thao tác vận hành ERP trên VPS từ GitHub (không cần mở console).
# Actions → "Vận hành ERP trên VPS" → Run workflow → chọn thao tác.
name: Vận hành ERP trên VPS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Thao tác"
        type: choice
        required: true
        default: status
        options:
          - status              # trạng thái container + health
          - perf                # tài nguyên VPS (CPU/RAM từng container) và thời gian phản hồi vài trang
          - disk                # ổ đĩa còn bao nhiêu và ai đang chiếm chỗ (Docker, backup, log)
          - docker-prune        # giải phóng ổ đĩa: gỡ ảnh Docker cũ (KHÔNG đụng dữ liệu, KHÔNG dừng dịch vụ)
          - logs                # 200 dòng log gần nhất của app/scheduler/caddy
          - sync-pancake-all    # kho → sản phẩm → đơn (lịch sử) → khách → đổi trả → nhật ký kho
          - sync-pancake-orders # đơn thay đổi gần đây
          - sync-vtp-tracking   # tra cứu trạng thái vận đơn Viettel Post
          - sync-vtp-import     # nhập vận đơn từ tài khoản Viettel Post (30 ngày)
          - sync-facebook-ads   # kéo chi tiêu quảng cáo Facebook N ngày (days)
          - check-integrations  # kiểm tra API key
          - vtp-debug           # in phản hồi thô API Viettel Post cho mã vận đơn (nhập ở ô "arg")
          - db-query            # chạy một câu SQL CHỈ ĐỌC trên CSDL ERP (nhập SQL ở ô "arg")
          - seed-employees      # khai báo nhân sự & cơ chế lương từ JSON (ô "arg")
          - import-bank-ledger  # nhập sao kê MB Bank (JSON/CSV ở ô "arg") thành chi phí vận hành
          - bank-ledger-prune   # xoá các dòng sao kê đã nhập thuộc nhóm Quảng cáo / Nhập hàng
          - import-vtp-statements # nhập bảng kê tiền COD Viettel Post (dán bảng hoặc JSON ở ô "arg")
          - vtp-statements-autolink # tự ghép vận đơn vào bảng kê theo ngày giao (arg: "--dry-run --lag=1")
          - vtp-rebuild-state    # dựng lại trạng thái vận đơn từ lịch sử sự kiện (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - cod-rebuild          # dựng lại tiền COD từ sổ chi tiết bảng kê (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - cod-status-repair    # sửa vận đơn bị gắn sai "không thu hộ" (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - vtp-replay-files     # nhập lại các tệp Viettel Post đã lưu (mặc định CHỈ LIỆT KÊ; arg "--apply")
          - vtp-statement-peek   # xem bố cục thật của tệp bảng kê đã lưu (arg: phần tên tệp)
          - vtp-retry-webhooks   # xử lý lại gói tin Viettel Post chưa ghép/chưa xử lý được
          - vtp-manual-verify    # chứng từ ĐVVC chủ shop chép tay cho lịch sử (mặc định CHẠY THỬ; arg "--apply")
          - explain-stock       # EXPLAIN ANALYZE truy vấn sổ kho — kế hoạch thực thi của câu chậm nhất
          - outcome-explain     # giải thích ERP kết luận kết quả vận đơn thế nào (arg: các mã vận đơn)
          - kpi-snapshot        # ảnh chụp KPI (kết quả đơn + ba con số tiền) để đối chiếu trước/sau deploy
          - smoke               # mở thật các màn hình chính bằng phiên đăng nhập hợp lệ, đo thời gian từng trang
          - perf-probe          # đo THỜI GIAN TỪNG TRUY VẤN của các trang chậm, trên dữ liệu thật (chỉ đọc)
          - outcome-parity      # đối chiếu TOÀN BỘ đơn: bảng kết quả đã tính sẵn vs luật chuẩn (chỉ đo; arg "--apply" mới dựng lại bảng DẪN XUẤT)
          - cogs-drift          # giá vốn lịch sử có tự đổi không: so giá vốn hôm nay với giá vốn TẠI THỜI ĐIỂM giao (chỉ đo)
          - profit-verify       # kiểm chứng Báo cáo lợi nhuận ở 3 khoảng kỳ (phân bổ chi phí, hai tỷ lệ QC)
          - set-setting         # ghi cấu hình JSON vào settings (arg: "<khoá> <json> [--test-lark]")
          - run-job             # chạy một job đồng bộ / cảnh báo (arg: "alerts" | "cs-chat --hours=48" | "vtp-tracking" …)
          - pages-debug         # dò endpoint Pancake Pages API với PANCAKE_ACCESS_TOKEN
          - phone-probe         # dò API Pancake có trả lịch sử SĐT toàn hệ thống không (nhập SĐT ở ô "arg")
          - vtp-probe           # dò API liệt kê vận đơn Viettel Post (đối tác + cổng web) với token hiện có (arg: mã vận đơn)
          - vtp-web-probe       # đọc bundle JS của viettelpost.vn để tìm endpoint API trang Quản lý vận đơn
          - returns-hmt         # đối soát sổ hàng hoàn viết tay (HMT) với ERP — đọc bản TẢI LÊN QUA ERP (MẶC ĐỊNH CHẠY THỬ; arg "--apply" mới ghi)
          - cs-cleanup          # xoá case CSKH tạo nhầm từ ghi chú bot Pancake rồi quét lại
          - cs-rule-update      # đóng MỀM case sinh bởi luật cũ rồi quét lại (mặc định chỉ đếm; arg "--apply" mới ghi)
          - backup              # pg_dump vào /root/backups
          - restart             # khởi động lại app + scheduler
          - rotate-webhook-secrets # tạo lại secret webhook Pancake/Viettel Post trong .env rồi khởi động lại
          - apply-ai-env        # ghi OPENAI_API_KEY / ANTHROPIC_API_KEY / AI_PROVIDER từ Secrets vào .env, khởi động lại, rồi kiểm tra AI
          - apply-sepay-env     # ghi SEPAY_WEBHOOK_SECRET từ Secrets vào .env, khởi động lại, rồi thử chữ ký đúng/sai (KHÔNG ghi tiền vào sổ)
          - sepay-verify        # kiểm chứng đường realtime SePay trên máy chủ thật: số đo + phát lại gói tin thật để chứng minh idempotency
          - sepay-reconcile     # đối chiếu sổ với API SePay và vá gói tin webhook đã mất (MẶC ĐỊNH CHẠY THỬ; arg "--apply --days=7")
          - cs-stale            # đối chiếu hàng đợi CSKH với thực tế hiện tại (MẶC ĐỊNH CHẠY THỬ; arg "--apply")
          - sepay-schedule      # bật / tắt lịch đối chiếu SePay định kỳ (arg: số phút, ví dụ "60"; "off" để tắt)
          - ai-check            # kiểm AI production đầy đủ: routing 3 bậc, chat, read tool, case care, write tool có xác nhận (arg "--write" mới ghi note kiểm thử), lỗi mạng/hạn mức, audit — chỉ in meta
          # ───── BẢN CHẠY THỬ NHÂN SỰ AI — chỉ có trên nhánh claude/ai-workforce-sales-v1 ─────
          # Bấm Run workflow rồi CHỌN NHÁNH đó, nếu không GitHub chạy bản `main` và không thấy các
          # thao tác này. Không thao tác nào dưới đây chạm tới container / CSDL / .env của production.
          - ai-staging-swap       # tạo tệp swap 2 GB (idempotent, không restart gì, không reboot)
          - ai-staging-preflight  # CHỈ ĐỌC: chụp hiện trạng + kiểm 7 lớp va chạm + RAM/đĩa
          - ai-staging-image      # dựng ảnh trên máy chạy GitHub rồi đẩy lên GHCR (KHÔNG chạm VPS)
          - ai-staging-up         # kéo ảnh và dựng bản chạy thử ở /opt/vnx-ai-staging
          - ai-staging-app        # kéo ảnh mới rồi dựng lại DUY NHẤT container ứng dụng (không đụng bộ nạp, không đụng CSDL)
          - ai-staging-creds      # ghi PANCAKE_ACCESS_TOKEN (từ Secrets) + PANCAKE_PAGE_ID (arg) vào .env.staging
          - ai-staging-read-test  # CHỈ GỌI GET: page có đọc được không, tên page, hội thoại, tin nhắn
          - ai-staging-paging     # CHỈ GỌI GET: Pancake phân trang bằng tham số nào (dò 6 tên + cắt cửa sổ thời gian)
          - ai-staging-page-audit # CHỈ ĐỌC: phân trang Pancake + đi tìm nguồn có thẩm quyền cho mã page Facebook — MỘT lượt
          - ai-staging-paging-proof # CHỈ ĐỌC: chạy CHÍNH hàm lượt nạp dùng, chứng minh lấy được >60 hội thoại
          - ai-staging-signal-audit # CHỈ GỌI GET: Pancake THẬT SỰ trả về những trường nào (để dựng Product Resolver)
          - ai-staging-sql       # CHỈ ĐỌC: chạy một tệp SQL trong kho mã (arg = tên tệp ai-staging-*.sql)
          - ai-staging-resolver  # đo phép nhận diện sản phẩm trên dữ liệu đã nạp (arg: "--page=<id> --backfill")
          - ai-staging-ad-evidence # thu chứng cứ cho từng mã quảng cáo; mặc định CHẠY THỬ, "--apply" mới lưu
          - ai-staging-fanpage   # khai hồ sơ bán hàng cho một page (arg: "--page=<id> --product=Q004 --apply")
          - ai-staging-configure # khai mã WIN + nguồn TEST rồi chạy thử ngầm ngay (arg: "--page=<id> --win=Q004 --test-source=<ad> --apply")
          - ai-staging-ai-env     # ghi OPENAI_API_KEY / AI_PROVIDER từ Secrets vào .env.staging rồi thử kết nối (KHÔNG in giá trị)
          - ai-staging-shadow     # MẺ CHẠY NGẦM VỚI MÔ HÌNH THẬT (arg: "--page=<id> --max=20 [--dry-run]")
          - ai-staging-copilot    # BẬT/TẮT nấc TRỢ LÝ cho MỘT page (arg: "--page=<id> --on" | "--off"); MÁY TỰ GỬI vẫn ghim CẤM
          - ai-staging-domain     # TÊN MIỀN + HTTPS cho bản chạy thử (arg: "--prepare" | "--apply" | "--status" | "--off")
          - ai-staging-probe     # CHỈ ĐỌC: dò vì sao một trang không bấm được (arg: "--email=...")
          - ai-staging-auth      # ĐĂNG NHẬP bản chạy thử: kiểm tra ("--check") · vá APP_URL ("--fix-app-url") · đặt lại tài khoản thí điểm ("--user --email=... --name=... [--role=ADMIN]") · thử đăng nhập thật ("--test --email=...")
          - ai-staging-live-ingest # BẬT/TẮT bộ nạp tin sống (arg: "--on [--seconds=45]" | "--off" | "--once"); chỉ ĐỌC, không bao giờ gửi
          - ai-staging-knowledge  # khai SỔ DỮ KIỆN của mã WIN rồi kiểm tra máy trả lời được gì (arg: "--page=<id> [--apply]")
          - ai-staging-catalog    # kéo DANH MỤC SẢN PHẨM từ Pancake POS vào CSDL bản chạy thử (chỉ đọc từ Pancake)
          - ai-staging-page-token # (tuỳ chọn) sinh page_access_token phạm vi hẹp cho MỘT page (arg = PAGE_ID)
          - ai-staging-ingest     # nạp TAY hội thoại của page đã khai (arg: "--hours=24 --max=20 [--dry-run]")
          - ai-staging-report     # CHỈ ĐỌC: báo cáo chất lượng lượt nạp (12 khối) — chạy lại được bất cứ lúc nào
          - ai-staging-runtime    # CHỈ ĐỌC: nấc quyền hạn CÓ HIỆU LỰC + ba công tắc + page thí điểm + mốc đọc + bằng chứng an toàn
          - ai-staging-audit      # CHỈ ĐỌC: soi lại lưới an toàn + mất trạng thái trên CÂU ĐÃ LƯU (arg: "--days=7")
          - ai-staging-status     # trạng thái bản chạy thử + RAM/swap + sức khoẻ production
          - ai-staging-logs       # 120 dòng log gần nhất của app bản chạy thử
          - ai-staging-down       # dừng bản chạy thử (arg "--volumes" để xoá cả CSDL của nó)
      days:
        description: "Số ngày (cho sync-pancake-all / sync-vtp-import)"
        type: string
        default: "365"
      arg:
        description: "Tham số thêm (vtp-debug: mã vận đơn)"
        type: string
        default: ""

# MỘT THAO TÁC CHẠM VPS TẠI MỘT THỜI ĐIỂM.
#
# Trước đây deploy và vận hành dùng hai nhóm riêng, nên một lệnh vận hành có thể chạy ĐÈ lên giữa
# lúc deploy đang dựng ảnh và khởi động lại container — đúng lúc máy chủ yếu nhất. Nay dùng CHUNG
# một nhóm: việc thứ hai xếp hàng chờ.
#
# `cancel-in-progress: false` là bắt buộc: cắt ngang một lệnh đang ghi dữ liệu (nhập bảng kê, dựng
# lại trạng thái) nguy hiểm hơn nhiều so với việc phải chờ.
# Nhóm đồng thời chuyển XUỐNG TỪNG JOB.
#
# `vps-operations` là nhóm dùng chung với workflow triển khai: một thao tác chạm VPS tại một thời
# điểm, và đó là luật đúng — job `ops` giữ nguyên nó. Nhưng job `image` KHÔNG mở một kết nối SSH
# nào; xếp nó vào cùng nhóm nghĩa là một lượt dựng ảnh phải chờ một lượt triển khai production dài
# 30 phút mà không có lý do kỹ thuật nào. Nên nó có nhóm riêng.

env:
  # Ảnh của bản chạy thử. Tên KHÁC hẳn ảnh production (`erp-app:local`).
  STAGING_IMAGE_NAME: ghcr.io/${{ github.repository }}-ai-staging

jobs:
  # ───────── DỰNG ẢNH Ở ĐÂY, KHÔNG DỰNG TRÊN VPS ─────────
  #
  # VPS có 1.963 MB RAM / 949 MB khả dụng / SWAP 0 / 2 lõi (đo 14/09/2026). `next build` cần hơn
  # thế, và kho mã này đã ghi hai lượt deploy chết vì SIGKILL khi hai `next build` chạy cùng lúc
  # trên đúng máy ấy (#208, #227). Máy chạy GitHub có 7 GB RAM và không phục vụ khách hàng nào.
  #
  # Job này KHÔNG mở một kết nối SSH nào.
  image:
    if: inputs.action == 'ai-staging-image'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Nhóm RIÊNG: job này không chạm VPS nên không cần xếp hàng sau thao tác VPS nào.
    concurrency:
      group: ai-staging-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cài phụ thuộc
        run: npm ci
      # CÙNG BỘ CỔNG mà lượt deploy production phải qua: một ảnh chạy thử dựng từ mã chưa qua kiểm
      # thử thì mọi con số đo được trên nó đều không nói lên điều gì.
      - name: Kiểm tra kiểu dữ liệu
        run: npx tsc --noEmit
      - name: Kiểm thử (gồm contract test luật nghiệp vụ)
        run: npm test
      - name: Đăng nhập GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Dựng và đẩy ảnh
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Hai thẻ: `latest` cho lệnh ngắn gọn, và thẻ theo commit để lúc cần biết "bản chạy thử
          # đang chạy mã nào" thì có câu trả lời chính xác chứ không phải phỏng đoán.
          tags: |
            ${{ env.STAGING_IMAGE_NAME }}:latest
            ${{ env.STAGING_IMAGE_NAME }}:${{ github.sha }}
          # TRẦN HEAP CỦA LƯỢT DỰNG — chính Dockerfile dặn dòng này, và bỏ quên nó là lỗi thứ ba
          # liên tiếp của lượt dựng ảnh. Mặc định `BUILD_HEAP_MB=1024` sinh ra để bảo vệ đường dựng
          # TAY TRÊN VPS (máy ~1,9 GB đang chạy Postgres + app + scheduler + Caddy — sự cố
          # #208/#227/#228), nên nó phải giữ nguyên ở Dockerfile. Máy chạy GitHub có 15,6 GB và chỉ
          # dựng đúng một ảnh: ở đây 1024 MB làm `next build` chết ở bước kiểm kiểu với
          # "JavaScript heap out of memory".
          build-args: |
            BUILD_HEAP_MB=4096
          # KHÔNG khai đệm build. Hai lượt đầu (14/09/2026) hỏng sau ĐÚNG MỘT GIÂY, và log nói
          # thẳng lý do: "Cache export is not supported for the docker driver."
          #
          # Máy chạy của GitHub có sẵn buildx nhưng builder mặc định chạy driver `docker`, mà driver
          # ấy KHÔNG xuất được đệm — `type=gha` hay `type=registry` đều chết như nhau. Muốn có đệm
          # thì phải thêm `docker/setup-buildx-action` để dựng một builder driver `docker-container`.
          #
          # Không thêm. Ảnh này dựng vài lần một tuần; đổi vài phút dựng lại lấy một bước ít hơn
          # trong đường thi hành là đổi đúng. `--push` chạy bình thường trên driver mặc định.
      - name: Bước tiếp theo
        run: |
          echo "Đã đẩy ${{ env.STAGING_IMAGE_NAME }}:latest (và :${{ github.sha }})"
          echo "Tiếp: chạy lại workflow này với action = ai-staging-up (vẫn trên nhánh này)."

  ops:
    if: inputs.action != 'ai-staging-image'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # MỘT THAO TÁC CHẠM VPS TẠI MỘT THỜI ĐIỂM — nhóm dùng chung với workflow triển khai.
    # `cancel-in-progress: false` là bắt buộc: cắt ngang một lệnh đang ghi dữ liệu (nhập bảng kê,
    # dựng lại trạng thái) nguy hiểm hơn nhiều so với việc phải chờ.
    concurrency:
      group: vps-operations
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          ACTION: ${{ inputs.action }}
          DAYS: ${{ inputs.days }}
          ARG: ${{ inputs.arg }}
          # Chỉ dùng cho apply-ai-env. Secret được GitHub che trong log; KHÔNG bao giờ truyền khoá qua ô "arg".
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          # Chỉ dùng cho apply-sepay-env. Cùng nguyên tắc: GitHub che secret trong log, và tuyệt
          # đối KHÔNG truyền qua ô "arg" — ô đó được in nguyên văn vào log của mọi lần chạy.
          SEPAY_WEBHOOK_SECRET: ${{ secrets.SEPAY_WEBHOOK_SECRET }}
          SEPAY_WEBHOOK_API_KEY: ${{ secrets.SEPAY_WEBHOOK_API_KEY }}
          # Token API v2 — dùng cho đường ĐỐI CHIẾU. Khác secret webhook: secret để xác minh gói tin
          # SePay đẩy sang, token này để ERP chủ động hỏi lại SePay.
          SEPAY_API_TOKEN: ${{ secrets.SEPAY_API_TOKEN }}
          # Chỉ dùng cho returns-hmt. ĐƯỜNG DẪN TẢI BẢNG TÍNH HÀNG HOÀN, khai ở Settings →
          # Secrets and variables → Actions → Variables.
          #
          # VÌ SAO LÀ BIẾN CHỨ KHÔNG PHẢI Ô "arg": kho mã này PUBLIC, nên log của Actions và ô
          # nhập của mỗi lần chạy ai cũng đọc được. Một đường dẫn dạng "ai có link cũng xem được"
          # in vào đó là công bố nó vĩnh viễn — không rút lại được kể cả khi xoá lần chạy. Biến
          # thì chỉ đi vào môi trường của tiến trình và không bao giờ được in ra.
          HMT_WORKBOOK_URL: ${{ vars.HMT_WORKBOOK_URL }}
          # Bản chạy thử: nhánh nguồn, tên ảnh, và token GHCR DÙNG MỘT LẦN (script đăng xuất ngay
          # sau khi kéo ảnh xong, không bỏ lại chứng thư nào trên máy chủ).
          STAGING_BRANCH: ${{ github.ref_name }}
          STAGING_IMAGE: ghcr.io/${{ github.repository }}-ai-staging:latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token NGƯỜI DÙNG Pancake — chỉ dùng đúng một lần để sinh page token, không bao giờ ghi
          # xuống đĩa VPS. GitHub che giá trị trong log; ô "arg" thì KHÔNG, nên token tuyệt đối
          # không được đi qua đó.
          PANCAKE_ACCESS_TOKEN: ${{ secrets.PANCAKE_ACCESS_TOKEN }}
          # Khoá POS — CHỈ để kéo DANH MỤC SẢN PHẨM vào CSDL riêng của bản chạy thử. Không có danh
          # mục thì `product.search` trả rỗng và lượt chạy thử chỉ chứng minh bảng sản phẩm rỗng.
          PANCAKE_API_KEY: ${{ secrets.PANCAKE_API_KEY }}
          # MẬT KHẨU TÀI KHOẢN THÍ ĐIỂM trên bản chạy thử. Khai ở Settings → Secrets and variables
          # → Actions → New repository secret, tên AI_STAGING_PILOT_PASSWORD.
          #
          # VÌ SAO KHÔNG DÙNG Ô "arg": ô đó được in nguyên văn vào log của mọi lần chạy, và kho mã
          # này CÔNG KHAI nên log ấy ai cũng đọc được. Secret thì GitHub che trong log và script
          # nhận tuyệt đối không in nó ra.
          STAGING_USER_PASSWORD: ${{ secrets.AI_STAGING_PILOT_PASSWORD }}
          PANCAKE_SHOP_ID: ${{ vars.PANCAKE_SHOP_ID || '408063069' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          command_timeout: 110m
          envs: ACTION,DAYS,ARG,OPENAI_API_KEY,ANTHROPIC_API_KEY,AI_PROVIDER,SEPAY_WEBHOOK_SECRET,SEPAY_WEBHOOK_API_KEY,SEPAY_API_TOKEN,HMT_WORKBOOK_URL,STAGING_BRANCH,STAGING_IMAGE,GHCR_USER,GHCR_TOKEN,PANCAKE_ACCESS_TOKEN,PANCAKE_API_KEY,PANCAKE_SHOP_ID,STAGING_USER_PASSWORD
          script: |
            set -e
            cd /root/erp
            C="docker compose -f docker-compose.prod.yml"
            # lấy script mới nhất trên main qua GitHub API (không bị CDN raw.githubusercontent cache 5 phút)
            fetch_script() { curl -fsSL -H "Accept: application/vnd.github.raw" -H "Cache-Control: no-cache" "https://api.github.com/repos/truyenhkm5group-stack/hkt/contents/scripts/$1?ref=${2:-main}"; }
            # Thao tác bản chạy thử lấy script từ CHÍNH nhánh đang bấm, không phải từ `main`:
            # nhánh này có những script mà `main` chưa có.
            fetch_staging_script() { fetch_script "$1" "$STAGING_BRANCH"; }
            # Kiểm sức khoẻ production. In container erp-* nếu có, rồi PHÁN XÉT bằng /api/health.
            #
            # Vì sao là một hàm chứ không phải hai dòng chép đi chép lại: bản trước dùng
            # `docker ps | grep '^  erp-'` làm dòng cuối, và `grep` không khớp thì thoát 1 — dưới
            # `set -e` nó GIẾT cả script ngay trước khi in kết luận. Một phép kiểm mà tự làm hỏng
            # lượt chạy thì tệ hơn không kiểm: nó biến một lượt THÀNH CÔNG thành một lượt đỏ, và
            # người đọc log sẽ đi tìm một sự cố không tồn tại.
            kiem_production() {
              echo "── production ──"
              docker ps --format '  {{.Names}}\t{{.Status}}' 2>/dev/null | grep '^  erp-' || echo "  (docker ps không liệt kê container erp-* — xem phán xét bên dưới)"
              if docker exec erp-app wget -qO- --timeout=10 http://127.0.0.1:3000/api/health 2>/dev/null | grep -q '"ok":true'; then
                echo "  ✓ production trả ok:true"
                return 0
              fi
              echo "  ✗ production KHÔNG trả ok:true"
              return 1
            }
            case "$ACTION" in
              status)
                $C ps
                docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo ;;
              perf)
                nproc; free -m; uptime
                docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"
                for path in /api/health /login /api/notifications; do
                  docker exec erp-app sh -c "wget -qO /dev/null -S http://127.0.0.1:3000$path 2>&1 | head -1; echo" >/dev/null 2>&1
                  t=$(docker exec erp-app sh -c "start=\$(date +%s%N); wget -qO /dev/null http://127.0.0.1:3000$path 2>/dev/null; end=\$(date +%s%N); echo \$(( (end-start)/1000000 ))")
                  echo "$path: ${t} ms"
                done
                $C exec -T db psql -U erp -d erp -P pager=off -c "select count(*) as active, count(*) filter (where state='active') running from pg_stat_activity where datname='erp';" -c "select relname, n_live_tup from pg_stat_user_tables order by n_live_tup desc limit 8;" ;;
              disk)
                # SỰ CỐ #242 (12/09/2026): deploy chết vì hết đĩa, và KHÔNG thao tác vận hành nào
                # nhìn thấy được ổ đĩa — người trực chỉ có một thông báo containerd khó đọc trong
                # log deploy. Ổ đĩa là tài nguyên duy nhất trong bốn thứ (CPU / RAM / đĩa / mạng)
                # chưa có chỗ xem, nên nó là thứ duy nhất hỏng mà không ai thấy trước.
                df -h /; echo
                echo "── Docker chiếm chỗ ──"; docker system df; echo
                echo "── Ảnh đang có (mới nhất trước) ──"
                docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}' | head -20; echo
                echo "── Thư mục lớn ──"
                du -sh /var/lib/docker /var/lib/containerd /root/backups /root/erp 2>/dev/null | sort -h ;;
              docker-prune)
                # ═══ GIẢI PHÓNG Ổ ĐĨA — CHỈ ẢNH DOCKER, KHÔNG ĐỤNG MỘT BYTE DỮ LIỆU NÀO ═══
                #
                # SỰ CỐ #242/#243 (12/09/2026): ổ đĩa đầy 100% (39G/39G, 0 byte trống). Deploy #242
                # chết lúc giải nén image; #243 chết SỚM HƠN — `git pull` trên VPS không ghi nổi
                # loose object. Tức là bản sửa nằm trong `install-vps.sh` KHÔNG THỂ tới được máy
                # chủ, vì máy chủ quá đầy để tải nó về. Thao tác này là lối ra khỏi vòng luẩn quẩn
                # đó: workflow vận hành nhúng thẳng script qua SSH, không cần `git pull`.
                #
                # NGUYÊN NHÂN: `docker image prune -f` chỉ xoá ảnh KHÔNG TAG, trong khi mỗi lần
                # deploy để lại một ảnh `ghcr.io/<kho>:<sha>` CÓ TAG (~2,6 GB). Đo được ngày
                # 12/09: 12 ảnh như vậy, 26,33 GB có thể thu hồi trên tổng 31,74 GB.
                #
                # VÌ SAO AN TOÀN: không có dữ liệu nào ở đây. CSDL nằm trong volume Docker (không
                # đụng), sao lưu ở /root/backups (không đụng), mã nguồn ở /root/erp (không đụng).
                # Ảnh Docker là hiện vật KÉO LẠI ĐƯỢC từ GHCR. Và Docker TỪ CHỐI xoá ảnh của
                # container đang chạy, nên thao tác này không thể làm sập bản đang chạy.
                echo "── TRƯỚC ──"; df -h /; docker system df; echo
                # 1. Mọi tag theo SHA của kho này. Ảnh đang chạy sống tiếp nhờ tag `erp-app:local`.
                { docker images --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr\.io/truyenhkm5group-stack/hkt:' || true; } | while read -r tag_cu; do
                  echo "  gỡ tag $tag_cu"; docker rmi "$tag_cu" >/dev/null 2>&1 || echo "    (đang dùng, giữ lại)"
                done
                # 2. Ảnh của đường DỰNG-TRÊN-VPS cũ. Từ khi CI dựng image (deploy #228 trở đi) không
                #    ai dùng chúng nữa; `docker rmi` sẽ từ chối nếu có container nào còn chạy từ đó.
                for tag_cu in erp-app:latest erp-scheduler:latest; do
                  docker rmi "$tag_cu" >/dev/null 2>&1 && echo "  gỡ $tag_cu" || true
                done
                # 3. Ảnh không tag + bộ nhớ đệm dựng. VPS KHÔNG còn dựng image nữa nên đệm là rác thuần.
                docker image prune -f >/dev/null 2>&1 || true
                docker builder prune -af >/dev/null 2>&1 || true
                echo; echo "── SAU ──"; df -h /; docker system df; echo
                echo "── Dịch vụ vẫn chạy? ──"; $C ps
                docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null; echo ;;
              logs)
                $C logs --tail=200 app scheduler caddy 2>&1 | sed -E 's/(pk|vtp)_[0-9a-f]{32}/\1_••••••••/g' ;;
              sync-pancake-all)
                docker exec erp-app npm run --silent sync -- pancake-all --backfill --days="$DAYS" ;;
              sync-pancake-orders)
                docker exec erp-app npm run --silent sync -- pancake-orders ;;
              sync-vtp-tracking)
                docker exec erp-app npm run --silent sync -- vtp-tracking --all --limit=2000 ;;
              sync-vtp-import)
                docker exec erp-app npm run --silent sync -- vtp-import --days="$DAYS" ;;
              sync-facebook-ads)
                docker exec erp-app npm run --silent sync -- facebook-ads --days="$DAYS" ;;
              sync-facebook-ads)
                docker exec erp-app npm run --silent sync -- facebook-ads --days="$DAYS" ;;
              check-integrations)
                docker exec erp-app npm run --silent check:integrations ;;
              seed-employees)
                docker exec erp-app npm run --silent seed:employees -- "$ARG" ;;
              import-bank-ledger)
                # luôn dùng bản script mới nhất trên GitHub; dữ liệu đi qua stdin, không in ra log
                fetch_script import-bank-ledger.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/import-bank-ledger.ts'
                printf '%s' "$ARG" | docker exec -i erp-app npx tsx --tsconfig tsconfig.json scripts/import-bank-ledger.ts --stdin ;;
              import-vtp-statements)
                fetch_script import-vtp-statements.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/import-vtp-statements.ts'
                printf '%s' "$ARG" | docker exec -i erp-app npx tsx --tsconfig tsconfig.json scripts/import-vtp-statements.ts --stdin ;;
              vtp-statements-autolink)
                fetch_script vtp-statement-autolink.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-statement-autolink.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-statement-autolink.ts $ARG ;;
              profit-verify)
                fetch_script profit-verify.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/profit-verify.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/profit-verify.ts ;;
              cogs-drift)
                fetch_script cogs-drift.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cogs-drift.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/cogs-drift.ts ;;
              outcome-parity)
                # Mặc định CHỈ ĐO. "--apply" dựng lại bảng dẫn xuất — KHÔNG đụng đơn, vận đơn, sự
                # kiện hay tiền; đây không phải backfill dữ liệu nghiệp vụ.
                fetch_script outcome-parity.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/outcome-parity.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/outcome-parity.ts $ARG ;;
              perf-probe)
                fetch_script perf-probe.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/perf-probe.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/perf-probe.ts ;;
              smoke)
                # Chạy smoke trên hệ thống ĐANG ỔN ĐỊNH. Khác hẳn smoke lúc deploy: lúc đó scheduler
                # vừa khởi động và đang đồng bộ toàn bộ đơn, nên trang nặng bị tranh CPU. Chạy tay ở
                # đây trả lời được câu "người dùng thật có phải chờ không", tách khỏi chi phí deploy.
                fetch_script smoke.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/smoke.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/smoke.ts || true ;;
              kpi-snapshot)
                # Dùng bản script mới nhất trên main; công thức kết quả đơn lấy từ lib trong image.
                fetch_script kpi-snapshot.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/kpi-snapshot.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/kpi-snapshot.ts ;;
              vtp-rebuild-state)
                fetch_script vtp-rebuild-state.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-rebuild-state.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-rebuild-state.ts $ARG ;;
              cod-rebuild)
                fetch_script cod-rebuild-from-statements.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cod-rebuild-from-statements.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/cod-rebuild-from-statements.ts $ARG ;;
              cod-status-repair)
                fetch_script cod-status-repair.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cod-status-repair.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/cod-status-repair.ts $ARG ;;
              vtp-replay-files)
                fetch_script vtp-replay-files.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-replay-files.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-replay-files.ts $ARG ;;
              vtp-statement-peek)
                fetch_script vtp-statement-peek.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-statement-peek.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-statement-peek.ts $ARG ;;
              vtp-retry-webhooks)
                fetch_script vtp-retry-webhooks.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-retry-webhooks.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-retry-webhooks.ts $ARG ;;
              vtp-manual-verify)
                fetch_script vtp-manual-verify.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-manual-verify.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-manual-verify.ts $ARG ;;
              explain-stock)
                fetch_script explain-stock.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/explain-stock.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/explain-stock.ts ;;
              outcome-explain)
                fetch_script order-outcome-explain.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/order-outcome-explain.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/order-outcome-explain.ts $ARG ;;
              set-setting)
                fetch_script set-setting.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/set-setting.ts'
                docker exec erp-app sh -c "npx tsx --tsconfig tsconfig.json scripts/set-setting.ts $ARG" ;;
              run-job)
                docker exec erp-app sh -c "npm run --silent sync -- $ARG" ;;
              vtp-web-probe)
                fetch_script vtp-web-probe.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-web-probe.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-web-probe.ts "$ARG" ;;
              vtp-probe)
                fetch_script vtp-probe.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-probe.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-probe.ts "$ARG" ;;
              phone-probe)
                fetch_script phone-probe.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/phone-probe.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/phone-probe.ts "$ARG" ;;
              pages-debug)
                fetch_script pages-debug.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/pages-debug.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/pages-debug.ts ;;
              returns-hmt)
                # ═══ ĐỐI SOÁT SỔ HÀNG HOÀN VIẾT TAY (HMT) ↔ ERP ═══
                #
                # MẶC ĐỊNH CHẠY THỬ. Ô "arg" để trống = chỉ đọc và in bảng phân loại; "--apply"
                # mới ghi, và chỉ ghi những dòng MATCHED. Lượt ghi duy nhất là "kiện đã về tới
                # kho" — TỒN KHO KHÔNG ĐỔI MỘT MÓN NÀO (AGENTS.md mục 10: hàng hoàn chỉ vào tồn
                # khi người kho lập phiếu RETURN với số đếm thực tế).
                #
                # ─── BA CÁCH ĐƯA TỆP VÀO, XẾP THEO ĐỘ DỄ CHO NGƯỜI DÙNG ───
                #
                #  1. KHUYẾN NGHỊ — TẢI LÊN QUA CHÍNH ERP: mở Kiểm đếm hàng hoàn → kéo tệp .xlsx
                #     vào ô "Sổ hàng hoàn viết tay". Tệp đi qua HTTPS bằng phiên đăng nhập của
                #     người dùng và nằm lại trong CSDL production. Không khoá SSH, không console,
                #     không link công khai. Thao tác này KHÔNG cần gì ở đây — cứ chạy, script tự
                #     đọc bản mới nhất.
                #  2. TỆP TRÊN MÁY CHỦ ở /root/hmt/*.xlsx — dành cho người đang ngồi trên máy chủ.
                #  3. Tải từ `HMT_WORKBOOK_URL` (biến kho mã) nếu hai cách trên đều trống.
                #
                # CẢ HAI ĐƯỜNG ĐỀU KHÔNG NHẬN TỆP QUA Ô "arg": ô đó hiện công khai trên trang của
                # mỗi lần chạy, mà kho mã này PUBLIC (AGENTS.md mục 5). Đẩy nội dung một bảng tính
                # hàng hoàn qua đó là công bố nó vĩnh viễn — xoá lần chạy cũng không rút lại được.
                mkdir -p /root/hmt
                HMT_LOCAL="$(ls -t /root/hmt/*.xlsx 2>/dev/null | head -1 || true)"
                # Ô "arg" chỉ nhận cờ. Danh sách ĐÓNG để không ai chèn được lệnh vào đây.
                case "${ARG:-}" in
                  "") HMT_FLAGS="" ;;
                  "--apply") HMT_FLAGS="--apply" ;;
                  *) echo "::error::Ô \"arg\" chỉ nhận rỗng (chạy thử) hoặc --apply. Nhận được: $ARG"; exit 1 ;;
                esac
                # ═══ KHÔNG CÓ TỆP Ở MÁY CHỦ VÀ KHÔNG CÓ URL ⇒ ĐỌC BẢN TẢI LÊN QUA ERP ═══
                #
                # Đây là đường MẶC ĐỊNH từ 14/09/2026. Script tự đọc bản mới nhất trong CSDL, nên ở
                # đây không phải chép gì cả — và nếu CSDL cũng trống thì chính script in ra hướng
                # dẫn đúng (kéo tệp vào màn hình Kiểm đếm hàng hoàn), không phải một lỗi shell.
                if [ -z "$HMT_LOCAL" ] && [ -z "${HMT_WORKBOOK_URL:-}" ]; then
                  echo "Nguồn: bản tải lên qua ERP (CSDL production)"
                  fetch_script hmt-return-reconcile.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/hmt-return-reconcile.ts'
                  docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/hmt-return-reconcile.ts $HMT_FLAGS
                  exit 0
                fi
                TMP="$(mktemp -d)"
                # Chỉ dọn BẢN SAO tạm (thư mục tạm + bản trong container). Tệp gốc ở /root/hmt là
                # của chủ shop — máy KHÔNG tự xoá tài sản của người khác; in lời nhắc ở cuối.
                trap 'rm -rf "$TMP"; docker exec erp-app rm -f /tmp/hmt-reconcile.xlsx >/dev/null 2>&1 || true' EXIT
                if [ -n "$HMT_LOCAL" ]; then
                  # Tệp chủ shop đã chép lên máy chủ. In TÊN TỆP (để biết đang đối soát bản nào),
                  # không in nội dung.
