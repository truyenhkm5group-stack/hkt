                # AI Copilot trên production đã chạy thật bằng `OPENAI_API_KEY`. Nhân sự bán hàng đi
                # qua cùng lớp provider ấy (`lib/ai/` ← `providers/erp-shared.ts`), nên bản chạy thử
                # chỉ cần CHÍNH khoá đó, đi qua CHÍNH cơ chế Secrets đang dùng.
                #
                # GIÁ TRỊ SECRET KHÔNG BAO GIỜ ĐƯỢC IN — chỉ in ĐỘ DÀI. GitHub cũng tự che secret
                # trong log, nhưng không dựa vào một lớp bảo vệ duy nhất.
                cd /opt/vnx-ai-staging
                upsert_stg() { if grep -qE "^$1=" .env.staging; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env.staging; else printf '%s="%s"\n' "$1" "$2" >> .env.staging; fi; }
                if [ -z "${OPENAI_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
                  echo "Không có Secret OPENAI_API_KEY / ANTHROPIC_API_KEY trong repo — KHÔNG ghi gì."
                  echo "Thêm ở Settings → Secrets and variables → Actions rồi chạy lại."
                  exit 1
                fi
                [ -n "${OPENAI_API_KEY:-}" ] && { upsert_stg OPENAI_API_KEY "$OPENAI_API_KEY"; echo "OPENAI_API_KEY: đã ghi vào .env.staging (${#OPENAI_API_KEY} ký tự)"; }
                [ -n "${ANTHROPIC_API_KEY:-}" ] && { upsert_stg ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"; echo "ANTHROPIC_API_KEY: đã ghi vào .env.staging (${#ANTHROPIC_API_KEY} ký tự)"; }
                upsert_stg AI_PROVIDER "${AI_PROVIDER:-auto}"
                # CHẶN CỨNG GIỮ NGUYÊN. Bật mô hình thật KHÔNG được kéo theo quyền gửi tin hay tạo
                # đơn — đó là hai khoá riêng, và chúng phải ở lại CẤM.
                upsert_stg AI_DEFAULT_MODE SHADOW
                upsert_stg AI_ALLOW_AUTO_SEND false
                upsert_stg AI_ALLOW_HUMAN_APPROVED_SEND false
                upsert_stg AI_ALLOW_CUSTOMER_SEND false
                upsert_stg AI_ALLOW_ORDER_CREATE false
                # CHUYỂN SANG CẦU NỐI. Mẫu `.env.staging.example` khai `stub` để một lần dựng
                # không bao giờ tự gọi mạng; tới đây là lúc CỐ Ý bật, nên khai tường minh.
                upsert_stg AI_WORKFORCE_PROVIDER erp
                upsert_stg AI_MODEL_CALLS_ENABLED true
                chmod 600 .env.staging
                echo ""
                docker compose -f docker-compose.staging.yml --env-file .env.staging up -d app
                sleep 15
                curl -fsS -m 10 http://127.0.0.1:3100/api/health && echo || echo "  ✗ bản chạy thử chưa trả lời"
                echo ""
                echo "── Thử kết nối AI trong bản chạy thử (chỉ in meta) ──"
                fetch_staging_script ai-staging-ping.ts | docker exec -i vnx-ai-staging-app sh -c 'cat > /app/scripts/ai-staging-ping.ts'
                docker compose -f docker-compose.staging.yml --env-file .env.staging \
                  exec -T app npx tsx --tsconfig tsconfig.json scripts/ai-staging-ping.ts ;;

              ai-staging-shadow)
                cd /opt/vnx-ai-staging
                # TRẦN CỨNG 50 nằm TRONG script, không ở đây — ô `arg` chỉ hẹp lại được thêm.
                fetch_staging_script ai-shadow-batch.ts | docker exec -i vnx-ai-staging-app sh -c 'cat > /app/scripts/ai-shadow-batch.ts'
                docker compose -f docker-compose.staging.yml --env-file .env.staging \
                  exec -T app npx tsx --tsconfig tsconfig.json scripts/ai-shadow-batch.ts ${ARG:---max=20} ;;

              ai-staging-copilot)
                # BẬT NẤC TRỢ LÝ CHO ĐÚNG MỘT PAGE — và chỉ nửa "người bấm gửi", không bao giờ nửa
                # "máy tự gửi". `AI_ALLOW_AUTO_SEND` ghim trong docker-compose.staging.yml nên thao
                # tác này KHÔNG chạm tới được; muốn mở nó phải sửa tệp ấy, commit, qua cổng kiểm thử.
                #
                # Ba thứ phải cùng đúng thì một tin mới đi được, và thao tác này đặt cả ba rồi ĐỌC
                # LẠI để in ra — chứ không báo "đã bật" rồi thôi.
                cd /opt/vnx-ai-staging
                upsert_stg() { if grep -qE "^$1=" .env.staging; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env.staging; else printf '%s="%s"\n' "$1" "$2" >> .env.staging; fi; }
                PAGE=""; BAT="0"
                for a in ${ARG:-}; do
                  case "$a" in
                    --page=*) PAGE="${a#--page=}" ;;
                    --on) BAT="1" ;;
                    --off) BAT="0" ;;
                  esac
                done
                if [ "$BAT" = "1" ] && [ -z "$PAGE" ]; then echo "✗ Bật nấc trợ lý thì PHẢI nêu --page=<id>: không có danh sách trắng thì không ai gửi được, và bật toàn cục là thứ bản thiết kế này từ chối."; exit 1; fi

                if [ "$BAT" = "1" ]; then
                  upsert_stg AI_ALLOW_HUMAN_APPROVED_SEND true
                  DS="[\"$PAGE\"]"
                else
                  upsert_stg AI_ALLOW_HUMAN_APPROVED_SEND false
                  DS="[]"
                fi
                upsert_stg AI_ALLOW_AUTO_SEND false
                chmod 600 .env.staging
                docker compose -f docker-compose.staging.yml --env-file .env.staging up -d app
                sleep 12

                # Danh sách trắng page + nấc quyền hạn nằm trong CSDL của bản chạy thử.
                docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T db \
                  psql -U erp -d erp -v ON_ERROR_STOP=1 -c \
                  "insert into settings (key, value, updated_at) values ('ai.copilotPages', '$DS', now()) on conflict (key) do update set value = excluded.value, updated_at = now();" >/dev/null
                if [ "$BAT" = "1" ]; then NAC=COPILOT; else NAC=SHADOW; fi
                docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T db \
                  psql -U erp -d erp -v ON_ERROR_STOP=1 -c \
                  "update ai_agents set mode = '$NAC' where key = 'sales';" >/dev/null

                echo ""
                echo "── ĐỌC LẠI TỪ BẢN ĐANG CHẠY (không phải từ thứ vừa gõ) ──"
                docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T db \
                  psql -U erp -d erp -At -c "select 'nấc quyền hạn: ' || mode from ai_agents where key = 'sales';"
                docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T db \
                  psql -U erp -d erp -At -c "select 'page thí điểm: ' || coalesce(value, '(chưa khai)') from settings where key = 'ai.copilotPages';"
                docker exec vnx-ai-staging-app sh -lc 'echo "MÁY tự gửi   : ${AI_ALLOW_AUTO_SEND:-(chưa đặt)}"; echo "NGƯỜI bấm gửi: ${AI_ALLOW_HUMAN_APPROVED_SEND:-(chưa đặt)}"; echo "tạo đơn      : ${AI_ALLOW_ORDER_CREATE:-(chưa đặt)}"'
                echo ""
                echo "Mở hàng đợi: http://127.0.0.1:3100/ai/copilot (qua tunnel SSH)" ;;

              ai-staging-knowledge)
                cd /opt/vnx-ai-staging
                fetch_staging_script ai-sales-knowledge.ts | docker exec -i vnx-ai-staging-app sh -c 'cat > /app/scripts/ai-sales-knowledge.ts'
                # Mặc định CHẠY THỬ; "--apply" trong ô arg mới ghi. Không gọi mô hình, không gửi tin.
                docker compose -f docker-compose.staging.yml --env-file .env.staging \
                  exec -T app npx tsx --tsconfig tsconfig.json scripts/ai-sales-knowledge.ts ${ARG:-} ;;

              ai-staging-report)
                curl -fsSL -H "Accept: application/vnd.github.raw" -H "Cache-Control: no-cache" \
                  "https://api.github.com/repos/truyenhkm5group-stack/hkt/contents/scripts/ai-staging-report.sql?ref=${STAGING_BRANCH}" \
                  | docker exec -i vnx-ai-staging-db psql -U erp -d erp -P pager=off -f - ;;

              ai-staging-status)
                echo "── container bản chạy thử ──"
                docker ps -a --filter 'name=vnx-ai-staging' --format '  {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
                echo ""
                echo "── /api/health của bản chạy thử ──"
                curl -fsS -m 10 http://127.0.0.1:3100/api/health && echo || echo "  ✗ chưa trả lời"
                echo ""
                echo "── RAM / swap ──"; free -h; swapon --show || echo "  (chưa có swap)"
                echo ""
                echo "── bộ nhớ từng container ──"
                docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
                echo ""
                # `/api/health` chứng minh tiến trình sống và CSDL nối được — nó KHÔNG chứng minh
                # migration đã chạy xong. Đếm thẳng trong CSDL của BẢN CHẠY THỬ (không phải của
                # production: container khác, volume khác, mật khẩu khác).
                echo "── migration trên CSDL bản chạy thử ──"
                docker exec vnx-ai-staging-db psql -U erp -d erp -P pager=off -t \
                  -c "select 'đã áp: ' || count(*) from drizzle.__drizzle_migrations;" \
                  -c "select 'bảng nhân sự AI: ' || count(*) || '/14' from information_schema.tables where table_schema='public' and table_name in ('ai_agents','ai_agent_versions','ai_events','ai_tasks','ai_runs','ai_tool_calls','ai_model_calls','ai_approvals','ai_errors','sales_conversations','sales_messages','sales_suggestions','sales_followups','sales_review_labels');" \
                  -c "select 'tin đã gửi cho khách: ' || count(*) from sales_suggestions where sent;" 2>&1 || echo "  (chưa có container CSDL bản chạy thử)"
                echo ""
                kiem_production ;;

              ai-staging-logs)
                docker logs --tail 120 vnx-ai-staging-app 2>&1 || echo "(chưa có container vnx-ai-staging-app)" ;;

              ai-staging-down)
                cd /opt/vnx-ai-staging
                # `--volumes` xoá luôn CSDL của BẢN CHẠY THỬ. Volume của production tên khác hoàn
                # toàn (erp_erp_pgdata) và compose project này không biết nó tồn tại.
                if [ "${ARG:-}" = "--volumes" ]; then
                  docker compose -f docker-compose.staging.yml --env-file .env.staging down -v
                else
                  docker compose -f docker-compose.staging.yml --env-file .env.staging down
                fi
                echo ""
                kiem_production
                free -h ;;

              *) echo "Thao tác không hợp lệ: $ACTION"; exit 1 ;;
            esac
