# Thao tác vận hành ERP trên VPS từ GitHub (không cần mở console).
# Actions → "Vận hành ERP trên VPS" → Run workflow → chọn thao tác.
name: Vận hành ERP trên VPS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Thao tác"
        type: choice
        required: true
        default: status
        options:
          - status              # trạng thái container + health
          - perf                # tài nguyên VPS (CPU/RAM từng container) và thời gian phản hồi vài trang
          - disk                # ổ đĩa còn bao nhiêu và ai đang chiếm chỗ (Docker, backup, log)
          - docker-prune        # giải phóng ổ đĩa: gỡ ảnh Docker cũ (KHÔNG đụng dữ liệu, KHÔNG dừng dịch vụ)
          - logs                # 200 dòng log gần nhất của app/scheduler/caddy
          - chatbot-status      # bot chat theo TỪNG PAGE: bật/tắt, chạy thử, số trả lời, lỗi gần nhất (đã che số, không in nội dung tin) — CHỈ ĐỌC
          - sync-pancake-all    # kho → sản phẩm → đơn (lịch sử) → khách → đổi trả → nhật ký kho
          - sync-pancake-orders # đơn thay đổi gần đây
          - sync-vtp-tracking   # tra cứu trạng thái vận đơn Viettel Post
          - sync-vtp-import     # nhập vận đơn từ tài khoản Viettel Post (30 ngày)
          - sync-facebook-ads   # kéo chi tiêu quảng cáo Facebook N ngày (days)
          - check-integrations  # kiểm tra API key
          - vtp-debug           # in phản hồi thô API Viettel Post cho mã vận đơn (nhập ở ô "arg")
          - db-query            # chạy một câu SQL CHỈ ĐỌC trên CSDL ERP (nhập SQL ở ô "arg")
          - seed-employees      # khai báo nhân sự & cơ chế lương từ JSON (ô "arg")
          - import-bank-ledger  # nhập sao kê MB Bank (JSON/CSV ở ô "arg") thành chi phí vận hành
          - bank-ledger-prune   # xoá các dòng sao kê đã nhập thuộc nhóm Quảng cáo / Nhập hàng
          - import-vtp-statements # nhập bảng kê tiền COD Viettel Post (dán bảng hoặc JSON ở ô "arg")
          - vtp-statements-autolink # tự ghép vận đơn vào bảng kê theo ngày giao (arg: "--dry-run --lag=1")
          - vtp-rebuild-state    # dựng lại trạng thái vận đơn từ lịch sử sự kiện (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - cod-rebuild          # dựng lại tiền COD từ sổ chi tiết bảng kê (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - cod-status-repair    # sửa vận đơn bị gắn sai "không thu hộ" (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - vtp-return-status-repair # vá chặng đã lưu của dòng tệp mang cờ "Trả hàng" — vận đơn đang hoàn bị ghi "Chờ xử lý" (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - agent-run-reattach   # gắn lại lượt chạy agent về đúng việc theo BẢN KHAI ở ô arg (mặc định CHẠY THỬ; "--apply" mới ghi)
          - vtp-replay-files     # nhập lại các tệp Viettel Post đã lưu (mặc định CHỈ LIỆT KÊ; arg "--apply")
          - vtp-replay-explain   # vì sao dòng tệp Viettel Post đã lưu không ghép được vận đơn — kết quả MÃ HOÁ (chỉ đọc; arg "--like=<phần tên tệp>")
          - vtp-statement-peek   # xem bố cục thật của tệp bảng kê đã lưu (arg: phần tên tệp)
          - confirm-funnel-audit # "đã xác nhận" cũ vs mới + đơn huỷ khi chưa từng xác nhận, theo nguồn / giờ — số tổng hợp (CHỈ ĐỌC; arg "--days=N", thêm "--gio" = giờ lên đơn bất thường, "--xoa" = Đã xoá vs Đã huỷ)
          - org-summary          # MỘT tổ chức khách đang ở đâu: module · công tắc chatbot / ghi đơn · phí giao · kết nối (không bí mật) · đơn / kết quả / quảng cáo / giá vốn / chi phí 30 ngày — SỐ ĐẾM (CHỈ ĐỌC; arg: mã tổ chức, rỗng = liệt kê tổ chức)
          - org-order-audit      # đơn của MỘT tổ chức khách trong MỘT ngày: hội thoại có SĐT ↔ đơn ERP (đủ chưa · vì sao thiếu · trễ bao lâu) — MÃ HOÁ (CHỈ ĐỌC; arg: "<mã tổ chức> [--day=YYYY-MM-DD]")
          - org-ai-cutover       # AI Bán hàng của MỘT tổ chức khách trả tiền ở đâu + chuyển sang AI dùng chung của nền tảng: vân tay khoá (SHA-256 rút gọn, không in khoá) · project Google (Lookup nếu có credential quản trị) · credit — MÃ HOÁ (MẶC ĐỊNH CHỈ ĐỌC; arg: "<mã tổ chức>"; "--apply" chuyển; "--apply-probe --since=<ISO>" lượt thử kênh THỬ + đếm sổ AI từ mốc)
          - org-prepaid-ai       # đưa MỘT tổ chức khách sang AI dùng chung TRẢ TRƯỚC theo khách AI (Số dư AI): kế hoạch + mức dùng quy ra tiền / ngày — MÃ HOÁ (MẶC ĐỊNH CHỈ ĐỌC; arg: "<mã tổ chức>"; "--apply" làm ĐÚNG MỘT bước kế tiếp: mở nạp · kích hoạt cần "--unit=<đ>" khớp đơn giá)
          - org-volume-discount  # cài luật «bán theo gói đơn vị + giảm theo khối lượng» của bot cho MỘT tổ chức khách (chủ shop HSLC 10/10/2026): MẶC ĐỊNH CHẠY THỬ (in trước / sau); arg: "<mã> [--unit=1] [--min=2] [--amount=20000] [--mode=PER_STEP] [--off] [--apply]" — chỉ ô volumeDiscount, nhật ký người vận hành
          - order-cancel-reconcile # đơn KHÁCH ĐÃ HUỶ mà vẫn sống (sự cố HSLC 10/10/2026: AI «đồng ý huỷ», đơn vẫn «Đã xác nhận»): đếm theo dấu vết × phân loại huỷ được ngay · cần ĐVVC · cần người, CÙNG luật vòng đời vận đơn với bot — MẶC ĐỊNH CHẠY THỬ (không ghi, không gọi hãng), MÃ HOÁ, chỉ số đếm; arg: "<mã tổ chức | --all> [--days=1..365] [--apply]" (--apply chỉ chạm RESCUE_FAILED + AI_AGREED — cần chủ shop duyệt)
          - sales-stale-confirmed-repair # hội thoại có ĐƠN ĐÃ XÁC NHẬN mà sổ còn «chưa chốt» (chủ shop 11/10/2026 — HSLC: khung đơn «Đã xác nhận» mà bot vẫn nhắn «có muốn tiếp tục chốt đơn»): đếm (a) còn lịch follow-up · (b) còn WAITING / bước ≠ DONE — MẶC ĐỊNH CHẠY THỬ (không ghi), MÃ HOÁ, chỉ số đếm; arg: "<mã tổ chức | --all> [--days=1..120] [--apply]" (--apply huỷ lịch + bước DONE, không đụng đơn, không gửi tin; CẦN DEPLOY #801 TRƯỚC)
          - org-offboard         # XOÁ một workspace TỰ ĐĂNG KÝ (quyết định chủ shop 08/10/2026): MẶC ĐỊNH CHẠY THỬ (arg rỗng = mọi tổ chức; "<mã>" = một tổ chức) — loại · chứng cứ · số dòng sẽ xoá · sổ tiền · page Meta · mốc sao lưu; "<mã> --apply --confirm=<mã> --created-before=<ISO> [--allow-active]" xoá MỘT tổ chức (không nhà · brand khác NULL · có chứng cứ tự đăng ký · không tiền thật) — MÃ HOÁ
          - org-lifecycle        # LƯU TRỮ / KÍCH HOẠT LẠI một tổ chức (quyết định chủ shop 17/10/2026 — không xoá): MẶC ĐỊNH CHẠY THỬ (arg rỗng = mọi tổ chức; "<mã>" = một tổ chức) — ba chiều trạng thái (vận hành · thương mại · triển khai) · nghĩa vụ tiền · sao lưu + diễn tập gần nhất · phán quyết; "<mã> --archive --apply --confirm=<mã>" lưu trữ (không nhà · không nghiệm thu · không nghĩa vụ tiền · sao lưu OK ngoài máy ≤ 26 giờ · diễn tập OK ≤ 72 giờ); "<mã> --reactivate --apply --confirm=<mã> [--timeout=<giây>]" migrate + đối chiếu sổ rồi mới về đúng trạng thái trước khi lưu trữ — MÃ HOÁ
          - org-catalog          # danh mục (sản phẩm · mẫu mã · giá lẻ · gram) · bảng giá sỉ + bậc · câu mẫu đang bật · công tắc bot (giá sỉ · bán không kiểm tồn) · hồ sơ shop của MỘT tổ chức khách — MÃ HOÁ (CHỈ ĐỌC; arg: mã tổ chức, rỗng = liệt kê tổ chức)
          - saas-v1-migration    # chuyển tổ chức từ giá cũ (legacy) sang bảng giá V1: mỗi tổ chức đủ điều kiện — số dùng · gói đề xuất · giá cũ → mới · phần vượt dự kiến · trần AI trước / sau · mọi CHẶN — MÃ HOÁ (MẶC ĐỊNH CHỈ ĐỌC; arg: rỗng | "--org=<mã>"; "--apply --org=<mã> --plan=<khoá> --reason=<lý do>" ghim MỘT tổ chức, không bật thu phí / không hoá đơn)
          - identity-reconcile   # chỉ mục đăng nhập email / SĐT ⇒ tổ chức của tài khoản tạo trước bản vá P0 08/10/2026 (quản trị khách do job cấp phát tạo không đăng nhập được bằng email): MẶC ĐỊNH CHẠY THỬ (arg rỗng = mọi tổ chức; "<mã>" = một tổ chức) — đủ điều kiện · đúng · THIẾU · LỆCH · mồ côi; "--apply" ⇒ GHI bù qua đúng đường ghi của ứng dụng, idempotent, nhật ký nền tảng SCRIPT — MÃ HOÁ
          - ban-hang-reply-upgrade # vai trò «Nhân viên bán hàng» (mã BAN_HANG) của tổ chức đã cài mẫu AI bán hàng nhận quyền trả lời khách ai_sales:reply (chủ shop duyệt 09/10/2026): MẶC ĐỊNH CHẠY THỬ (arg rỗng = mọi tổ chức; "<mã>" = một tổ chức) — đếm sẽ nâng · đã có · bỏ qua + lý do; "--apply" ⇒ GHI qua bộ cài mẫu (so ba chiều, saveAccessRoleCore), idempotent; công khai CHỈ số đếm
          - saas-acceptance      # NGHIỆM THU khách Chốt Đơn trên production, CHỈ workspace THỬ trong sổ khai lib/constants/saas-acceptance.ts — MÃ HOÁ, công khai đúng một dòng [ops:tom-tat] (MẶC ĐỊNH CHỈ ĐỌC: kiểm workspace thử · mở vỏ app · chat công khai; "--apply" GHI: cấp phát qua job «Tạo khách» + kích hoạt + đăng nhập email không mã tổ chức, cuối lượt xoay mật khẩu; "--apply --e2e" thêm chat web → AI → đơn, TỐN AI)
          - security-acceptance  # bằng chứng production LAUNCH_GATE §3: S1 cô lập tổ chức (GET id bản ghi của tổ chức kia bằng phiên workspace nghiệm thu / phiên ADMIN nhà) · S2 quét bí mật trong trang vỏ + trang công khai · S3 phong bì bản mã — MÃ HOÁ; công khai chỉ trạng thái + số đếm (CHỈ ĐỌC; không arg)
          - ops-signals-check    # tám tín hiệu vận hành O1–O8 (LAUNCH_GATE §4) tính trên production bằng ĐÚNG hàm của khung «Sự cố 24 giờ / 7 ngày» (/platform/org) cho MỌI tổ chức — MÃ HOÁ; công khai chỉ số tổ chức theo mức + mã lý do của workspace nghiệm thu (CHỈ ĐỌC; không arg)
          - inbox-perf-probe     # Hộp thư khách mở / chuyển hội thoại mất bao lâu trên workspace khách: bấm giờ ĐÚNG chuỗi hàm máy chủ của /ai/sales-chatbot/inbox (tải: listInbox… · chuyển: loadInboxThread…), nguội / ấm, p50 · p95 · max + SQL + top câu chậm theo khối + chẩn đoán «chưa đọc» 0245 + cỡ cột state (+ EXPLAIN khi --org; thêm --analyze ⇒ thời gian thật từng nút) — MÃ HOÁ; công khai che tổ chức thành org#i, không đích (CHỈ ĐỌC; arg: "[--org=<mã>] [--samples=1..20] [--analyze]")
          - inbox-avatar-audit   # ảnh đại diện + link Facebook của hộp thư khách trên N hội thoại gần nhất của MỘT tổ chức: có ảnh · trạng thái PROFILE_* + lý do · mã lỗi Graph · payload Pancake nói gì về ảnh · bấm ảnh mở Facebook / hồ sơ nội bộ theo lý do · DẠNG fb_id / conversation_link (không in giá trị) — MÃ HOÁ (CHỈ ĐỌC; arg: "<mã tổ chức> [--limit=1..3000]")
          - pancake-avatar-shape # ảnh khách nằm ở KHOÁ nào trong payload API Pancake của MỘT tổ chức: gọi đúng API danh sách hội thoại của lượt quét lại (≤ 5) + tin (≤ 2), in ĐƯỜNG DẪN KHOÁ + kiểu + dạng (host · có tham số khoá · độ dài) — không giá trị/tên/SĐT/mã; thử điểm cuối ảnh Pancake (mã HTTP · kiểu · host chuyển hướng) — MÃ HOÁ (CHỈ ĐỌC; arg: "<mã tổ chức> [--limit=1..5]")
          - avatar-proxy-check   # ảnh khách qua proxy hỏng ở BƯỚC nào cho ≤ 5 hội thoại của MỘT tổ chức: ref · page khớp · token page (CÓ/KHÔNG + nguồn, không in token) · bước 1 Pancake (hai header) · bước 2 CDN · đường thật ⇒ reason của avatarProxyCore — không id/URL/token/tên — MÃ HOÁ (CHỈ ĐỌC; arg: "<mã tổ chức> [--limit=1..5]")
          - sender-provenance-probe # tin phía page của MỘT tổ chức mang dấu người gửi gì (7 ngày): uid nhân viên Pancake · app Hộp thư Page · app khác (ẩn 4 số cuối) · chữ hệ thống bình luận · tin mẫu · tiếng vọng bot · KHÔNG GÌ CẢ (⇒ UNKNOWN) + bao nhiêu tin không dấu nằm giữa chuỗi người đang chat — đọc CSDL + GET tin Pancake, không in chữ tin — MÃ HOÁ (CHỈ ĐỌC; arg: "<mã tổ chức> [--days=1..14] [--threads=1..80]")
          - pancake-thread-diff     # tin Pancake đối chiếu với sổ tin ERP và hộp thư: --conv=<uuid> ⇒ MỘT hội thoại (thiếu/thừa theo phía, mốc, vị trí trang đầu từng thẻ); không --conv ⇒ toàn tổ chức --hours (luồng có tin mới vs có trong ERP, tin thiếu theo giờ, trễ webhook p50/p95) — MÃ HOÁ (CHỈ ĐỌC; arg: "<mã tổ chức> [--conv=<uuid>] [--hours=1..72] [--threads=1..200]")
          - pos-reship-link   # gắn mã vận đơn VTP TẠO LẠI vào khối partner của đơn Pancake POS (nhà): MẶC ĐỊNH CHẠY THỬ; arg: "[--apply --limit=N] [--pilot] [--order=<mã đơn POS>]" — chỉ ghi partner, không đổi status, đọc lại + nhật ký — MÃ HOÁ
          - customer-360-probe   # vì sao bot không nhận ra KHÁCH CŨ trên MỘT tổ chức: --conv dữ kiện một hội thoại (hồ sơ Pancake đã lưu · đơn ERP theo mã hội thoại / mã FB / SĐT · Pancake GET tin: số SĐT, số recent_orders, đọc được bao nhiêu, đã có trong ERP bao nhiêu, dáng khoá đã che · hồ sơ Customer 360) + bối cảnh tổ chức + ba thước đo khách cũ (nhận ra · mua lại · bị hỏi lại) --days — MÃ HOÁ, chỉ số đếm (CHỈ ĐỌC; arg: "<mã tổ chức> [--conv=<uuid>] [--days=1..60]")
          - inbox-read-audit   # «chưa đọc» của hộp thư khách có bằng chứng không, trên N hội thoại gần nhất (hoặc một hội thoại) của MỘT tổ chức: mốc khách / bot / NV · con trỏ chung + số người có con trỏ riêng · số tin khách sau con trỏ · phía + mốc tin xem trước · TỔNG FALSE-UNREAD luật cũ / mới — MÃ HOÁ (CHỈ ĐỌC; arg: "<mã tổ chức> [--limit=1..3000] [--conversation=<mã>]")
          - inbox-unread-dryrun # CHẠY THỬ «tin khách chưa đọc» lưu sẵn của #792 trước khi gộp: tổng hội thoại · số turn_unhandled = true theo hàm #803 · UNREAD luật đang chạy (V3) · đổi true→false (lý do: AI · NV/page · người mở) / false→true · THỜI GIAN hàm #803 trên toàn bảng ⇒ ước lượng dẫn xuất 0245 · kích thước bảng — MÃ HOÁ (CHỈ ĐỌC; arg: "<mã tổ chức>" hoặc "--all")
          - org-migrate-probe  # vì sao MỘT tổ chức migrate chậm / hỏng (sự cố 0245 ở qa 12/10): sổ migration đã áp (số mục + tag cuối) · hàm 0245 có chưa · hội thoại theo kênh · tin theo note · PAGE_REPLY sender_kind NULL chữ ≥ 40 · page · dòng/luồng max/p95 · PAGE_REPLY mỗi page trong 168 giờ · nếu 0245 chưa có: bấm giờ định nghĩa #803 trên N luồng lớn nhất, 60 s mỗi câu — chỉ số đếm, MÃ HOÁ (CHỈ ĐỌC, không migrate; arg: "<mã tổ chức> [--top=1..50]")
          - saas-value-snapshot-check # ảnh giá trị theo tổ chức + sức khoẻ theo ngày (0240) đã chụp tới đâu: số tổ chức × cửa sổ mỗi ngày, ô phẳng CHƯA BIẾT, nguồn hỏng theo mã, phân bố mức sức khoẻ / rủi ro, thời gian lượt chụp của job alerts — MÃ HOÁ; công khai chỉ số đếm (CHỈ ĐỌC; arg: "[--days=1..30]")
          - sales-lifecycle-audit # AI bán hàng có khẳng định điều chưa xác minh không, trên MỘT tổ chức: --conv đường trả lời từng tin bot (AI / câu mẫu / hệ thống / nhắn lại) + câu khẳng định tiền / chốt · công cụ OK / lỗi · đơn nối theo từng phép nối · đuôi SĐT có ở nguồn nào (đúng/sai); --days đếm mẫu lỗi A–F — MÃ HOÁ, chỉ số đếm (CHỈ ĐỌC; arg: "<mã tổ chức> [--conv=<uuid>] [--phone-tail=NNN] [--days=1..60]")
          - sales-integrity-audit # AI bán hàng báo sai giá / xác nhận giả / bỏ rơi khách, trên MỘT tổ chức: giá bot ≠ giá đơn · giá tự đổi «2kg» · câu «đã lên đơn» khi đơn chưa có / còn cờ kiểm · chuyển người không ai nhận 1h/4h/24h · địa chỉ chưa ghép · nhắc sau đơn chốt · SĐT trong tin mà hồ sơ trống · lượt khách bị chặn không ai trả lời + ý định mua bị bỏ lỡ — MÃ HOÁ, chỉ số đếm (CHỈ ĐỌC; arg: "<mã tổ chức> [--days=1..60] [--find-name=ten_khach[,ten_2]] [--conv=<uuid>]")
