                #
                # GIÁ TRỊ SECRET KHÔNG BAO GIỜ ĐƯỢC IN — chỉ in ĐỘ DÀI. GitHub cũng tự che secret
                # trong log, nhưng không dựa vào một lớp bảo vệ duy nhất.
                cd /opt/vnx-ai-staging
                upsert_stg() { if grep -qE "^$1=" .env.staging; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env.staging; else printf '%s="%s"\n' "$1" "$2" >> .env.staging; fi; }
                if [ -z "${OPENAI_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
