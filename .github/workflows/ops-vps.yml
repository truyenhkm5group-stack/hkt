                    echo "════════ THỬ ĐĂNG NHẬP THẬT BẰNG HTTP ════════"
                    fetch_staging_script ai-staging-login-test.ts | docker exec -i vnx-ai-staging-app sh -c 'cat > /app/scripts/ai-staging-login-test.ts'
                    # Bài kiểm đỏ thì PHẢI kèm log máy chủ. Next ở chế độ production giấu chi tiết
                    # lỗi trong thân phản hồi, nên một lượt 500 không kèm log là một lượt phải chạy
                    # lại chỉ để biết vì sao — mỗi lượt như thế tốn một vòng xếp hàng trên lane VPS.
                    if docker exec -e AI_STAGING=1 -e STAGING_USER_PASSWORD="${STAGING_USER_PASSWORD:-}" vnx-ai-staging-app \
                      npx tsx --tsconfig tsconfig.json scripts/ai-staging-login-test.ts ${ARG:-}; then
                      :
                    else
                      echo ""
                      echo "──────── LOG MÁY CHỦ BẢN CHẠY THỬ (40 dòng cuối) ────────"
                      docker logs --tail 40 vnx-ai-staging-app 2>&1 || true
                      exit 1
                    fi ;;
                esac ;;

              ai-staging-live-ingest)
                # BỘ NẠP TIN SỐNG — BẬT/TẮT MỘT TIẾN TRÌNH CHỈ BIẾT ĐỌC.
                #
                # Tách khỏi `ai-staging-copilot` có chủ ý: "đọc tin về" và "người bấm gửi đi" là hai
                # mức rủi ro khác nhau, nên phải bật/tắt được rời nhau. Gộp một công tắc thì để xem
                # được tin khách phải mở luôn đường gửi.
                #
                # `AI_ALLOW_AUTO_SEND` vẫn ghim CẤM trong docker-compose.staging.yml cho CẢ HAI
                # container, và chính script bộ nạp tự từ chối khởi động nếu nó bật.
                cd /opt/vnx-ai-staging
                upsert_stg() { if grep -qE "^$1=" .env.staging; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env.staging; else printf '%s="%s"\n' "$1" "$2" >> .env.staging; fi; }
                BAT="0"; MOT="0"; GIAY=""
                for a in ${ARG:-}; do
                  case "$a" in
                    --on) BAT="1" ;;
                    --off) BAT="0" ;;
                    --once) MOT="1" ;;
                    --seconds=*) GIAY="${a#--seconds=}" ;;
                  esac
                done

                # MỘT VÒNG RỒI THOÁT — để KIỂM, không để chạy. Không đụng tới công tắc, không dựng
                # container nào: chạy trong chính container `app` rồi in kết quả.
                if [ "$MOT" = "1" ]; then
                  echo "── MỘT VÒNG NẠP (không bật gì, không gửi gì) ──"
                  docker compose -f docker-compose.staging.yml --env-file .env.staging \
                    exec -T app npx tsx --tsconfig tsconfig.json scripts/ai-live-ingest.ts --once
                  exit 0
                fi

                if [ "$BAT" = "1" ]; then
                  # KHÔNG bật một bộ nạp không có gì để đọc. Danh sách page rỗng nghĩa là chưa ai
                  # chọn page thí điểm — bật lúc ấy thì log đầy dòng "không đọc gì" và người vận
                  # hành tưởng hệ thống hỏng. Nêu đúng việc phải làm thay vì chạy rỗng.
                  SO_PAGE=$(docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T db \
                    psql -U erp -d erp -At -c "select coalesce(json_array_length(value::json), 0) from settings where key = 'ai.copilotPages';" 2>/dev/null | tr -d '\r' || echo 0)
                  if [ -z "$SO_PAGE" ] || [ "$SO_PAGE" = "0" ]; then
                    echo "✗ Chưa khai page thí điểm nào (settings.ai.copilotPages rỗng)."
                    echo "  Chạy trước: action = ai-staging-copilot, arg = \"--page=<PAGE_ID> --on\""
                    exit 1
                  fi
                  upsert_stg AI_LIVE_INGEST_ENABLED true
                  # `[ ... ] && cmd` ở đây sẽ TRẢ VỀ 1 khi vế trái sai, và cả bước đang chạy dưới
                  # `set -e` — tức là không truyền --seconds thì thao tác chết ngay tại dòng này.
                  if [ -n "$GIAY" ]; then upsert_stg AI_LIVE_INGEST_INTERVAL_SECONDS "$GIAY"; fi
                else
                  upsert_stg AI_LIVE_INGEST_ENABLED false
                fi
                upsert_stg AI_ALLOW_AUTO_SEND false
                chmod 600 .env.staging

                if [ "$BAT" = "1" ]; then
                  docker compose -f docker-compose.staging.yml --env-file .env.staging up -d ingest
                  # `app` cũng phải dựng lại: dải tình trạng trên /ai/copilot đọc AI_LIVE_INGEST_ENABLED
                  # từ môi trường của CHÍNH nó, nên không dựng lại thì màn hình vẫn báo TẮT.
                  docker compose -f docker-compose.staging.yml --env-file .env.staging up -d app
                  sleep 20
                else
                  docker compose -f docker-compose.staging.yml --env-file .env.staging rm -sf ingest >/dev/null 2>&1 || true
                  docker compose -f docker-compose.staging.yml --env-file .env.staging up -d app
                  sleep 12
                fi

                echo ""
                echo "── ĐỌC LẠI TỪ BẢN ĐANG CHẠY (không phải từ thứ vừa gõ) ──"
                docker ps -a --filter 'name=vnx-ai-staging-ingest' --format '  {{.Names}}\t{{.Status}}' || echo "  (chưa có container bộ nạp)"
                docker exec vnx-ai-staging-app sh -lc 'echo "  bộ nạp sống  : ${AI_LIVE_INGEST_ENABLED:-(chưa đặt)}"; echo "  nhịp         : ${AI_LIVE_INGEST_INTERVAL_SECONDS:-45}s"; echo "  MÁY tự gửi   : ${AI_ALLOW_AUTO_SEND:-(chưa đặt)}"; echo "  NGƯỜI bấm gửi: ${AI_ALLOW_HUMAN_APPROVED_SEND:-(chưa đặt)}"; echo "  tạo đơn      : ${AI_ALLOW_ORDER_CREATE:-(chưa đặt)}"'
                echo ""
                # `|| true` CÓ CHỦ Ý, và chỉ ở đây. Ở thao tác bật nấc trợ lý, lệch nấc nghĩa là việc
                # KHÔNG thành nên phải đỏ. Còn bộ nạp thì ĐỌC ĐƯỢC bất kể nấc nào — chặn nó lại ở
                # dòng này sẽ nuốt mất đúng phần chứng cứ cần xem: mốc đọc và số tin đã nạp.
                fetch_staging_script ai-effective-mode.ts | docker exec -i vnx-ai-staging-app sh -c 'cat > /app/scripts/ai-effective-mode.ts'
                docker compose -f docker-compose.staging.yml --env-file .env.staging \
                  exec -T app npx tsx --tsconfig tsconfig.json scripts/ai-effective-mode.ts || echo "  (nấc lệch — xem ở trên; bộ nạp vẫn đọc được nên phần dưới vẫn có nghĩa)"
                echo ""
                echo "── MỐC ĐỌC TRONG CSDL (chứng cứ vòng nào đã chạy) ──"
                docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T db \
                  psql -U erp -d erp -P pager=off -c \
                  "select page_id, to_char(last_ok_at, 'DD/MM HH24:MI:SS') as vong_gan_nhat, to_char(last_message_at, 'DD/MM HH24:MI:SS') as tin_khach_moi_nhat, messages_ingested as tin_da_nap, consecutive_errors as hong_lien_tiep, coalesce(nullif(last_error, ''), '—') as loi_cuoi from sales_ingest_cursors order by page_id;" || echo "  (bảng sales_ingest_cursors chưa có — migration chưa chạy?)"
                echo ""
                echo "── KHÔNG MỘT TIN NÀO ĐI RA (đếm thẳng trong CSDL) ──"
                docker compose -f docker-compose.staging.yml --env-file .env.staging exec -T db \
                  psql -U erp -d erp -At -c \
                  "select 'gợi ý đã gửi: ' || count(*) filter (where sent) || ' · tin do AI gửi: ' || (select count(*) from sales_messages where from_agent) from sales_suggestions;"
                echo ""
                echo "── 25 DÒNG LOG GẦN NHẤT CỦA BỘ NẠP ──"
                docker logs --tail=25 vnx-ai-staging-ingest 2>&1 || echo "  (chưa có log)"
                echo ""
                echo "Mở hàng đợi: http://127.0.0.1:3100/ai/copilot (qua tunnel SSH)" ;;

              ai-staging-domain)
                # TÊN MIỀN CHO BẢN CHẠY THỬ — thêm MỘT khối vào Caddyfile, không sửa khối của khách.
                #
                # Bốn chế độ, và mặc định là chế độ KHÔNG ĐỔI GÌ:
                #   --prepare (mặc định) : kiểm DNS + dựng cấu hình ghép + `caddy validate`. KHÔNG nạp lại.
                #   --apply              : như trên, RỒI mới nối mạng và `caddy reload`.
                #   --status             : in hiện trạng, không chạm gì.
                #   --off                : gỡ khối, validate, reload, rồi rút mạng ra.
                #
                # `caddy reload` là nạp MỀM: tiến trình không dừng, kết nối đang mở không đứt. Và nạp
                # một tệp HỎNG thì Caddy TỪ CHỐI, giữ nguyên cấu hình cũ — nhưng `validate` ở trước
                # vẫn cần, vì nó biến "chắc là ổn" thành "đã kiểm" TRƯỚC khi đụng tới tệp thật.
                CHE_DO="prepare"
                for a in ${ARG:-}; do
                  case "$a" in
                    --prepare) CHE_DO="prepare" ;;
                    --apply)   CHE_DO="apply" ;;
                    --status)  CHE_DO="status" ;;
                    --off)     CHE_DO="off" ;;
                  esac
                done
                TEN_MIEN="ai-staging.vnxcommerce.com"
                MANG="$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' vnx-ai-staging-app 2>/dev/null | awk '{print $1}')"
                [ -z "$MANG" ] && MANG="vnx-ai-staging_default"

                echo "── HIỆN TRẠNG ──"
                echo "  tên miền      : $TEN_MIEN"
                echo "  mạng bản thử  : ${MANG:-(không đọc được)}"
                IP_VPS="$(curl -fsS -m 10 https://api.ipify.org 2>/dev/null || echo '?')"
                echo "  IP công khai VPS: ${IP_VPS}"
                # Phân giải TỪ CHÍNH MÁY CHỦ. Máy nào hỏi cũng ra cùng một câu trả lời thì tốt, nhưng
                # câu trả lời đáng tin là câu đo ở nơi Let's Encrypt sẽ đi tới.
                IP_DNS="$(getent hosts "$TEN_MIEN" 2>/dev/null | awk '{print $1}' | head -1)"
                if [ -z "$IP_DNS" ]; then
                  echo "  DNS           : ✗ CHƯA TRỎ — $TEN_MIEN không phân giải được"
                  DNS_OK=0
                elif [ "$IP_DNS" = "$IP_VPS" ]; then
                  echo "  DNS           : ✓ trỏ đúng VPS ($IP_DNS)"
                  DNS_OK=1
                else
                  echo "  DNS           : ✗ trỏ tới $IP_DNS, KHÁC IP của VPS ($IP_VPS)"
                  DNS_OK=0
                fi
                # Hỏi cấu hình ĐANG CHẠY qua API quản trị, không hỏi tệp: tệp gắn chỉ-đọc không bao
                # giờ đổi, nên đọc nó sẽ luôn trả lời "chưa có" kể cả khi tên miền đang phục vụ.
                DA_CO_KHOI=0
                docker exec erp-caddy sh -c "wget -qO- http://127.0.0.1:2019/config/ 2>/dev/null | grep -qF '$TEN_MIEN'" && DA_CO_KHOI=1
                echo "  khối trong cấu hình ĐANG CHẠY: $([ "$DA_CO_KHOI" = 1 ] && echo 'ĐÃ CÓ' || echo 'chưa có')"
                docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' erp-caddy 2>/dev/null | tr ' ' '\n' | grep -q "^${MANG}$" && NOI_MANG=1 || NOI_MANG=0
                echo "  erp-caddy nối mạng bản thử: $([ "$NOI_MANG" = 1 ] && echo 'RỒI' || echo 'chưa')"

                if [ "$CHE_DO" = "status" ]; then
                  echo ""
                  echo "── TÊN MIỀN ĐANG PHỤC VỤ ──"
                  docker exec erp-caddy grep -E '^[a-z0-9.*-]+ *\{' /etc/caddy/Caddyfile 2>/dev/null | sed 's/^/  /' || true
                  exit 0
                fi

                if [ "$CHE_DO" = "off" ]; then
                  # Quay lui = nạp lại ĐÚNG tệp production đang gắn chỉ-đọc. Không phải dựng lại một
                  # tệp đã cắt: tệp gốc chưa bao giờ bị sửa, nên nó vẫn là bản sạch.
                  docker exec erp-caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
                  docker network disconnect "$MANG" erp-caddy 2>/dev/null || true
                  echo "✓ đã gỡ tên miền bản chạy thử. Production không đổi."
                  curl -fsS -m 10 https://erp.vnxcommerce.com/api/health && echo || echo "  ⚠ production chưa trả lời — xem ngay"
                  exit 0
                fi

                # ───── dựng cấu hình ghép ─────
                #
                # /etc/caddy/Caddyfile GẮN CHỈ-ĐỌC từ máy chủ (`./deploy/Caddyfile:...:ro` trong
                # docker-compose.prod.yml) nên KHÔNG ghi vào đó được, và cũng KHÔNG NÊN ghi vào tệp
                # trên máy chủ: lượt triển khai chạy `git checkout -B` trong /root/erp, nên một tệp
                # bị sửa tại chỗ sẽ làm HỎNG lần deploy production tiếp theo.
                #
                # Nên cấu hình ghép nằm ở /tmp TRONG container và Caddy nạp thẳng từ đó. Đánh đổi
                # phải nói ra: dựng lại container `erp-caddy` sẽ đọc lại tệp trên máy chủ và tên
                # miền bản chạy thử biến mất — chạy lại thao tác này là có ngay.
                curl -fsSL -H "Accept: application/vnd.github.raw" -H "Cache-Control: no-cache" \
                  "https://api.github.com/repos/truyenhkm5group-stack/hkt/contents/deploy/Caddyfile.ai-staging?ref=${STAGING_BRANCH}" > /tmp/ai-staging.caddy
                # NỀN là cấu hình production ĐANG DÙNG, cắt bỏ khối bản chạy thử nếu đã có (chạy lại
                # nhiều lần không nhân đôi khối).
                docker exec erp-caddy sh -c "awk -v d=\"$TEN_MIEN\" 'index(\$0, d) == 1 {exit} {print}' /etc/caddy/Caddyfile > /tmp/nen.caddy"
                docker cp /tmp/ai-staging.caddy erp-caddy:/tmp/them.caddy
                docker exec erp-caddy sh -c 'cat /tmp/nen.caddy /tmp/them.caddy > /tmp/Caddyfile.moi'

                echo ""
                echo "── KIỂM CẤU HÌNH GHÉP (chưa nạp) ──"
                if docker exec erp-caddy caddy validate --config /tmp/Caddyfile.moi --adapter caddyfile; then
                  echo "  ✓ cấu hình HỢP LỆ"
                else
                  echo "  ✗ cấu hình HỎNG — KHÔNG nạp gì, production giữ nguyên"
                  exit 1
                fi

                if [ "$CHE_DO" = "prepare" ]; then
                  echo ""
                  echo "── ĐÃ CHUẨN BỊ XONG, CHƯA NẠP ──"
                  if [ "$DNS_OK" = "1" ]; then
                    echo "  DNS đã trỏ đúng. Chạy lại thao tác này với arg = \"--apply\" để bật."
                  else
                    echo "  CÒN THIẾU DNS. Thêm bản ghi sau rồi chạy lại với arg = \"--apply\":"
                    echo ""
                    echo "      Loại: A     Tên: ai-staging     Giá trị: ${IP_VPS}     TTL: 300     Proxy: TẮT"
                    echo ""
                    echo "  (Không bật proxy/CDN: Caddy tự xin chứng chỉ Let's Encrypt qua cổng 80/443.)"
                  fi
                  exit 0
                fi

                # ───── apply ─────
                if [ "$DNS_OK" != "1" ]; then
                  echo ""
                  echo "✗ DỪNG: DNS chưa trỏ về VPS nên Let's Encrypt KHÔNG cấp được chứng chỉ."
                  echo "  Nạp khối lúc này chỉ tạo một vòng thử-lại ACME hỏng trong log của Caddy đang phục vụ khách."
                  echo "  Thêm bản ghi A ở trên rồi chạy lại."
                  exit 1
                fi
                # Nối mạng TRƯỚC khi nạp: nạp xong mà chưa có đường tới thì tên miền trả 502.
                if [ "$NOI_MANG" != "1" ]; then
                  docker network connect "$MANG" erp-caddy
                  echo "  ✓ đã nối erp-caddy vào $MANG (gắn thêm giao diện mạng, KHÔNG dựng lại container)"
                fi
                # Nạp THẲNG từ tệp ghép. Không đụng vào /etc/caddy/Caddyfile (chỉ-đọc) và không đụng
                # vào tệp trên máy chủ (sẽ làm hỏng `git checkout -B` của lượt deploy tiếp theo).
                docker exec erp-caddy caddy reload --config /tmp/Caddyfile.moi --adapter caddyfile
                echo "  ✓ đã nạp lại Caddy (mềm — không dựng lại, không đứt kết nối)"
                sleep 8

                echo ""
                echo "── PRODUCTION PHẢI KHÔNG ĐỔI ──"
                curl -fsS -m 10 https://erp.vnxcommerce.com/api/health && echo || echo "  ✗ production KHÔNG trả lời — cân nhắc chạy lại với --off"
                echo ""
                echo "── BẢN CHẠY THỬ QUA TÊN MIỀN ──"
                curl -fsS -m 20 "https://${TEN_MIEN}/api/health" && echo || echo "  (chứng chỉ có thể đang được cấp — đợi 30–60 giây rồi thử lại)"
                echo ""
                echo "── /ai/copilot PHẢI ĐÒI ĐĂNG NHẬP (302 về /login, KHÔNG phải 200) ──"
                curl -s -o /dev/null -w '  mã trả về: %{http_code}  ·  chuyển hướng tới: %{redirect_url}\n' -m 20 "https://${TEN_MIEN}/ai/copilot" || true
                echo ""
                echo "Mở: https://${TEN_MIEN}/ai/copilot" ;;

              ai-staging-knowledge)
                cd /opt/vnx-ai-staging
                fetch_staging_script ai-sales-knowledge.ts | docker exec -i vnx-ai-staging-app sh -c 'cat > /app/scripts/ai-sales-knowledge.ts'
                # Mặc định CHẠY THỬ; "--apply" trong ô arg mới ghi. Không gọi mô hình, không gửi tin.
                docker compose -f docker-compose.staging.yml --env-file .env.staging \
                  exec -T app npx tsx --tsconfig tsconfig.json scripts/ai-sales-knowledge.ts ${ARG:-} ;;

              ai-staging-report)
                curl -fsSL -H "Accept: application/vnd.github.raw" -H "Cache-Control: no-cache" \
                  "https://api.github.com/repos/truyenhkm5group-stack/hkt/contents/scripts/ai-staging-report.sql?ref=${STAGING_BRANCH}" \
                  | docker exec -i vnx-ai-staging-db psql -U erp -d erp -P pager=off -f - ;;

              ai-staging-audit)
                cd /opt/vnx-ai-staging
                # CHỈ ĐỌC. Soi lại trên câu ĐÃ LƯU, dùng ĐÚNG hàm `safetyFlags()` của đường chạy
                # thật — vì lưới soi lúc soạn chỉ chạy cho câu DO MÔ HÌNH viết, câu dựng từ mẫu đi
                # thẳng ra ngoài không qua lưới nào.
                fetch_staging_script ai-staging-quality-audit.ts | docker exec -i vnx-ai-staging-app sh -c 'cat > /app/scripts/ai-staging-quality-audit.ts'
                docker compose -f docker-compose.staging.yml --env-file .env.staging \
                  exec -T app npx tsx --tsconfig tsconfig.json scripts/ai-staging-quality-audit.ts ${ARG:---days=7} ;;

              ai-staging-runtime)
                cd /opt/vnx-ai-staging
                #
                # CHỈ ĐỌC — KHÔNG GHI MỘT DÒNG NÀO, KHÔNG DỰNG LẠI CONTAINER NÀO.
                #
                # Vì sao phải có thao tác này dù đã có `ai-staging-copilot` và `ai-staging-live-ingest`:
                # cả hai thao tác ấy GHI trước rồi mới đọc lại. Nhánh `--off` của bộ nạp ghi
                # `AI_LIVE_INGEST_ENABLED=false` vào `.env.staging` và dựng lại container — tức là
                # muốn BIẾT trạng thái thì phải ĐỔI nó. Với một bản chạy thử đang có phiên khác
                # dùng, đó là cái giá không được phép trả.
                #
                # Nấc quyền hạn in ra là KẾT QUẢ PHÉP TÍNH (`effectiveMode`), không phải cột
                # `ai_agents.mode`: cột từng ghi COPILOT trong khi mã đang chạy tính ra SHADOW.
                echo "── NẤC QUYỀN HẠN CÓ HIỆU LỰC ──"
                fetch_staging_script ai-effective-mode.ts | docker exec -i vnx-ai-staging-app sh -c 'cat > /app/scripts/ai-effective-mode.ts'
                docker compose -f docker-compose.staging.yml --env-file .env.staging \
                  exec -T app npx tsx --tsconfig tsconfig.json scripts/ai-effective-mode.ts || echo "  ✗ nấc LỆCH — xem ở trên"
                echo ""
                echo "── BA CÔNG TẮC, ĐỌC TỪ MÔI TRƯỜNG CỦA CHÍNH CONTAINER ĐANG CHẠY ──"
                docker exec vnx-ai-staging-app sh -lc 'echo "  MÁY tự gửi        : ${AI_ALLOW_AUTO_SEND:-(chưa đặt)}"; echo "  NGƯỜI bấm gửi     : ${AI_ALLOW_HUMAN_APPROVED_SEND:-(chưa đặt)}"; echo "  tạo đơn           : ${AI_ALLOW_ORDER_CREATE:-(chưa đặt)}"; echo "  bộ nạp sống       : ${AI_LIVE_INGEST_ENABLED:-(chưa đặt)}"; echo "  nhà cung cấp mô hình: ${AI_WORKFORCE_PROVIDER:-${AI_PROVIDER:-(chưa đặt)}}"; echo "  gọi mô hình       : ${AI_MODEL_CALLS_ENABLED:-(chưa đặt)}"'
                echo ""
                echo "── CONTAINER ──"
                docker ps -a --filter 'name=vnx-ai-staging' --format '  {{.Names}}\t{{.Status}}' || true
                echo ""
                echo "── DANH SÁCH PAGE THÍ ĐIỂM + MỐC ĐỌC + BẰNG CHỨNG AN TOÀN ──"
                curl -fsSL -H "Accept: application/vnd.github.raw" -H "Cache-Control: no-cache" \
                  "https://api.github.com/repos/truyenhkm5group-stack/hkt/contents/scripts/ai-staging-runtime.sql?ref=${STAGING_BRANCH}" \
                  | docker exec -i vnx-ai-staging-db psql -U erp -d erp -P pager=off -f -
                echo ""
                kiem_production ;;

              ai-staging-status)
                echo "── container bản chạy thử ──"
                docker ps -a --filter 'name=vnx-ai-staging' --format '  {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
                echo ""
                echo "── /api/health của bản chạy thử ──"
                curl -fsS -m 10 http://127.0.0.1:3100/api/health && echo || echo "  ✗ chưa trả lời"
                echo ""
                echo "── RAM / swap ──"; free -h; swapon --show || echo "  (chưa có swap)"
                echo ""
                echo "── bộ nhớ từng container ──"
                docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}'
                echo ""
                # `/api/health` chứng minh tiến trình sống và CSDL nối được — nó KHÔNG chứng minh
                # migration đã chạy xong. Đếm thẳng trong CSDL của BẢN CHẠY THỬ (không phải của
                # production: container khác, volume khác, mật khẩu khác).
                echo "── migration trên CSDL bản chạy thử ──"
                docker exec vnx-ai-staging-db psql -U erp -d erp -P pager=off -t \
                  -c "select 'đã áp: ' || count(*) from drizzle.__drizzle_migrations;" \
                  -c "select 'bảng nhân sự AI: ' || count(*) || '/14' from information_schema.tables where table_schema='public' and table_name in ('ai_agents','ai_agent_versions','ai_events','ai_tasks','ai_runs','ai_tool_calls','ai_model_calls','ai_approvals','ai_errors','sales_conversations','sales_messages','sales_suggestions','sales_followups','sales_review_labels');" \
                  -c "select 'tin đã gửi cho khách: ' || count(*) from sales_suggestions where sent;" 2>&1 || echo "  (chưa có container CSDL bản chạy thử)"
                echo ""
                kiem_production ;;

              ai-staging-logs)
                docker logs --tail 120 vnx-ai-staging-app 2>&1 || echo "(chưa có container vnx-ai-staging-app)" ;;

              ai-staging-down)
                cd /opt/vnx-ai-staging
                # `--volumes` xoá luôn CSDL của BẢN CHẠY THỬ. Volume của production tên khác hoàn
                # toàn (erp_erp_pgdata) và compose project này không biết nó tồn tại.
                if [ "${ARG:-}" = "--volumes" ]; then
                  docker compose -f docker-compose.staging.yml --env-file .env.staging down -v
                else
                  docker compose -f docker-compose.staging.yml --env-file .env.staging down
                fi
                echo ""
                kiem_production
                free -h ;;

              *) echo "Thao tác không hợp lệ: $ACTION"; exit 1 ;;
            esac
