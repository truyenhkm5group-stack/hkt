                [ -n "${ANTHROPIC_API_KEY:-}" ] && { upsert_stg ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"; echo "ANTHROPIC_API_KEY: đã ghi vào .env.staging (${#ANTHROPIC_API_KEY} ký tự)"; }
