# Thao tác vận hành ERP trên VPS từ GitHub (không cần mở console).
# Actions → "Vận hành ERP trên VPS" → Run workflow → chọn thao tác.
name: Vận hành ERP trên VPS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Thao tác"
        type: choice
        required: true
        default: status
        options:
          - status              # trạng thái container + health
          - perf                # tài nguyên VPS (CPU/RAM từng container) và thời gian phản hồi vài trang
          - logs                # 200 dòng log gần nhất của app/scheduler/caddy
          - sync-pancake-all    # kho → sản phẩm → đơn (lịch sử) → khách → đổi trả → nhật ký kho
          - sync-pancake-orders # đơn thay đổi gần đây
          - sync-vtp-tracking   # tra cứu trạng thái vận đơn Viettel Post
          - sync-vtp-import     # nhập vận đơn từ tài khoản Viettel Post (30 ngày)
          - sync-facebook-ads   # kéo chi tiêu quảng cáo Facebook N ngày (days)
          - check-integrations  # kiểm tra API key
          - vtp-debug           # in phản hồi thô API Viettel Post cho mã vận đơn (nhập ở ô "arg")
          - db-query            # chạy một câu SQL CHỈ ĐỌC trên CSDL ERP (nhập SQL ở ô "arg")
          - seed-employees      # khai báo nhân sự & cơ chế lương từ JSON (ô "arg")
          - import-bank-ledger  # nhập sao kê MB Bank (JSON/CSV ở ô "arg") thành chi phí vận hành
          - bank-ledger-prune   # xoá các dòng sao kê đã nhập thuộc nhóm Quảng cáo / Nhập hàng
          - import-vtp-statements # nhập bảng kê tiền COD Viettel Post (dán bảng hoặc JSON ở ô "arg")
          - vtp-statements-autolink # tự ghép vận đơn vào bảng kê theo ngày giao (arg: "--dry-run --lag=1")
          - vtp-rebuild-state    # dựng lại trạng thái vận đơn từ lịch sử sự kiện (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - cod-rebuild          # dựng lại tiền COD từ sổ chi tiết bảng kê (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - cod-status-repair    # sửa vận đơn bị gắn sai "không thu hộ" (mặc định CHẠY THỬ; arg "--apply" mới ghi)
          - vtp-replay-files     # nhập lại các tệp Viettel Post đã lưu (mặc định CHỈ LIỆT KÊ; arg "--apply")
          - vtp-statement-peek   # xem bố cục thật của tệp bảng kê đã lưu (arg: phần tên tệp)
          - vtp-retry-webhooks   # xử lý lại gói tin Viettel Post chưa ghép/chưa xử lý được
          - vtp-manual-verify    # chứng từ ĐVVC chủ shop chép tay cho lịch sử (mặc định CHẠY THỬ; arg "--apply")
          - explain-stock       # EXPLAIN ANALYZE truy vấn sổ kho — kế hoạch thực thi của câu chậm nhất
          - outcome-explain     # giải thích ERP kết luận kết quả vận đơn thế nào (arg: các mã vận đơn)
          - kpi-snapshot        # ảnh chụp KPI (kết quả đơn + ba con số tiền) để đối chiếu trước/sau deploy
          - smoke               # mở thật các màn hình chính bằng phiên đăng nhập hợp lệ, đo thời gian từng trang
          - perf-probe          # đo THỜI GIAN TỪNG TRUY VẤN của các trang chậm, trên dữ liệu thật (chỉ đọc)
          - outcome-parity      # đối chiếu TOÀN BỘ đơn: bảng kết quả đã tính sẵn vs luật chuẩn (chỉ đo; arg "--apply" mới dựng lại bảng DẪN XUẤT)
          - cogs-drift          # giá vốn lịch sử có tự đổi không: so giá vốn hôm nay với giá vốn TẠI THỜI ĐIỂM giao (chỉ đo)
          - profit-verify       # kiểm chứng Báo cáo lợi nhuận ở 3 khoảng kỳ (phân bổ chi phí, hai tỷ lệ QC)
          - set-setting         # ghi cấu hình JSON vào settings (arg: "<khoá> <json> [--test-lark]")
          - run-job             # chạy một job đồng bộ / cảnh báo (arg: "alerts" | "cs-chat --hours=48" | "vtp-tracking" …)
          - pages-debug         # dò endpoint Pancake Pages API với PANCAKE_ACCESS_TOKEN
          - phone-probe         # dò API Pancake có trả lịch sử SĐT toàn hệ thống không (nhập SĐT ở ô "arg")
          - vtp-probe           # dò API liệt kê vận đơn Viettel Post (đối tác + cổng web) với token hiện có (arg: mã vận đơn)
          - vtp-web-probe       # đọc bundle JS của viettelpost.vn để tìm endpoint API trang Quản lý vận đơn
          - cs-cleanup          # xoá case CSKH tạo nhầm từ ghi chú bot Pancake rồi quét lại
          - cs-rule-update      # đóng MỀM case sinh bởi luật cũ rồi quét lại (mặc định chỉ đếm; arg "--apply" mới ghi)
          - backup              # pg_dump vào /root/backups
          - restart             # khởi động lại app + scheduler
          - rotate-webhook-secrets # tạo lại secret webhook Pancake/Viettel Post trong .env rồi khởi động lại
          - apply-ai-env        # ghi OPENAI_API_KEY / ANTHROPIC_API_KEY / AI_PROVIDER từ Secrets vào .env, khởi động lại, rồi kiểm tra AI
          - apply-sepay-env     # ghi SEPAY_WEBHOOK_SECRET từ Secrets vào .env, khởi động lại, rồi thử chữ ký đúng/sai (KHÔNG ghi tiền vào sổ)
          - sepay-verify        # kiểm chứng đường realtime SePay trên máy chủ thật: số đo + phát lại gói tin thật để chứng minh idempotency
          - sepay-reconcile     # đối chiếu sổ với API SePay và vá gói tin webhook đã mất (MẶC ĐỊNH CHẠY THỬ; arg "--apply --days=7")
          - sepay-schedule      # bật / tắt lịch đối chiếu SePay định kỳ (arg: số phút, ví dụ "60"; "off" để tắt)
          - ai-check            # kiểm AI production đầy đủ: routing 3 bậc, chat, read tool, case care, write tool có xác nhận (arg "--write" mới ghi note kiểm thử), lỗi mạng/hạn mức, audit — chỉ in meta
      days:
        description: "Số ngày (cho sync-pancake-all / sync-vtp-import)"
        type: string
        default: "365"
      arg:
        description: "Tham số thêm (vtp-debug: mã vận đơn)"
        type: string
        default: ""

# MỘT THAO TÁC CHẠM VPS TẠI MỘT THỜI ĐIỂM.
#
# Trước đây deploy và vận hành dùng hai nhóm riêng, nên một lệnh vận hành có thể chạy ĐÈ lên giữa
# lúc deploy đang dựng ảnh và khởi động lại container — đúng lúc máy chủ yếu nhất. Nay dùng CHUNG
# một nhóm: việc thứ hai xếp hàng chờ.
#
# `cancel-in-progress: false` là bắt buộc: cắt ngang một lệnh đang ghi dữ liệu (nhập bảng kê, dựng
# lại trạng thái) nguy hiểm hơn nhiều so với việc phải chờ.
concurrency:
  group: vps-operations
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          ACTION: ${{ inputs.action }}
          DAYS: ${{ inputs.days }}
          ARG: ${{ inputs.arg }}
          # Chỉ dùng cho apply-ai-env. Secret được GitHub che trong log; KHÔNG bao giờ truyền khoá qua ô "arg".
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          # Chỉ dùng cho apply-sepay-env. Cùng nguyên tắc: GitHub che secret trong log, và tuyệt
          # đối KHÔNG truyền qua ô "arg" — ô đó được in nguyên văn vào log của mọi lần chạy.
          SEPAY_WEBHOOK_SECRET: ${{ secrets.SEPAY_WEBHOOK_SECRET }}
          SEPAY_WEBHOOK_API_KEY: ${{ secrets.SEPAY_WEBHOOK_API_KEY }}
          # Token API v2 — dùng cho đường ĐỐI CHIẾU. Khác secret webhook: secret để xác minh gói tin
          # SePay đẩy sang, token này để ERP chủ động hỏi lại SePay.
          SEPAY_API_TOKEN: ${{ secrets.SEPAY_API_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          command_timeout: 110m
          envs: ACTION,DAYS,ARG,OPENAI_API_KEY,ANTHROPIC_API_KEY,AI_PROVIDER,SEPAY_WEBHOOK_SECRET,SEPAY_WEBHOOK_API_KEY,SEPAY_API_TOKEN
          script: |
            set -e
            cd /root/erp
            C="docker compose -f docker-compose.prod.yml"
            # lấy script mới nhất trên main qua GitHub API (không bị CDN raw.githubusercontent cache 5 phút)
            fetch_script() { curl -fsSL -H "Accept: application/vnd.github.raw" -H "Cache-Control: no-cache" "https://api.github.com/repos/truyenhkm5group-stack/hkt/contents/scripts/$1?ref=main"; }
            case "$ACTION" in
              status)
                $C ps
                docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo ;;
              perf)
                nproc; free -m; uptime
                docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"
                for path in /api/health /login /api/notifications; do
                  docker exec erp-app sh -c "wget -qO /dev/null -S http://127.0.0.1:3000$path 2>&1 | head -1; echo" >/dev/null 2>&1
                  t=$(docker exec erp-app sh -c "start=\$(date +%s%N); wget -qO /dev/null http://127.0.0.1:3000$path 2>/dev/null; end=\$(date +%s%N); echo \$(( (end-start)/1000000 ))")
                  echo "$path: ${t} ms"
                done
                $C exec -T db psql -U erp -d erp -P pager=off -c "select count(*) as active, count(*) filter (where state='active') running from pg_stat_activity where datname='erp';" -c "select relname, n_live_tup from pg_stat_user_tables order by n_live_tup desc limit 8;" ;;
              logs)
                $C logs --tail=200 app scheduler caddy 2>&1 | sed -E 's/(pk|vtp)_[0-9a-f]{32}/\1_••••••••/g' ;;
              sync-pancake-all)
                docker exec erp-app npm run --silent sync -- pancake-all --backfill --days="$DAYS" ;;
              sync-pancake-orders)
                docker exec erp-app npm run --silent sync -- pancake-orders ;;
              sync-vtp-tracking)
                docker exec erp-app npm run --silent sync -- vtp-tracking --all --limit=2000 ;;
              sync-vtp-import)
                docker exec erp-app npm run --silent sync -- vtp-import --days="$DAYS" ;;
              sync-facebook-ads)
                docker exec erp-app npm run --silent sync -- facebook-ads --days="$DAYS" ;;
              sync-facebook-ads)
                docker exec erp-app npm run --silent sync -- facebook-ads --days="$DAYS" ;;
              check-integrations)
                docker exec erp-app npm run --silent check:integrations ;;
              seed-employees)
                docker exec erp-app npm run --silent seed:employees -- "$ARG" ;;
              import-bank-ledger)
                # luôn dùng bản script mới nhất trên GitHub; dữ liệu đi qua stdin, không in ra log
                fetch_script import-bank-ledger.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/import-bank-ledger.ts'
                printf '%s' "$ARG" | docker exec -i erp-app npx tsx --tsconfig tsconfig.json scripts/import-bank-ledger.ts --stdin ;;
              import-vtp-statements)
                fetch_script import-vtp-statements.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/import-vtp-statements.ts'
                printf '%s' "$ARG" | docker exec -i erp-app npx tsx --tsconfig tsconfig.json scripts/import-vtp-statements.ts --stdin ;;
              vtp-statements-autolink)
                fetch_script vtp-statement-autolink.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-statement-autolink.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-statement-autolink.ts $ARG ;;
              profit-verify)
                fetch_script profit-verify.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/profit-verify.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/profit-verify.ts ;;
              cogs-drift)
                fetch_script cogs-drift.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cogs-drift.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/cogs-drift.ts ;;
              outcome-parity)
                # Mặc định CHỈ ĐO. "--apply" dựng lại bảng dẫn xuất — KHÔNG đụng đơn, vận đơn, sự
                # kiện hay tiền; đây không phải backfill dữ liệu nghiệp vụ.
                fetch_script outcome-parity.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/outcome-parity.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/outcome-parity.ts $ARG ;;
              perf-probe)
                fetch_script perf-probe.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/perf-probe.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/perf-probe.ts ;;
              smoke)
                # Chạy smoke trên hệ thống ĐANG ỔN ĐỊNH. Khác hẳn smoke lúc deploy: lúc đó scheduler
                # vừa khởi động và đang đồng bộ toàn bộ đơn, nên trang nặng bị tranh CPU. Chạy tay ở
                # đây trả lời được câu "người dùng thật có phải chờ không", tách khỏi chi phí deploy.
                fetch_script smoke.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/smoke.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/smoke.ts || true ;;
              kpi-snapshot)
                # Dùng bản script mới nhất trên main; công thức kết quả đơn lấy từ lib trong image.
                fetch_script kpi-snapshot.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/kpi-snapshot.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/kpi-snapshot.ts ;;
              vtp-rebuild-state)
                fetch_script vtp-rebuild-state.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-rebuild-state.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-rebuild-state.ts $ARG ;;
              cod-rebuild)
                fetch_script cod-rebuild-from-statements.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cod-rebuild-from-statements.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/cod-rebuild-from-statements.ts $ARG ;;
              cod-status-repair)
                fetch_script cod-status-repair.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cod-status-repair.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/cod-status-repair.ts $ARG ;;
              vtp-replay-files)
                fetch_script vtp-replay-files.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-replay-files.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-replay-files.ts $ARG ;;
              vtp-statement-peek)
                fetch_script vtp-statement-peek.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-statement-peek.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-statement-peek.ts $ARG ;;
              vtp-retry-webhooks)
                fetch_script vtp-retry-webhooks.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-retry-webhooks.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-retry-webhooks.ts $ARG ;;
              vtp-manual-verify)
                fetch_script vtp-manual-verify.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-manual-verify.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-manual-verify.ts $ARG ;;
              explain-stock)
                fetch_script explain-stock.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/explain-stock.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/explain-stock.ts ;;
              outcome-explain)
                fetch_script order-outcome-explain.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/order-outcome-explain.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/order-outcome-explain.ts $ARG ;;
              set-setting)
                fetch_script set-setting.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/set-setting.ts'
                docker exec erp-app sh -c "npx tsx --tsconfig tsconfig.json scripts/set-setting.ts $ARG" ;;
              run-job)
                docker exec erp-app sh -c "npm run --silent sync -- $ARG" ;;
              vtp-web-probe)
                fetch_script vtp-web-probe.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-web-probe.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-web-probe.ts "$ARG" ;;
              vtp-probe)
                fetch_script vtp-probe.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-probe.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-probe.ts "$ARG" ;;
              phone-probe)
                fetch_script phone-probe.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/phone-probe.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/phone-probe.ts "$ARG" ;;
              pages-debug)
                fetch_script pages-debug.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/pages-debug.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/pages-debug.ts ;;
              cs-cleanup)
                fetch_script cs-cleanup.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cs-cleanup.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/cs-cleanup.ts ;;
              cs-rule-update)
                # Mặc định CHỈ ĐẾM. Truyền arg "--apply" mới ghi thật.
                fetch_script cs-rule-update.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cs-rule-update.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/cs-rule-update.ts $ARG ;;
              bank-ledger-prune)
                fetch_script import-bank-ledger.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/import-bank-ledger.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/import-bank-ledger.ts --prune-non-operating ;;
              db-query)
                printf '%s\n' "$ARG" | PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000' $C exec -T db psql -U erp -d erp -v ON_ERROR_STOP=1 -P pager=off ;;
              vtp-debug)
                # luôn dùng bản script mới nhất trên GitHub, không cần build lại image
                fetch_script vtp-debug.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-debug.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-debug.ts "$ARG" ;;
              backup)
                mkdir -p /root/backups
                $C exec -T db pg_dump -U erp erp | gzip > "/root/backups/erp-$(date +%F-%H%M).sql.gz"
                ls -lh /root/backups | tail -5 ;;
              rotate-webhook-secrets)
                NEW_PK="pk_$(openssl rand -hex 16)"; NEW_VTP="vtp_$(openssl rand -hex 16)"
                sed -i -E "s|^PANCAKE_WEBHOOK_SECRET=.*|PANCAKE_WEBHOOK_SECRET=\"$NEW_PK\"|; s|^VIETTELPOST_WEBHOOK_SECRET=.*|VIETTELPOST_WEBHOOK_SECRET=\"$NEW_VTP\"|" .env
                grep -qE "^PANCAKE_WEBHOOK_SECRET=\"$NEW_PK\"" .env && grep -qE "^VIETTELPOST_WEBHOOK_SECRET=\"$NEW_VTP\"" .env && echo "Đã tạo secret webhook mới (xem tại ERP → Kết nối dữ liệu)."
                $C up -d app scheduler
                sleep 10; docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo ;;
              apply-ai-env)
                # Ghi khoá AI từ Secrets vào .env (chỉ khi có giá trị), khởi động lại, rồi thử kết nối thật.
                upsert_env() { if grep -qE "^$1=" .env; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env; else printf '%s="%s"\n' "$1" "$2" >> .env; fi; }
                CHANGED=0
                [ -n "${OPENAI_API_KEY:-}" ] && { upsert_env OPENAI_API_KEY "$OPENAI_API_KEY"; CHANGED=1; echo "OPENAI_API_KEY: đã ghi (${#OPENAI_API_KEY} ký tự)"; }
                [ -n "${ANTHROPIC_API_KEY:-}" ] && { upsert_env ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"; CHANGED=1; echo "ANTHROPIC_API_KEY: đã ghi (${#ANTHROPIC_API_KEY} ký tự)"; }
                [ -n "${AI_PROVIDER:-}" ] && { upsert_env AI_PROVIDER "$AI_PROVIDER"; CHANGED=1; echo "AI_PROVIDER=$AI_PROVIDER"; }
                if [ "$CHANGED" = "0" ]; then echo "Không có Secret OPENAI_API_KEY / ANTHROPIC_API_KEY nào trong repo — chưa ghi gì. Thêm Secret ở Settings → Secrets and variables → Actions rồi chạy lại."; exit 1; fi
                $C up -d app scheduler
                sleep 12; docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo
                fetch_script check-integrations.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/check-integrations.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/check-integrations.ts --ai ;;
              ai-check)
                fetch_script ai-check.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/ai-check.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/ai-check.ts $ARG ;;
              apply-sepay-env)
                # Ghi secret webhook SePay từ Secrets vào .env rồi khởi động lại app.
                #
                # GIÁ TRỊ SECRET KHÔNG BAO GIỜ ĐƯỢC IN. Chỉ in ĐỘ DÀI để biết đã ghi được gì.
                # GitHub cũng tự che secret trong log, nhưng không dựa vào một lớp bảo vệ duy nhất.
                upsert_env() { if grep -qE "^$1=" .env; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env; else printf '%s="%s"\n' "$1" "$2" >> .env; fi; }
                if [ -z "${SEPAY_WEBHOOK_SECRET:-}" ] && [ -z "${SEPAY_WEBHOOK_API_KEY:-}" ]; then
                  echo "Chưa có Secret SEPAY_WEBHOOK_SECRET trong repo — KHÔNG ghi gì (ghi đè rỗng sẽ giết đường realtime đang chạy)."
                  echo "Thêm ở Settings → Secrets and variables → Actions rồi chạy lại."; exit 1
                fi
                # CHỈ ghi khi có giá trị: Secret trống không được phép xoá khoá đang dùng trên máy.
                [ -n "${SEPAY_WEBHOOK_SECRET:-}" ] && { upsert_env SEPAY_WEBHOOK_SECRET "$SEPAY_WEBHOOK_SECRET"; echo "SEPAY_WEBHOOK_SECRET: đã ghi (${#SEPAY_WEBHOOK_SECRET} ký tự)"; }
                [ -n "${SEPAY_WEBHOOK_API_KEY:-}" ] && { upsert_env SEPAY_WEBHOOK_API_KEY "$SEPAY_WEBHOOK_API_KEY"; echo "SEPAY_WEBHOOK_API_KEY: đã ghi (${#SEPAY_WEBHOOK_API_KEY} ký tự)"; }
                [ -n "${SEPAY_API_TOKEN:-}" ] && { upsert_env SEPAY_API_TOKEN "$SEPAY_API_TOKEN"; echo "SEPAY_API_TOKEN: đã ghi (${#SEPAY_API_TOKEN} ký tự)"; }
                $C up -d app scheduler
                sleep 12; docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo
                # ĐỌC QUA CONTAINER, KHÔNG QUA HOST. Cổng 3000 KHÔNG mở ra host trên production
                # (Caddy đi qua mạng docker) — gọi 127.0.0.1:3000 từ máy chủ luôn "Connection refused".
                echo "── GET /api/webhooks/sepay ──"
                docker exec erp-app wget -qO- http://127.0.0.1:3000/api/webhooks/sepay; echo

                # ═══ THỬ CHỮ KÝ MÀ KHÔNG GHI MỘT ĐỒNG TIỀN GIẢ NÀO VÀO SỔ ═══
                # Chi tiết vì sao gói tin thử CỐ Ý sai định dạng: xem đầu scripts/sepay-hmac-check.ts.
                # Chạy TRONG container nên secret không bao giờ phải đi qua dòng lệnh: nó đã nằm sẵn
                # trong môi trường của tiến trình, và script chỉ in ĐỘ DÀI chứ không in giá trị.
                fetch_script sepay-hmac-check.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/sepay-hmac-check.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/sepay-hmac-check.ts ;;
              sepay-verify)
                # Kiểm chứng trên máy chủ THẬT. Phép phát lại dùng đúng mã giao dịch SePay đã có nên ràng buộc
                # UNIQUE ở CSDL chặn dòng thứ hai; script vẫn đếm trước/sau và báo đỏ nếu số dòng đổi.
                fetch_script sepay-verify.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/sepay-verify.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/sepay-verify.ts ;;
              sepay-reconcile)
                # MẶC ĐỊNH CHẠY THỬ: chỉ nói sẽ vá gì, không ghi. Truyền `--apply` ở ô "arg" mới ghi.
                # Bộ đọc API này chưa từng chạy với API thật, nên phải NHÌN một lượt trước khi cho ghi.
                fetch_script sepay-reconcile.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/sepay-reconcile.ts'
                docker exec erp-app sh -c "npx tsx --tsconfig tsconfig.json scripts/sepay-reconcile.ts $ARG" ;;
              sepay-schedule)
                # Bật / tắt lịch đối chiếu định kỳ. `AGENTS.md` mục 7: đổi lịch scheduler phải do chủ
                # shop quyết, nên nó là một thao tác TƯỜNG MINH chứ không phải mặc định trong mã.
                #
                # `arg` ở đây là SỐ PHÚT, không phải bí mật — in ra log là đúng và cần thiết.
                upsert_env() { if grep -qE "^$1=" .env; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env; else printf '%s="%s"\n' "$1" "$2" >> .env; fi; }
                PHUT="$(echo "${ARG:-}" | tr -dc '0-9')"
                if [ "${ARG:-}" = "off" ] || [ -z "$PHUT" ] || [ "$PHUT" = "0" ]; then
                  upsert_env SYNC_SEPAY_EVERY_MINUTES "0"
                  upsert_env SYNC_SEPAY_APPLY "0"
                  echo "Đã TẮT lịch đối chiếu SePay định kỳ."
                else
                  upsert_env SYNC_SEPAY_EVERY_MINUTES "$PHUT"
                  # Bật lịch mà để CHẠY THỬ thì job chạy mỗi giờ và không vá gì — vô nghĩa.
                  upsert_env SYNC_SEPAY_APPLY "1"
                  echo "Đã BẬT lịch đối chiếu SePay: mỗi $PHUT phút, quét 2 ngày gần nhất, GHI THẬT."
                fi
                grep -E "^SYNC_SEPAY_" .env
                # Bộ lập lịch đọc .env lúc khởi động, nên phải dựng lại tiến trình thì lịch mới đổi.
                $C up -d scheduler
                sleep 8
                docker logs --tail 20 erp-scheduler 2>&1 | grep -i "lịch chạy" || docker logs --tail 10 erp-scheduler 2>&1 ;;
              restart)
                $C restart app scheduler
                sleep 10; docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo ;;
              *) echo "Thao tác không hợp lệ: $ACTION"; exit 1 ;;
            esac
