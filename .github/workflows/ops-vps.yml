                else
                  # KHÔNG in đường dẫn. Chỉ in kết quả tải được hay không.
                  echo "Nguồn: tải từ biến HMT_WORKBOOK_URL"
                  if ! curl -fsSL --max-time 180 -o "$TMP/hmt.xlsx" "$HMT_WORKBOOK_URL"; then
                    echo "::error::Không tải được bảng tính từ HMT_WORKBOOK_URL. Kiểm tra biến có đúng đường dẫn TẢI (không phải đường dẫn /edit) và bảng tính đã ở chế độ ai-có-link-cũng-xem-được chưa."
                    exit 1
                  fi
