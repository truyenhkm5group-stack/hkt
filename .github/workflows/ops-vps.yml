                # Ba thứ phải cùng đúng thì một tin mới đi được, và thao tác này đặt cả ba rồi ĐỌC
                # LẠI để in ra — chứ không báo "đã bật" rồi thôi.
                cd /opt/vnx-ai-staging
                upsert_stg() { if grep -qE "^$1=" .env.staging; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env.staging; else printf '%s="%s"\n' "$1" "$2" >> .env.staging; fi; }
                PAGE=""; BAT="0"
                for a in ${ARG:-}; do
                  case "$a" in
                    --page=*) PAGE="${a#--page=}" ;;
                    --on) BAT="1" ;;
                    --off) BAT="0" ;;
                  esac
                done
                if [ "$BAT" = "1" ] && [ -z "$PAGE" ]; then echo "✗ Bật nấc trợ lý thì PHẢI nêu --page=<id>: không có danh sách trắng thì không ai gửi được, và bật toàn cục là thứ bản thiết kế này từ chối."; exit 1; fi

