                #
                # ─── BA CÁCH ĐƯA TỆP VÀO, XẾP THEO ĐỘ DỄ CHO NGƯỜI DÙNG ───
                #
                #  1. KHUYẾN NGHỊ — TẢI LÊN QUA CHÍNH ERP: mở Kiểm đếm hàng hoàn → kéo tệp .xlsx
                #     vào ô "Sổ hàng hoàn viết tay". Tệp đi qua HTTPS bằng phiên đăng nhập của
