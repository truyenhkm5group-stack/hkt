                # KHÔNG có nhánh nào chạy `UPDATE` thẳng. Mặc định CHẠY THỬ; "--apply" mới ghi.
                fetch_script care-waiting-reconcile.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/care-waiting-reconcile.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/care-waiting-reconcile.ts $ARG ;;
              cs-rule-update)
                # Mặc định CHỈ ĐẾM. Truyền arg "--apply" mới ghi thật.
                fetch_script cs-rule-update.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cs-rule-update.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/cs-rule-update.ts $ARG ;;
              bank-ledger-prune)
                fetch_script import-bank-ledger.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/import-bank-ledger.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/import-bank-ledger.ts --prune-non-operating ;;
              db-query)
                printf '%s\n' "$ARG" | PGOPTIONS='-c default_transaction_read_only=on -c statement_timeout=60000' $C exec -T db psql -U erp -d erp -v ON_ERROR_STOP=1 -P pager=off ;;
              vtp-debug)
                # luôn dùng bản script mới nhất trên GitHub, không cần build lại image
                fetch_script vtp-debug.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-debug.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-debug.ts "$ARG" ;;
              vtp-import-preview)
                # CHỈ ĐỌC với shipments / shipment_events: gọi đúng hàm mà màn hình xem trước dùng.
                # Dòng duy nhất được tạo là một bản ghi vtp_import_batches ở chế độ PREVIEW.
                fetch_script vtp-import-preview.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-import-preview.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-import-preview.ts "$ARG" ;;
              vtp-capability)
                # Bộ đối chiếu định kỳ CỐ Ý không hỏi lại vận đơn đã kết luận WEBHOOK_ONLY, nên nó
                # không bao giờ phát hiện được ngày tài khoản API bắt đầu nhìn thấy chúng. Đây là
                # lượt dò CHỦ ĐỘNG cho câu hỏi đó. Mặc định CHẠY THỬ; "--apply" mới ghi.
                fetch_script vtp-capability-probe.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/vtp-capability-probe.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/vtp-capability-probe.ts $ARG ;;
              payroll-reconcile)
                # ═══ CỔNG BẮT BUỘC TRƯỚC KHI KÍCH HOẠT LƯƠNG CHO BẤT KỲ AI ═══
                #
                # Chạy ĐƯỜNG TÍNH CŨ và MÁY LƯƠNG MỚI trên CÙNG dữ liệu nguồn production rồi so
                # từng người. Chính sách ứng viên dựng TRONG BỘ NHỚ: không gán chính sách, không
                # tạo kỳ lương, không ghi sổ lỗ lũy kế, không ghi nhật ký.
                #
                # "CHỈ ĐỌC" ở đây do POSTGRES ÉP, không do script hứa. Script tự đặt
                # `ERP_READ_ONLY=1` TRƯỚC khi nạp `@/db`, nên gói khởi tạo kết nối bật
                # `default_transaction_read_only=on`; rồi nó HỎI LẠI Postgres và DỪNG nếu phiên
                # không phải chỉ đọc. Nó cũng chụp ảnh đếm 10 bảng lương TRƯỚC/SAU để chứng minh
                # không ghi gì — chứ không chỉ khẳng định.
                #
                # Bỏ trống `arg` thì script TỰ TÌM kỳ gần nhất CÓ dữ liệu nguồn và in ra từng kỳ đã
                # thử. Kỳ không có nguồn số nào khác 0 ra `RECONCILIATION_BLOCKED_BY_CONFIG` —
                # KHÔNG phải "đạt": hai phép tính cùng ra 0 trên dữ liệu rỗng không chứng minh
                # chúng đồng ý.
                #
                # KHÔNG có cờ nào bật chế độ ghi. Thao tác này không thể kích hoạt lương cho ai.
                #
                # ─── THAM SỐ ĐƯỢC SOÁT TRƯỚC KHI VÀO SHELL ───
                #
                # `$ARG` không đóng ngoặc được: tham số hợp lệ là NHIỀU cờ ("--from X --to Y") nên
                # nó phải tách theo khoảng trắng. Đóng ngoặc thành `"$ARG"` sẽ gộp tất cả thành MỘT
                # tham số và script đọc sai.
                #
                # Nên chặn ở đầu vào: chỉ cho chữ, số, và sáu ký tự `= : . _ / -` cùng khoảng trắng.
                # Bộ ấy đủ cho mọi tham số script nhận (`--from 2026-08-01`, `--employee <id>`,
                # `--csv /tmp/x.csv`) và KHÔNG chứa `; | & $ \` ( ) < > ' "` hay dòng mới — tức là
                # không còn ký tự nào ghép được một lệnh thứ hai.
                #
                # Đây là cổng ĐỌC SỐ TIỀN CỦA NGƯỜI THẬT, nên nó không đi theo lệ "truyền thẳng
                # $ARG" của các thao tác khác trong tệp này.
                case "$ARG" in
                  *[!A-Za-z0-9\ =:._/-]*)
                    echo "::error::Tham số chứa ký tự không cho phép. Chỉ nhận chữ, số và = : . _ / - (ví dụ: --from 2026-08-01 --to 2026-08-31)"
                    exit 1 ;;
                esac
                fetch_script payroll-reconcile.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/payroll-reconcile.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/payroll-reconcile.ts $ARG ;;
              backup)
                mkdir -p /root/backups
                $C exec -T db pg_dump -U erp erp | gzip > "/root/backups/erp-$(date +%F-%H%M).sql.gz"
                ls -lh /root/backups | tail -5 ;;
              rotate-webhook-secrets)
                NEW_PK="pk_$(openssl rand -hex 16)"; NEW_VTP="vtp_$(openssl rand -hex 16)"
                sed -i -E "s|^PANCAKE_WEBHOOK_SECRET=.*|PANCAKE_WEBHOOK_SECRET=\"$NEW_PK\"|; s|^VIETTELPOST_WEBHOOK_SECRET=.*|VIETTELPOST_WEBHOOK_SECRET=\"$NEW_VTP\"|" .env
                grep -qE "^PANCAKE_WEBHOOK_SECRET=\"$NEW_PK\"" .env && grep -qE "^VIETTELPOST_WEBHOOK_SECRET=\"$NEW_VTP\"" .env && echo "Đã tạo secret webhook mới (xem tại ERP → Kết nối dữ liệu)."
                $C up -d app scheduler
                sleep 10; docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo ;;
              apply-ai-env)
                # Ghi khoá AI từ Secrets vào .env (chỉ khi có giá trị), khởi động lại, rồi thử kết nối thật.
                upsert_env() { if grep -qE "^$1=" .env; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env; else printf '%s="%s"\n' "$1" "$2" >> .env; fi; }
                CHANGED=0
                [ -n "${OPENAI_API_KEY:-}" ] && { upsert_env OPENAI_API_KEY "$OPENAI_API_KEY"; CHANGED=1; echo "OPENAI_API_KEY: đã ghi (${#OPENAI_API_KEY} ký tự)"; }
                [ -n "${ANTHROPIC_API_KEY:-}" ] && { upsert_env ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"; CHANGED=1; echo "ANTHROPIC_API_KEY: đã ghi (${#ANTHROPIC_API_KEY} ký tự)"; }
                [ -n "${AI_PROVIDER:-}" ] && { upsert_env AI_PROVIDER "$AI_PROVIDER"; CHANGED=1; echo "AI_PROVIDER=$AI_PROVIDER"; }
                if [ "$CHANGED" = "0" ]; then echo "Không có Secret OPENAI_API_KEY / ANTHROPIC_API_KEY nào trong repo — chưa ghi gì. Thêm Secret ở Settings → Secrets and variables → Actions rồi chạy lại."; exit 1; fi
                $C up -d app scheduler
                sleep 12; docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo
                fetch_script check-integrations.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/check-integrations.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/check-integrations.ts --ai ;;
              ai-check)
                fetch_script ai-check.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/ai-check.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/ai-check.ts $ARG ;;
              apply-sepay-env)
                # Ghi secret webhook SePay từ Secrets vào .env rồi khởi động lại app.
                #
                # GIÁ TRỊ SECRET KHÔNG BAO GIỜ ĐƯỢC IN. Chỉ in ĐỘ DÀI để biết đã ghi được gì.
                # GitHub cũng tự che secret trong log, nhưng không dựa vào một lớp bảo vệ duy nhất.
                upsert_env() { if grep -qE "^$1=" .env; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env; else printf '%s="%s"\n' "$1" "$2" >> .env; fi; }
                if [ -z "${SEPAY_WEBHOOK_SECRET:-}" ] && [ -z "${SEPAY_WEBHOOK_API_KEY:-}" ]; then
                  echo "Chưa có Secret SEPAY_WEBHOOK_SECRET trong repo — KHÔNG ghi gì (ghi đè rỗng sẽ giết đường realtime đang chạy)."
                  echo "Thêm ở Settings → Secrets and variables → Actions rồi chạy lại."; exit 1
                fi
                # CHỈ ghi khi có giá trị: Secret trống không được phép xoá khoá đang dùng trên máy.
                [ -n "${SEPAY_WEBHOOK_SECRET:-}" ] && { upsert_env SEPAY_WEBHOOK_SECRET "$SEPAY_WEBHOOK_SECRET"; echo "SEPAY_WEBHOOK_SECRET: đã ghi (${#SEPAY_WEBHOOK_SECRET} ký tự)"; }
                [ -n "${SEPAY_WEBHOOK_API_KEY:-}" ] && { upsert_env SEPAY_WEBHOOK_API_KEY "$SEPAY_WEBHOOK_API_KEY"; echo "SEPAY_WEBHOOK_API_KEY: đã ghi (${#SEPAY_WEBHOOK_API_KEY} ký tự)"; }
                [ -n "${SEPAY_API_TOKEN:-}" ] && { upsert_env SEPAY_API_TOKEN "$SEPAY_API_TOKEN"; echo "SEPAY_API_TOKEN: đã ghi (${#SEPAY_API_TOKEN} ký tự)"; }
                $C up -d app scheduler
                sleep 12; docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo
                # ĐỌC QUA CONTAINER, KHÔNG QUA HOST. Cổng 3000 KHÔNG mở ra host trên production
                # (Caddy đi qua mạng docker) — gọi 127.0.0.1:3000 từ máy chủ luôn "Connection refused".
                echo "── GET /api/webhooks/sepay ──"
                docker exec erp-app wget -qO- http://127.0.0.1:3000/api/webhooks/sepay; echo

                # ═══ THỬ CHỮ KÝ MÀ KHÔNG GHI MỘT ĐỒNG TIỀN GIẢ NÀO VÀO SỔ ═══
                # Chi tiết vì sao gói tin thử CỐ Ý sai định dạng: xem đầu scripts/sepay-hmac-check.ts.
                # Chạy TRONG container nên secret không bao giờ phải đi qua dòng lệnh: nó đã nằm sẵn
                # trong môi trường của tiến trình, và script chỉ in ĐỘ DÀI chứ không in giá trị.
                fetch_script sepay-hmac-check.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/sepay-hmac-check.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/sepay-hmac-check.ts ;;
              apply-tech-github-env)
                # ═══ TUỲ CHỌN — KHO PUBLIC KHÔNG CẦN THAO TÁC NÀY ═══
                #
                # GitHub cho đọc workflow và lượt chạy của kho PUBLIC mà không cần xác thực, nên
                # đường đọc deploy của Phòng Tech AI chạy được với ZERO cấu hình. Thao tác này chỉ
                # dành cho hai tình huống:
                #
                #   · kho chuyển sang PRIVATE — lúc đó lượt gọi ẩn danh luôn thấy 404;
                #   · gặp lỗi hạn mức — gọi ẩn danh được 60 request/giờ tính theo IP của máy chủ,
                #     có token thì 5.000/giờ.
                #
                # Nó làm ĐÚNG BA việc: ghi ba biến vào .env, khởi động lại app + scheduler để tiến
                # trình đọc được biến mới, rồi HỎI GitHub một câu chỉ-đọc. Không chạy migration,
                # không chạy job ghi, không đổi một dòng nghiệp vụ nào.
                #
                # GIÁ TRỊ TOKEN KHÔNG BAO GIỜ ĐƯỢC IN — chỉ ĐỘ DÀI, đủ để trả lời "đã ghi được chưa"
                # mà không đủ để dùng lại. Kho mã này PUBLIC nên log Actions ai cũng đọc được.
                upsert_env() { if grep -qE "^$1=" .env; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env; else printf '%s="%s"\n' "$1" "$2" >> .env; fi; }
                # ═══ HAI KHOÁ, HAI QUYỀN, VÀ KHÔNG KHOÁ NÀO BẮT BUỘC ═══
                #
                # `ERP_GITHUB_TOKEN`          — ĐỌC lượt deploy. Kho PUBLIC thì KHÔNG cần.
                # `ERP_GITHUB_DISPATCH_TOKEN` — KHỞI ĐỘNG workflow (`actions: write`). Đây là thứ
                #                                nút "Khởi động lượt chạy agent" trong ERP cần.
                #
                # Bản trước BẮT BUỘC phải có khoá ĐỌC rồi mới ghi được gì — nên người chỉ muốn khai
                # khoá KHỞI ĐỘNG thì thao tác chết ở dòng đầu, với một thông điệp nói về đúng thứ họ
                # không cần. Đã cắn thật (run #1624). Nay: có khoá nào thì ghi khoá ấy.
                if [ -z "${ERP_GITHUB_TOKEN:-}" ] && [ -z "${ERP_GITHUB_DISPATCH_TOKEN:-}" ]; then
                  echo "Kho chưa có Secret nào trong hai khoá này — KHÔNG ghi gì:"
                  echo "  · ERP_GITHUB_TOKEN          — để ĐỌC lượt deploy (kho PUBLIC thì KHÔNG cần)."
                  echo "  · ERP_GITHUB_DISPATCH_TOKEN — để ERP KHỞI ĐỘNG được lượt chạy agent."
                  echo
                  echo "Thêm ở: Settings → Secrets and variables → Actions → New repository secret,"
                  echo "rồi chạy lại đúng thao tác này. Token KHÔNG nhập vào ô \"arg\" — ô ấy không dùng ở đây."
                  echo
                  echo "Khoá KHỞI ĐỘNG tạo bằng Fine-grained PAT, chọn ĐÚNG kho này, và ĐÚNG MỘT quyền:"
                  echo "  Repository permissions → Actions → Read and write."
                  exit 1
                fi
                if [ -n "${ERP_GITHUB_TOKEN:-}" ]; then
                  upsert_env ERP_GITHUB_TOKEN "$ERP_GITHUB_TOKEN"; echo "ERP_GITHUB_TOKEN: đã ghi (${#ERP_GITHUB_TOKEN} ký tự)"
                else
                  echo "ERP_GITHUB_TOKEN: chưa khai — bỏ qua (kho PUBLIC đọc được mà không cần token)."
                fi
                if [ -n "${ERP_GITHUB_DISPATCH_TOKEN:-}" ]; then
                  upsert_env ERP_GITHUB_DISPATCH_TOKEN "$ERP_GITHUB_DISPATCH_TOKEN"; echo "ERP_GITHUB_DISPATCH_TOKEN: đã ghi (${#ERP_GITHUB_DISPATCH_TOKEN} ký tự)"
                else
                  echo "ERP_GITHUB_DISPATCH_TOKEN: chưa khai — nút \"Khởi động lượt chạy agent\" sẽ vẫn nói lý do và không gọi gì."
                fi
                [ -n "${ERP_GITHUB_REPO:-}" ] && { upsert_env ERP_GITHUB_REPO "$ERP_GITHUB_REPO"; echo "ERP_GITHUB_REPO=$ERP_GITHUB_REPO"; }
                [ -n "${ERP_GITHUB_DEPLOY_WORKFLOW:-}" ] && { upsert_env ERP_GITHUB_DEPLOY_WORKFLOW "$ERP_GITHUB_DEPLOY_WORKFLOW"; echo "ERP_GITHUB_DEPLOY_WORKFLOW=$ERP_GITHUB_DEPLOY_WORKFLOW"; }
                $C up -d app scheduler
                sleep 12; docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo
                # Thử kết nối CHẠY TRONG container: token đã nằm sẵn trong môi trường tiến trình nên
                # không phải đi qua dòng lệnh, và script chỉ in danh tính ĐÃ CHE.
                fetch_script check-integrations.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/check-integrations.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/check-integrations.ts --github ;;
              sepay-verify)
                # Kiểm chứng trên máy chủ THẬT. Phép phát lại dùng đúng mã giao dịch SePay đã có nên ràng buộc
                # UNIQUE ở CSDL chặn dòng thứ hai; script vẫn đếm trước/sau và báo đỏ nếu số dòng đổi.
                fetch_script sepay-verify.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/sepay-verify.ts'
                docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/sepay-verify.ts ;;
              sepay-reconcile)
                # MẶC ĐỊNH CHẠY THỬ: chỉ nói sẽ vá gì, không ghi. Truyền `--apply` ở ô "arg" mới ghi.
                # Bộ đọc API này chưa từng chạy với API thật, nên phải NHÌN một lượt trước khi cho ghi.
                fetch_script sepay-reconcile.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/sepay-reconcile.ts'
                docker exec erp-app sh -c "npx tsx --tsconfig tsconfig.json scripts/sepay-reconcile.ts $ARG" ;;
              cs-stale)
                # MẶC ĐỊNH CHẠY THỬ: in kết luận cho từng loại case và 20 mẫu thật, KHÔNG ghi một dòng
                # nào. Truyền `--apply` ở ô "arg" mới đóng mềm. Máy chỉ đóng case mà CHỨNG TỪ nghiệp vụ
                # nói rõ điều kiện không còn VÀ chưa ai cầm; case có người chạm vào thì để người quyết.
                fetch_script cs-stale.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/cs-stale.ts'
                docker exec erp-app sh -c "npx tsx --tsconfig tsconfig.json scripts/cs-stale.ts $ARG" ;;
              sepay-schedule)
                # Bật / tắt lịch đối chiếu định kỳ. `AGENTS.md` mục 7: đổi lịch scheduler phải do chủ
                # shop quyết, nên nó là một thao tác TƯỜNG MINH chứ không phải mặc định trong mã.
                #
                # `arg` ở đây là SỐ PHÚT, không phải bí mật — in ra log là đúng và cần thiết.
                upsert_env() { if grep -qE "^$1=" .env; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env; else printf '%s="%s"\n' "$1" "$2" >> .env; fi; }
                PHUT="$(echo "${ARG:-}" | tr -dc '0-9')"
                if [ "${ARG:-}" = "off" ] || [ -z "$PHUT" ] || [ "$PHUT" = "0" ]; then
                  upsert_env SYNC_SEPAY_EVERY_MINUTES "0"
                  upsert_env SYNC_SEPAY_APPLY "0"
                  echo "Đã TẮT lịch đối chiếu SePay định kỳ."
                else
                  upsert_env SYNC_SEPAY_EVERY_MINUTES "$PHUT"
                  # Bật lịch mà để CHẠY THỬ thì job chạy mỗi giờ và không vá gì — vô nghĩa.
                  upsert_env SYNC_SEPAY_APPLY "1"
                  echo "Đã BẬT lịch đối chiếu SePay: mỗi $PHUT phút, quét 2 ngày gần nhất, GHI THẬT."
                fi
                grep -E "^SYNC_SEPAY_" .env
                # Bộ lập lịch đọc .env lúc khởi động, nên phải dựng lại tiến trình thì lịch mới đổi.
                $C up -d scheduler
                sleep 8
                docker logs --tail 20 erp-scheduler 2>&1 | grep -i "lịch chạy" || docker logs --tail 10 erp-scheduler 2>&1 ;;
              restart)
                $C restart app scheduler
                sleep 10; docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo ;;
              *) echo "Thao tác không hợp lệ: $ACTION"; exit 1 ;;
            esac

  # ═══════════ apply-agent-env — JOB RIÊNG, VÀ CHỈ NÓ MANG ENVIRONMENT ═══════════
  #
  # Ba secret `ERP_AGENT_GITHUB_*` sống trong Environment `agent-identity` (chính sách nhánh: chỉ
  # `main`). Job này là chỗ DUY NHẤT trong tệp đọc chúng, nên nó là chỗ duy nhất khai `environment`.
  #
  # VÌ SAO KHÔNG GẮN CHO JOB `ops`: làm thế thì `status`, `logs`, `db-query` và ~60 thao tác khác
  # đều phải đi qua Environment và chịu chính sách nhánh của nó. Một hàng rào dựng cho ba secret
  # không được phép trở thành điều kiện của những thao tác không liên quan tới ba secret ấy.
  #
  # Nó VẪN cầm đúng ổ khoá vòng đời như mọi thao tác GHI: nó ghi `.env` rồi dựng lại container, nên
  # chạy song song với deploy là đúng thứ `flock` sinh ra để chặn.
  agent-env:
    if: inputs.action == 'apply-agent-env'
    environment: agent-identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          ACTION: ${{ inputs.action }}
          RUN_ID: ${{ github.run_id }}
          LOCK_WAIT_WRITE: "1800"
          # ĐỌC TỪ ENVIRONMENT `agent-identity`, không phải từ secret của kho. Không có bản cùng
          # tên ở mức kho — để một bản là giữ nguyên đúng cái đường mà Environment sinh ra để đóng.
          ERP_AGENT_GITHUB_APP_ID: ${{ secrets.ERP_AGENT_GITHUB_APP_ID }}
          ERP_AGENT_GITHUB_INSTALLATION_ID: ${{ secrets.ERP_AGENT_GITHUB_INSTALLATION_ID }}
          ERP_AGENT_GITHUB_PRIVATE_KEY: ${{ secrets.ERP_AGENT_GITHUB_PRIVATE_KEY }}
          ERP_GITHUB_REPO: ${{ vars.ERP_GITHUB_REPO || github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          command_timeout: 25m
          envs: ACTION,RUN_ID,LOCK_WAIT_WRITE,ERP_AGENT_GITHUB_APP_ID,ERP_AGENT_GITHUB_INSTALLATION_ID,ERP_AGENT_GITHUB_PRIVATE_KEY,ERP_GITHUB_REPO
          script: |
            set -e
            cd /root/erp
            C="docker compose -f docker-compose.prod.yml"
            fetch_script() { curl -fsSL -H "Accept: application/vnd.github.raw" -H "Cache-Control: no-cache" "https://api.github.com/repos/truyenhkm5group-stack/hkt/contents/scripts/$1?ref=main"; }

            # CÙNG ổ khoá vòng đời, CÙNG chế độ ĐỘC QUYỀN như nhánh GHI của job `ops`. Đây là thao
            # tác ghi `.env` + dựng lại container, nên nó phải nằm cùng hàng đợi với deploy.
            # `tests/ops-concurrency.test.ts` khẳng định hai chỗ dùng đúng một tệp khoá và một chế độ.
            KHOA_VONG_DOI=/var/lock/erp-lifecycle.lock
            mkdir -p /var/lock
            _t0=$(date +%s)
            echo "[khoá] xin ĐỘC QUYỀN $KHOA_VONG_DOI — run=$RUN_ID action=$ACTION (ghi / khởi động lại) lúc $(date -u +%FT%TZ), trần ${LOCK_WAIT_WRITE}s"
            exec 9>"$KHOA_VONG_DOI"
            if flock -x -w "$LOCK_WAIT_WRITE" 9; then
              echo "[khoá] ĐÃ LẤY ĐƯỢC $KHOA_VONG_DOI lúc $(date -u +%FT%TZ) — chờ $(( $(date +%s)-_t0 ))s"
            else
              echo "::error::[khoá] HẾT GIỜ CHỜ $KHOA_VONG_DOI sau $(( $(date +%s)-_t0 ))s — run=$RUN_ID action=$ACTION. Thao tác DỪNG và KHÔNG chạy."
              exit 75
            fi

            # ═══ DANH TÍNH GITHUB RIÊNG CỦA CODING AGENT ═══
            #
            # Ghi credential của GitHub App `erp-agent` vào .env rồi khởi động lại app, rồi HỎI
            # GitHub một câu CHỈ ĐỌC để xác nhận đổi được token cài đặt.
            #
            # KHOÁ RIÊNG KHÔNG BAO GIỜ ĐƯỢC IN — chỉ ĐỘ DÀI. Kho mã này PUBLIC nên log Actions
            # ai cũng đọc được, và một khoá riêng in ra log là một khoá phải thu hồi.
            #
            # Thao tác này KHÔNG cấp thêm quyền cho agent: quyền nằm ở chính GitHub App, khai
            # lúc tạo App. Nó chỉ đưa credential tới nơi ERP đọc được.
            upsert_env() { if grep -qE "^$1=" .env; then sed -i -E "s|^$1=.*|$1=\"$2\"|" .env; else printf '%s="%s"\n' "$1" "$2" >> .env; fi; }
            THIEU=""
            [ -z "${ERP_AGENT_GITHUB_APP_ID:-}" ] && THIEU="$THIEU ERP_AGENT_GITHUB_APP_ID"
            [ -z "${ERP_AGENT_GITHUB_INSTALLATION_ID:-}" ] && THIEU="$THIEU ERP_AGENT_GITHUB_INSTALLATION_ID"
            [ -z "${ERP_AGENT_GITHUB_PRIVATE_KEY:-}" ] && THIEU="$THIEU ERP_AGENT_GITHUB_PRIVATE_KEY"
            if [ -n "$THIEU" ]; then
              # ĐÚNG NGỮ PHÁP CHƯA ĐỦ, PHẢI ĐÚNG ĐỊA CHỈ. Câu cũ ("Thêm ở Settings → Secrets and
              # variables → Actions") đẩy người đọc đi tạo lại Repository secret — tức dựng lại
              # đúng bản trùng tên mà Environment `agent-identity` sinh ra để xoá (PR #33, #39).
              echo "::error::Không đọc được:$THIEU — KHÔNG ghi gì vào .env."
              echo "Ba secret này CHỈ sống trong Environment 'agent-identity'. Kiểm theo thứ tự:"
              echo "  1. Job có khai 'environment: agent-identity' ở MỨC JOB chưa?"
              echo "     (mức step không đủ — bước khác trong cùng job vẫn đọc secret của kho)"
              echo "  2. Deployment branch policy của Environment có cho nhánh đang chạy không?"
              echo "     Mặc định CHỈ 'main'. Xem Settings → Environments → agent-identity."
              echo "KHÔNG tạo Repository secret cùng tên: bản trùng tên dựng lại đúng lỗ hổng mà"
              echo "Environment sinh ra để đóng. Xem docs/agent-pr-bridge.md."
              exit 1
            fi
            upsert_env ERP_AGENT_GITHUB_APP_ID "$ERP_AGENT_GITHUB_APP_ID"; echo "ERP_AGENT_GITHUB_APP_ID: đã ghi (${#ERP_AGENT_GITHUB_APP_ID} ký tự)"
            upsert_env ERP_AGENT_GITHUB_INSTALLATION_ID "$ERP_AGENT_GITHUB_INSTALLATION_ID"; echo "ERP_AGENT_GITHUB_INSTALLATION_ID: đã ghi (${#ERP_AGENT_GITHUB_INSTALLATION_ID} ký tự)"
            upsert_env ERP_AGENT_GITHUB_PRIVATE_KEY "$ERP_AGENT_GITHUB_PRIVATE_KEY"; echo "ERP_AGENT_GITHUB_PRIVATE_KEY: đã ghi (${#ERP_AGENT_GITHUB_PRIVATE_KEY} ký tự — GIÁ TRỊ KHÔNG IN)"
            [ -n "${ERP_GITHUB_REPO:-}" ] && { upsert_env ERP_AGENT_GITHUB_REPO "$ERP_GITHUB_REPO"; echo "ERP_AGENT_GITHUB_REPO=$ERP_GITHUB_REPO"; }
            $C up -d app scheduler
            sleep 12; docker exec erp-app wget -qO- http://127.0.0.1:3000/api/health; echo
            # Thử CHẠY TRONG container: credential đã nằm sẵn trong môi trường tiến trình nên
            # không phải đi qua dòng lệnh, và script chỉ in danh tính ĐÃ CHE.
            fetch_script check-integrations.ts | docker exec -i erp-app sh -c 'cat > /app/scripts/check-integrations.ts'
            docker exec erp-app npx tsx --tsconfig tsconfig.json scripts/check-integrations.ts --agent-identity 
