# ═══════════ MÁY CHẠY AGENT CỦA PHÒNG TECH AI ═══════════
#
# Actions → "Chạy agent Tech" → Run workflow.
#
# ─── VÌ SAO Ở ĐÂY, KHÔNG PHẢI TRÊN VPS ───
#
# Runner cần kho git, `npm`, và một khoá AI. Container production chạy một bản Next.js ĐÃ DỰNG:
# trong đó không có kho git, không có `node_modules` của dev, và KHÔNG NÊN có. Nhét runner vào đó
# là biến máy chủ bán hàng thành máy build — thêm một bề mặt tấn công mới lên đúng chỗ giữ tiền
# của shop. Máy Actions có đủ bốn thứ cần, dùng một lần rồi bỏ, và không chạm được production.
#
# ─── HẬU QUẢ PHẢI NÓI RA: SỔ NẰM Ở CSDL TẠM ───
#
# Máy Actions KHÔNG nối được tới PostgreSQL production (nó nằm sau mạng docker của VPS, không mở
# ra ngoài) — và đó là ĐÚNG. Nên `tech_agent_runs` của lượt chạy này nằm trong một CSDL PGlite
# dùng-một-lần, và bằng chứng được XUẤT RA thành hiện vật + in vào log. Nó là một dòng sổ THẬT
# với kết quả cổng đọc từ mã thoát thật, nhưng nó KHÔNG hiện ở `/tech` trên production. Ai đọc
# báo cáo cũng phải biết điều đó.
#
# ─── WORKFLOW NÀY KHÔNG BAO GIỜ ───
#
# Không merge. Không đẩy `main`. Không deploy. Không SSH vào production. Không ghi một dòng dữ
# liệu nghiệp vụ nào. Thứ duy nhất nó đẩy lên kho là nhánh `ai/documentation/*` — để bằng chứng
# sống sót sau khi máy Actions bị xoá, và để người xem được diff.
name: Chạy agent Tech

on:
  workflow_dispatch:
    inputs:
      gates:
        description: "Cổng runner phải chạy (phân tách bằng dấu phẩy)"
        type: string
        default: "typecheck,lint,test,build"
      task:
        # MÃ việc, KHÔNG phải nội dung việc. Kho này PUBLIC và đầu vào dispatch hiện nguyên văn
        # trong giao diện Actions — nhét tiêu đề/mô tả vào đây là công khai nội dung nội bộ. Nội
        # dung đi qua cửa ĐỌC hẹp `GET /api/tech/agent-task`, xác thực bằng khoá.
        description: "Mã việc Tech cần làm (ví dụ TECH-12). Bỏ trống = tự tạo việc R0 để tự kiểm."
        type: string
        required: false
        default: ""
      rerun_branch:
        # NẤC 5 — sửa tiếp trên CHÍNH nhánh đã mở PR, thay vì đẻ nhánh thứ hai và bỏ PR cũ chết ở đó.
        # Tên nhánh được kiểm ở `checkRerun` (phải thuộc đúng vai đang chạy) chứ KHÔNG kiểm ở đây:
        # một phép kiểm trong YAML thì chỉ workflow này có, phép kiểm trong mã thì mọi đường gọi đều có.
        description: "Chạy lại trên nhánh ai/<vai>/... đã có. Bỏ trống = mở nhánh mới."
        type: string
        required: false
        default: ""
      feedback:
        # Phản hồi review là DỮ LIỆU, không phải mệnh lệnh: nó tới tay model, nhưng phạm vi ghi do
        # `checkWritePath` quyết ở tầng mã. Nội dung này đã công khai ở PR nên ô dispatch công khai
        # không làm lộ thêm gì — khác hẳn nội dung VIỆC, thứ phải đi qua cửa đọc có khoá.
        description: "Phản hồi review cần agent sửa (chỉ dùng cùng rerun_branch)."
        type: string
        required: false
        default: ""

# `contents: write` CHỈ để đẩy nhánh `ai/documentation/*`. Bước đẩy tự kiểm tên nhánh trước khi
# chạy, nên một lỗi ở chỗ khác cũng không biến quyền này thành đường ghi vào `main`.
permissions:
  contents: write
  # ═══ ĐỦ CHO CẦU NỐI MỞ PR, KHÔNG HƠN MỘT NẤC ═══
  #
  # Khai `permissions:` ở đây đặt MỌI phạm vi không được liệt kê thành `none`. Cầu nối mở PR xin
  # `pull-requests: read` để đọc lại PR làm đối chứng — nhiều hơn `none`, nên GitHub coi đó là leo
  # thang và TỪ CHỐI CẢ WORKFLOW trước khi job đầu tiên chạy (`startup_failure`, không log, không
  # annotation — đã cắn thật ở lượt chạy #13).
  #
  # Luật của workflow được gọi: nó chỉ ĐƯỢC BỚT, không được thêm. Nên nơi gọi phải cấp ÍT NHẤT
  # những gì nơi được gọi khai. `read` chứ không `write`: cầu nối dùng GITHUB_TOKEN để ĐỌC LẠI PR,
  # còn việc mở PR đi bằng danh tính App — hai thứ khác nhau và phải giữ khác nhau.
  pull-requests: read

# Hai lượt chạy agent cùng lúc sẽ tranh nhau cùng một việc và ghi đè bằng chứng của nhau.
# `cancel-in-progress: false`: cắt ngang một lượt đang chạy cổng còn tệ hơn phải chờ.
concurrency:
  group: tech-agent-run
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      # Rỗng = KHÔNG mở PR. Bước đẩy nhánh chỉ điền ba giá trị này khi đủ MỌI điều kiện.
      nhanh_pr: ${{ steps.day.outputs.nhanh_pr }}
      pr_title: ${{ steps.chu.outputs.title }}
      pr_body: ${{ steps.chu.outputs.body }}
    steps:
      # `fetch-depth: 0` là bắt buộc: runner dựng cây làm việc bằng `git worktree add` từ một SHA
      # ĐÃ VÀO KHO. Bản checkout nông không có object đó và lượt chạy chết ở bước đầu tiên.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      # KHÔNG in giá trị khoá, và cũng không in độ dài — chỉ CÓ / KHÔNG. Kho mã này PUBLIC nên
      # log Actions ai cũng đọc được.
      - name: Kiểm khoá AI của máy runner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::CONFIG_REQUIRED — kho chưa có Secret ANTHROPIC_API_KEY (hoặc OPENAI_API_KEY)."
            echo "Thêm ở Settings → Secrets and variables → Actions → New repository secret, rồi chạy lại."
            echo "Đây KHÔNG phải lỗi của agent: agent chưa từng chạy."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY: $([ -n "${ANTHROPIC_API_KEY:-}" ] && echo 'có' || echo 'không')"
          echo "OPENAI_API_KEY:    $([ -n "${OPENAI_API_KEY:-}" ] && echo 'có' || echo 'không')"

      # ═══ GHIM NHÀ CUNG CẤP CHO MÁY RUNNER ═══
      #
      # ĐÃ ĐO THẬT (lượt chạy đầu tiên, 19/09/2026): kho có CẢ HAI khoá, `resolveProviderName()`
      # để `auto` thì ưu tiên OpenAI, và khoá OpenAI trả
      #     429 You have no credits remaining.
      # Agent không chạy một vòng nào — và nếu lúc đó có ai đọc nhanh, họ sẽ tưởng agent hỏng.
      #
      # Nên runner KHAI THẲNG nó dùng khoá nào, thay vì để một thứ tự ưu tiên ngầm quyết định.
      # `vars.AI_PROVIDER` vẫn đè được khi cần, nhưng mặc định ở ĐÂY là `anthropic` — và nó chỉ
      # áp cho máy runner, KHÔNG đụng tới AI Copilot đang chạy trên production.
      - name: Máy runner đã sẵn sàng chưa
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER_AGENT || 'anthropic' }}
          DATABASE_URL: pglite://./data/agent-ci-db
        run: npm run agent:check

      # Dựng sổ agent + việc R0 qua ĐÚNG hàm dịch vụ mà `/tech` gọi. Người thao tác là tài khoản
      # GitHub đã bấm Run — `seedTechAgents()` từ chối mọi actor không phải người (AGENTS.md mục
      # 23), và workflow này chỉ chạy được bằng `workflow_dispatch`.
      # ═══ HAI ĐƯỜNG VÀO, MỘT ĐẦU RA ═══
      #
      # Có `task` ⇒ lấy ĐÚNG việc ấy từ ERP qua cửa đọc hẹp rồi gieo vào CSDL tạm.
      # Không có ⇒ đường cũ: tự tạo một việc R0 để tự kiểm.
      #
      # Cả hai đều in `TASK_CODE=` nên các bước sau không cần biết mình đang ở đường nào.
      - name: Khởi tạo sổ agent và lấy việc
        id: setup
        env:
          DATABASE_URL: pglite://./data/agent-ci-db
          ERP_DOMAIN: ${{ vars.ERP_DOMAIN || 'erp.vnxcommerce.com' }}
          ERP_BASE_URL: ${{ vars.ERP_BASE_URL }}
          AGENT_INGEST_SECRET: ${{ secrets.AGENT_INGEST_SECRET }}
        run: |
          if [ -n "${{ inputs.task }}" ]; then
            npm run --silent agent:fetch-task -- --task "${{ inputs.task }}" --actor "github:${{ github.actor }}" | tee setup.log
          else
            npm run --silent agent:proof-setup -- --actor "github:${{ github.actor }}" | tee setup.log
          fi
          TASK_CODE="$(grep -oE '^TASK_CODE=.+' setup.log | tail -1 | cut -d= -f2)"
          if [ -z "$TASK_CODE" ]; then echo "::error::Không lấy được mã việc."; exit 1; fi
          echo "task_code=$TASK_CODE" >> "$GITHUB_OUTPUT"

          # ═══ VAI ĐI THEO VIỆC, KHÔNG PHẢI MỘT HẰNG SỐ Ở ĐÂY ═══
          #
          # ĐÃ CẮN THẬT, lượt chạy #21: việc thật thứ hai được giao cho vai QA, còn bước chạy gọi
          # `--agent documentation`. Bước lấy việc chỉ BẬT vai của chính việc ấy, nên vai bị gọi
          # nhầm đang TẮT và lượt chạy BLOCKED trước khi gọi model một lần nào. Việc đã tới đúng
          # nơi — chỉ cái TÊN VAI là bịa ra ở tầng YAML.
          AGENT_KEY="$(grep -oE '^AGENT_KEY=.+' setup.log | tail -1 | cut -d= -f2)"
          if [ -z "$AGENT_KEY" ]; then echo "::error::Không lấy được vai agent."; exit 1; fi
          # Hình dạng ĐÓNG: khoá vai này đi thẳng vào một mẫu tên nhánh ở bước đẩy.
          case "$AGENT_KEY" in
            *[!a-z0-9_-]*|"") echo "::error::Vai agent có ký tự lạ: $AGENT_KEY"; exit 1 ;;
          esac
          echo "agent_key=$AGENT_KEY" >> "$GITHUB_OUTPUT"
          # MÃ VIỆC TRÊN PRODUCTION. Có ô `task` ⇒ mã vừa lấy CHÍNH LÀ mã production (script lấy
          # việc đã đổi mã của CSDL tạm về đúng nó). Không có ⇒ lượt TỰ KIỂM, để RỖNG: lượt ấy không
          # thuộc việc nào trên production, và cửa chép sổ khi ấy không gắn nó vào đâu cả.
          if [ -n "${{ inputs.task }}" ]; then
            echo "prod_task_code=$TASK_CODE" >> "$GITHUB_OUTPUT"
          else
            echo "prod_task_code=" >> "$GITHUB_OUTPUT"
          fi

      # ═══ CHẠY LẠI PHẢI ĐI KÈM MỘT VIỆC CÓ THẬT ═══
      #
      # Không có `task` thì bước khởi tạo tự tạo một việc R0 MỚI mỗi lượt — và trần "3 lượt cho một
      # việc" đếm theo VIỆC, nên mỗi lượt chạy lại sẽ đứng trên một việc mới và trần không bao giờ
      # chạm tới. Vòng lặp ấy tốn tiền thật, nên nó dừng ở đây chứ không dừng ở hoá đơn.
      - name: Kiểm điều kiện chạy lại
        if: inputs.rerun_branch != '' || inputs.feedback != ''
        run: |
          if [ -z "${{ inputs.task }}" ]; then
            echo "::error::Chạy lại (rerun_branch/feedback) phải kèm mã việc ở ô task — trần số lượt đếm theo VIỆC."
            exit 1
          fi
          if [ -z "${{ inputs.rerun_branch }}" ]; then
            echo "::error::Có feedback nhưng không có rerun_branch: phản hồi review chỉ có nghĩa khi sửa tiếp trên nhánh đã mở PR."
            exit 1
          fi

      - name: Chạy agent
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER_AGENT || 'anthropic' }}
          DATABASE_URL: pglite://./data/agent-ci-db
          # QUA BIẾN MÔI TRƯỜNG, KHÔNG QUA `${{ }}` TRONG THÂN LỆNH: hai ô này do người ngoài gõ, và
          # một dấu nháy trong phản hồi review không được phép trở thành một lệnh shell thứ hai.
          RERUN_BRANCH: ${{ inputs.rerun_branch }}
          FEEDBACK: ${{ inputs.feedback }}
        run: |
          if [ -n "${RERUN_BRANCH:-}" ]; then
            printenv FEEDBACK > agent-feedback.txt || : > agent-feedback.txt
            npm run --silent agent:run -- \
              --task "${{ steps.setup.outputs.task_code }}" \
              --agent "${{ steps.setup.outputs.agent_key }}" \
              --gates "${{ inputs.gates }}" \
              --rerun-branch "$RERUN_BRANCH" \
              --feedback-file agent-feedback.txt \
              --feedback-author "github:${{ github.actor }}"
          else
            npm run --silent agent:run -- \
              --task "${{ steps.setup.outputs.task_code }}" \
              --agent "${{ steps.setup.outputs.agent_key }}" \
              --gates "${{ inputs.gates }}"
          fi

      # ═══ PHẠM VI TỆP: KIỂM BẰNG GIT, KHÔNG HỎI AGENT ═══
      # Một tệp thứ hai ⇒ lượt chạy KHÔNG ĐẠT. Tuyệt đối không sửa hộ agent rồi vẫn tính là đạt.
      # `always()` một mình là chưa đủ: lượt đầu tiên dừng ở bước kiểm khoá, chưa có mã việc nào,
      # nên bước này chạy với `--task ` và in ra Thiếu --task — một thông báo chẳng nói gì về
      # nguyên nhân thật, đứng ngay dưới nguyên nhân thật và che mất nó.
      - name: Kiểm phạm vi tệp và in bằng chứng
        if: always() && steps.setup.outputs.task_code != ''
        env:
          DATABASE_URL: pglite://./data/agent-ci-db
        run: npm run --silent agent:proof-report -- --task "${{ steps.setup.outputs.task_code }}"

      # ═══ CHÉP SỔ VỀ PRODUCTION (phương án B) ═══
      #
      # Máy này KHÔNG nối được PostgreSQL production, và giữ nguyên tính chất đó là chủ ý: *code
      # chưa qua review không chạy cạnh CSDL production*. Nên sổ đi qua một cửa HTTP hẹp, xác thực
      # bằng `CRON_SECRET`, chỉ ghi được đúng bảng `tech_agent_runs` và chỉ TẠO, không SỬA.
      #
      # `continue-on-error` là chủ ý: bằng chứng THẬT của lượt chạy là hiện vật + nhánh git đã đẩy.
      # Một lần ERP bận không được làm cả lượt chạy agent trông như hỏng. Bước tự in "CHƯA BẬT" khi
      # kho chưa khai khoá, thay vì ném một lỗi mạng khó hiểu.
      #
      # TÊN MIỀN suy từ ĐÚNG nguồn mà `deploy-vps.yml` đã dùng — không khai lại lần thứ hai, vì hai
      # chỗ khai cùng một giá trị là hai chỗ để chúng lệch nhau.
      #
      # KHOÁ là khoá RIÊNG của cửa chép sổ, KHÔNG phải `CRON_SECRET`: khoá bộ lập lịch mở được hàng
      # chục job đồng bộ (có cả job GHI hàng loạt), và máy này chạy mã CHƯA QUA REVIEW.
      - name: Chép sổ lượt chạy về ERP
        if: always() && steps.setup.outputs.task_code != ''
        continue-on-error: true
        env:
          DATABASE_URL: pglite://./data/agent-ci-db
          ERP_DOMAIN: ${{ vars.ERP_DOMAIN || 'erp.vnxcommerce.com' }}
          ERP_BASE_URL: ${{ vars.ERP_BASE_URL }}
          AGENT_INGEST_SECRET: ${{ secrets.AGENT_INGEST_SECRET }}
        run: npm run --silent agent:report -- --task "${{ steps.setup.outputs.task_code }}" --prod-task "${{ steps.setup.outputs.prod_task_code }}"

      # Nhánh phải sống sót sau khi máy Actions bị xoá, nếu không bằng chứng biến mất cùng nó.
      # Chỉ đẩy nhánh mang đúng tiền tố; mọi tên khác bị từ chối trước khi `git push` chạy.
      - name: Đẩy nhánh agent (KHÔNG phải main)
        id: day
        if: always() && steps.setup.outputs.task_code != ''
        env:
          RERUN_BRANCH: ${{ inputs.rerun_branch }}
          CO_VIEC: ${{ inputs.task }}
          VAI: ${{ steps.setup.outputs.agent_key }}
        run: |
          # Lượt chạy lại đẩy ĐÚNG nhánh được yêu cầu; `git branch --list` chỉ là đường của lượt mới.
          BR="${RERUN_BRANCH:-$(git branch --list "ai/$VAI/*" --format '%(refname:short)' | head -1)}"
          if [ -z "$BR" ]; then echo "Không có nhánh agent nào để đẩy."; exit 0; fi
          case "$BR" in
            "ai/$VAI/"*) : ;;
            *) echo "::error::Từ chối đẩy nhánh ngoài phạm vi: $BR"; exit 1 ;;
          esac
          git push origin "refs/heads/$BR:refs/heads/$BR"
          echo "Đã đẩy $BR — CHƯA merge, CHƯA deploy. Người xem rồi quyết."

          # ═══ BỐN ĐIỀU KIỆN MỚI MỞ PR, VÀ MỖI ĐIỀU KIỆN CHẶN MỘT KIỂU RÁC KHÁC ═══
          #
          #  1. CÓ MÃ VIỆC. Không có thì bước khởi tạo tự tạo một việc R0 để TỰ KIỂM — mở PR cho nó
          #     nghĩa là mỗi lượt chạy kiểm chứng đẻ một PR không ai cần.
          #  2. KHÔNG PHẢI LƯỢT CHẠY LẠI. Nấc 5 sinh ra để sửa tiếp trên nhánh ĐÃ CÓ PR; mở thêm PR
          #     thứ hai cho cùng nhánh vừa hỏng vừa trái ý nghĩa của cả nấc ấy.
          #  3. CÓ COMMIT THẬT so với `main`. Agent không đổi gì thì PR sẽ rỗng — GitHub từ chối, và
          #     một lượt chạy hỏng ở bước cuối chỉ vì không có gì để mở là một cảnh báo giả.
          #  4. (ở job sau) LƯỢT CHẠY PHẢI THÀNH CÔNG.
          if [ -z "${CO_VIEC:-}" ]; then echo "Không mở PR: lượt tự kiểm, không có mã việc."; exit 0; fi
          if [ -n "${RERUN_BRANCH:-}" ]; then echo "Không mở PR: đây là lượt chạy lại, PR đã có sẵn."; exit 0; fi
          SO_COMMIT="$(git rev-list --count "origin/main..refs/heads/$BR" || echo 0)"
          if [ "$SO_COMMIT" = "0" ]; then echo "Không mở PR: nhánh không có commit nào so với main."; exit 0; fi
          echo "nhanh_pr=$BR" >> "$GITHUB_OUTPUT"
          echo "Sẽ mở PR cho $BR ($SO_COMMIT commit)."

      # Chữ của PR dựng bằng HÀM THUẦN có bài kiểm (`lib/constants/agent-pr-text.ts`), không ghép
      # chuỗi trong YAML: kho PUBLIC nên đây là chỗ dễ rò rỉ nội dung việc nhất.
      - name: Dựng tiêu đề và thân PR
        id: chu
        if: steps.day.outputs.nhanh_pr != ''
        env:
          DATABASE_URL: pglite://./data/agent-ci-db
        run: npm run --silent agent:pr-text -- --task "${{ steps.setup.outputs.task_code }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bang-chung-agent
          path: |
            bang-chung-agent.json
            setup.log
          if-no-files-found: warn

  # ═══════════ AGENT TỰ MỞ PR — MẮT XÍCH CUỐI CỦA DÂY CHUYỀN ═══════════
  #
  # Gọi lại ĐÚNG cầu nối mà người vẫn gọi (`agent-open-pr.yml`), không dựng đường thứ hai: một cầu
  # nối thứ hai là một bộ hàng rào thứ hai, và hai bộ hàng rào sớm muộn cũng lệch nhau.
  #
  # `needs.agent.result == 'success'` là điều kiện thứ tư (ba điều kiện kia ở bước đẩy nhánh).
  # Lượt chạy hỏng vẫn ĐẨY NHÁNH — bằng chứng phải sống sót — nhưng KHÔNG mở PR: một PR mở ra từ
  # lượt chạy hỏng là mời người xem đi đọc thứ chính máy đã biết là chưa xong.
  #
  # Cầu nối KHÔNG checkout và KHÔNG chạy một dòng nào của nhánh nguồn, nên mã do agent viết không
  # bao giờ gặp secret của App. Điều đó không đổi khi người gọi là máy thay vì người.
  mo-pr:
    needs: agent
    if: needs.agent.result == 'success' && needs.agent.outputs.nhanh_pr != ''
    uses: ./.github/workflows/agent-open-pr.yml
    with:
      head: ${{ needs.agent.outputs.nhanh_pr }}
      base: main
      title: ${{ needs.agent.outputs.pr_title }}
      body: ${{ needs.agent.outputs.pr_body }}
    secrets: inherit
