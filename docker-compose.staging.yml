# ───────────── BẢN CHẠY THỬ NHÂN SỰ AI — TÁCH HOÀN TOÀN KHỎI PRODUCTION ─────────────
#
# Chạy:  docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
# Dừng:  docker compose -f docker-compose.staging.yml down
# Xoá sạch kèm dữ liệu: docker compose -f docker-compose.staging.yml down -v
#
# KHÔNG dùng docker-compose.prod.yml và KHÔNG chạy trong /root/erp.
#
# Bốn thứ tách khỏi production, mỗi thứ vì một lý do cụ thể:
#   · tên project `vnx-ai-staging`  → docker không gộp hai ngăn xếp làm một
#   · tên container `vnx-ai-*`      → không lệnh nào gõ nhầm vào container đang phục vụ khách
#   · volume `vnx_ai_staging_pgdata`→ CSDL riêng hoàn toàn, không có đường nào chạm dữ liệu thật
#   · cổng 127.0.0.1:3100           → chỉ nghe trên máy, không ra Internet cho tới khi có Caddy
#
# KHÔNG có service `scheduler`: bản chạy thử không tự chạy job nào. Chạy tay khi cần.
# KHÔNG có service `caddy`: cổng 80/443 do Caddy của production giữ, đụng vào là đụng vào khách.
name: vnx-ai-staging

services:
  db:
    image: postgres:16-alpine
    container_name: vnx-ai-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?can STAGING_POSTGRES_PASSWORD trong .env.staging}
      POSTGRES_DB: erp
    # CẤU HÌNH CHO MỘT MÁY 2 GB, KHÔNG PHẢI CHO MỘT MÁY CHỦ CSDL.
    #
    # Mặc định của Postgres (`shared_buffers` 128 MB, `max_connections` 100) được chọn cho máy dư
    # RAM. Ở đây tải là 10–30 hội thoại đọc bằng mắt, nên mỗi MB nhường lại là một MB production
    # không phải tranh. `max_connections` 20 vẫn dư cho một ứng dụng Next.js một tiến trình.
    command: >
      postgres
      -c shared_buffers=48MB
      -c max_connections=20
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=128MB
      -c max_wal_size=512MB
    # TRẦN BỘ NHỚ — đây là lớp bảo vệ PRODUCTION, không phải lớp bảo vệ bản chạy thử.
    # Chạm trần thì Docker giết container NÀY. Không có trần thì nhân chọn tiến trình lớn nhất toàn
    # máy, và tiến trình lớn nhất đang là ERP phục vụ khách.
    #
    # CỐ Ý KHÔNG khai `memswap_limit`: nó cần nhân bật swap accounting, mà nhiều nhân VPS tắt sẵn —
    # khai vào là rước một cảnh báo (hoặc một lỗi) ở đúng lúc đang dựng. Không khai thì Docker tự
    # cho phép dùng thêm swap bằng đúng phần RAM, và swap chính là thứ vừa thêm vào để làm đệm.
    mem_limit: 320m
    volumes:
      - vnx_ai_staging_pgdata:/var/lib/postgresql/data
    # KHÔNG publish cổng: chỉ app trong cùng mạng nội bộ mới nói chuyện được với CSDL này.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    # ẢNH DỰNG SẴN, KHÔNG DỰNG TRÊN VPS.
    #
    # Đo ngày 14/09/2026: VPS có 1.963 MB RAM, 949 MB khả dụng, SWAP = 0, 2 lõi. `next build` cần
    # hơn thế, và kho mã này đã ghi hai lượt deploy chết vì SIGKILL khi hai `next build` chạy cùng
    # lúc trên chính máy ấy. Dựng ảnh của bản chạy thử ngay cạnh production đang phục vụ khách là
    # đặt cược cửa hàng vào một lượt build — nên ảnh được dựng ở máy chạy GitHub (7 GB RAM, không
    # phục vụ ai) rồi VPS chỉ `docker pull`.
    #
    # `build: .` vẫn giữ làm đường lùi cho máy dư RAM (máy của lập trình viên), nhưng `staging-up.sh`
    # KHÔNG tự dựng: phải gõ `--build-here`, và `staging-preflight.sh` chặn nếu RAM không đủ.
    #
    # TÊN ẢNH mặc định khai rõ để không bao giờ đụng `erp-app:local` của production — trùng tên ảnh
    # là một lần `up --build` của bên này ghi đè ảnh mà container bên kia đang chạy.
    image: ${STAGING_IMAGE:-vnx-ai-staging-app:local}
    build: .
    container_name: vnx-ai-staging-app
    env_file: .env.staging
    environment:
      DATABASE_URL: postgresql://erp:${STAGING_POSTGRES_PASSWORD}@db:5432/erp?schema=public
      PORT: "3000"
      # ───────── CHẶN CỨNG, ĐẶT Ở ĐÂY CÓ CHỦ Ý ─────────
      # Khối `environment` ĐÈ LÊN `env_file`. Nghĩa là dù .env.staging có ghi gì, dù ai sửa nhầm,
      # dù một câu SQL đổi bảng `settings` — những công tắc ghim ở đây vẫn giữ nguyên cho tới khi
      # có người sửa CHÍNH TỆP NÀY rồi dựng lại container.
      #
      # HAI MỨC RỦI RO, HAI CÁCH GHIM — và sự khác nhau ấy là toàn bộ thiết kế của nấc trợ lý:
      #
      #   MÁY TỰ GỬI (`AI_ALLOW_AUTO_SEND`) ghim CỨNG ở đây. Không một thao tác ops nào, không một
      #   câu SQL nào, không một lần sửa .env.staging nào mở được nó. Muốn mở phải sửa tệp này,
      #   commit, qua cổng kiểm thử, rồi dựng lại — tức là phải có người CHỦ Ý làm điều đó.
      #
      #   NHÂN VIÊN BẤM GỬI (`AI_ALLOW_HUMAN_APPROVED_SEND`) KHÔNG ghim: nó đọc từ .env.staging để
      #   chủ shop bật/tắt được cho đợt thí điểm mà không cần một lượt phát hành. Rủi ro của nó
      #   khác hẳn — đằng sau mỗi tin là một người đã đọc và đã bấm.
      #
      # Tên CŨ `AI_ALLOW_CUSTOMER_SEND` vẫn ghim "false" để nó không thành một cửa sau: sau bản
      # tách, nó chỉ còn nghĩa "nhân viên bấm gửi", và đường duy nhất để bật nghĩa ấy là tên MỚI.
      AI_ALLOW_AUTO_SEND: "false"
      AI_ALLOW_CUSTOMER_SEND: "false"
      AI_ALLOW_ORDER_CREATE: "false"
      AI_DEFAULT_MODE: "SHADOW"
      #
      # `AI_WORKFORCE_PROVIDER` KHÔNG ghim ở đây nữa — nó đọc từ `.env.staging`.
      #
      # Ghim ra đời khi nhân sự AI còn tự diễn giải `AI_PROVIDER` (biến của AI Copilot, bộ giá trị
      # khác): ghim là cách chặn một biến bị hiểu nhầm. Nay nhân sự AI KHÔNG đọc biến ấy nữa, nên
      # lý do ghim đã hết — còn cái giá thì vẫn đó: đổi nhà cung cấp phải sửa tệp này rồi dựng lại
      # container, cho một quyết định vận hành lẽ ra chỉ là một dòng trong .env.
      #
      # BA THỨ CHẶN VIỆC GỌI MÔ HÌNH VẪN NGUYÊN, và không cái nào phụ thuộc vào ghim này:
      #   · `AI_MODEL_CALLS_ENABLED` mặc định "false" — `runModelStep()` chặn MỌI bước gọi mô hình;
      #   · hai công tắc ở trên vẫn ghim, nên dù mô hình có chạy thì vẫn 0 tin gửi khách, 0 đơn;
      #   · chưa có khoá nào thì `defaultProviderName()` rơi về `stub`, tức không gọi mạng.
      # Trần heap V8 thấp hơn trần container: Node dọn rác trước khi Docker phải giết nó.
      NODE_OPTIONS: "--max-old-space-size=448"
      # Không nhận webhook đơn hàng và không gọi Viettel Post: bản chạy thử chỉ cần đọc hội thoại.
      PANCAKE_WEBHOOK_SECRET: ""
      # SePay: webhook TIỀN VÀO TÀI KHOẢN. Bản chạy thử không có lý do gì để nhận nó, và nhận trùng
      # là hai nơi cùng ghi một giao dịch ngân hàng.
      SEPAY_WEBHOOK_SECRET: ""
      SEPAY_WEBHOOK_API_KEY: ""
      SEPAY_API_TOKEN: ""
      VIETTELPOST_API_KEY: ""
      VIETTELPOST_USERNAME: ""
      VIETTELPOST_PASSWORD: ""
      VIETTELPOST_WEBHOOK_SECRET: ""
      FACEBOOK_ACCESS_TOKEN: ""
    # TRẦN BỘ NHỚ, cùng lý do với CSDL: chạm trần thì Docker giết container NÀY chứ không để nhân
    # chọn nạn nhân trên toàn máy. 640 MB dư cho một tiến trình Next.js chỉ phục vụ vài người soát.
    mem_limit: 640m
    # RESTART CÓ GIỚI HẠN. `unless-stopped` mà gặp vòng lặp OOM thì nó dựng lại mãi và đốt CPU của
    # một máy 2 lõi đang phục vụ khách. Hỏng 3 lần thì đứng yên để người xem log — một bản chạy thử
    # nằm im không hại ai, một bản chạy thử quay vòng thì có.
    restart: on-failure:3
    ports:
      # CHỈ nghe trên localhost. Muốn ra Internet thì thêm route Caddy (deploy/Caddyfile.ai-staging),
      # và chỉ sau khi mọi thứ ở mục 8 của docs/ai-staging-runbook.md đã xanh.
      - "127.0.0.1:${STAGING_PORT:-3100}:3000"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  vnx_ai_staging_pgdata:
