services:
  db:
    image: postgres:16-alpine
    container_name: erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_secret
      POSTGRES_DB: erp
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: erp-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://erp:erp_secret@db:5432/erp?schema=public
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    container_name: erp-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://erp:erp_secret@db:5432/erp?schema=public
      ERP_INTERNAL_URL: http://app:3000
    command: ["node", "scripts/scheduler.mjs"]
    depends_on:
      - app

volumes:
  erp_pgdata:
