# Triển khai thật trên VPS: PostgreSQL + ERP + scheduler + Caddy (HTTPS tự động Let's Encrypt).
# Chạy:  docker compose -f docker-compose.prod.yml up -d --build
# Biến ERP_DOMAIN và POSTGRES_PASSWORD đọc từ file .env cùng thư mục.
services:
  db:
    image: postgres:16-alpine
    container_name: erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret}
      POSTGRES_DB: erp
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # MỘT image cho cả app lẫn scheduler. Trước đây cả hai khai `build: .` nên compose dựng HAI lần
    # cùng lúc — hai `next build` song song trên VPS ~1,9 GB là đúng cách bị SIGKILL (deploy #208, #227).
    build: .
    image: erp-app:local
    container_name: erp-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD:-erp_secret}@db:5432/erp?schema=public
      APP_URL: https://${ERP_DOMAIN:-erp.vnxcommerce.com}
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    # Dùng lại image của app (đã dựng ở trên), không dựng lần hai.
    image: erp-app:local
    container_name: erp-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD:-erp_secret}@db:5432/erp?schema=public
      ERP_INTERNAL_URL: http://app:3000
    command: ["node", "scripts/scheduler.mjs"]
    depends_on:
      - app

  chatbot:
    # Bot chat bán hàng Pancake + Gemini (trước chạy trên máy Windows bằng Pancake Bot Manager).
    # Mã nguồn gắn CHỈ-ĐỌC từ ./chatbot; khoá (.env) và dữ liệu (cài đặt page, trạng thái tin) nằm
    # ở volume `chatbot_data`, nạp qua trang Bot chat của ERP — kho public nên không có khoá nào ở đây.
    # Không mở cổng ra Internet: bot tự quét tin (poll), ERP nói chuyện với nó qua mạng nội bộ.
    image: node:22-alpine
    container_name: erp-chatbot
    restart: unless-stopped
    working_dir: /app
    command: ["node", "erp-entry.mjs"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      PORT: "3456"
      DATA_DIR: /data
      BOT_ENV_FILE: /data/bot.env
      SYSTEM_PROMPT_FILE: /data/system.md
      # Khoá nội bộ ERP ↔ bot, install-vps.sh tự sinh vào .env của ERP. Rỗng ⇒ bot từ chối mọi lượt
      # quản trị từ xa (phía hẹp hơn), không phải mở toang.
      ADMIN_TOKEN: ${CHATBOT_ADMIN_TOKEN:-}
      # Đổi khi mã trong ./chatbot đổi ⇒ compose dựng lại container; deploy ERP khác không làm bot khởi động lại.
      CHATBOT_REV: ${CHATBOT_REV:-unknown}
    volumes:
      - ./chatbot:/app:ro
      - chatbot_data:/data
    expose:
      - "3456"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3456/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: erp-caddy
    restart: unless-stopped
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN:-erp.vnxcommerce.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  erp_pgdata:
  chatbot_data:
  caddy_data:
  caddy_config:
